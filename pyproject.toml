[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rmink"
version = "2.3.1"
description = "Convert images, photos, SVGs and PDFs into native, editable reMarkable ink (.rm v6 / .rmdoc)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["remarkable", "e-ink", "handwriting", "vectorization", "rmdoc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "rmscene==0.8.*",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "svgelements>=1.9",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/thagvall/rmink"
Source = "https://github.com/thagvall/rmink"
Issues = "https://github.com/thagvall/rmink/issues"
Changelog = "https://github.com/thagvall/rmink/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
heic = ["pillow-heif>=0.16"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
rounds = ["anthropic>=2.3", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.5", "mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27", "anthropic>=2.3"]

[project.scripts]
rmink = "rmink.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rmink"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Video production scripts: coordinate tables read better on one line.
"promo/*" = ["E501"]
