[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rmink"
version = "2.0.0.dev0"
description = "Convert images, photos, SVGs and PDFs into native, editable reMarkable ink (.rm v6 / .rmdoc)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["remarkable", "e-ink", "handwriting", "vectorization", "rmdoc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "rmscene==0.8.*",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "svgelements>=1.9",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
heic = ["pillow-heif>=0.16"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
rmink = "rmink.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rmink"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
