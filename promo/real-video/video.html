<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>rmink skola på riktigt</title>
<style>
:root { --paper: #f4f2ec; --ink: #1d1d1b; --muted: #6b6a65; --accent: #2b5fd9; --ok: #1f9d55; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }
body { position: relative; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.scene { position: absolute; inset: 0; opacity: 0; }
.cap { position: absolute; }
.beat { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
.chapter { font: 600 var(--fs-chapter)/1 "SF Mono", Menlo, monospace; color: var(--accent); letter-spacing: .04em; margin-bottom: var(--gap-s); }
.title { font-size: var(--fs-title); font-weight: 780; letter-spacing: -0.025em; line-height: 1.04; }
.body { font-size: var(--fs-body); line-height: 1.32; color: #3e3d39; margin-top: var(--gap-s); }
.real { display: inline-block; margin-top: var(--gap-m); font: 650 var(--fs-chip) "SF Mono", Menlo, monospace; color: var(--muted);
  border: 2px solid #d6d3ca; border-radius: 999px; padding: .3em .9em; background: #fff; }
.stage { position: absolute; }
.dev { position: absolute; }
.tablet { background: #262624; border-radius: 26px; padding: 16px 15px 22px; box-shadow: 0 30px 60px rgb(0 0 0 / .25), inset 0 0 0 2px #3a3a37; }
.screen { background: #fff; border-radius: 6px; overflow: hidden; position: relative; }
.bar { display: flex; justify-content: space-between; gap: 10px; padding: 0 12px; height: 32px; align-items: center;
  font: 500 15px "SF Mono", Menlo, monospace; color: #55544f; background: #fff; border-bottom: 1px solid #e6e3da; white-space: nowrap; overflow: hidden; }
.vp { position: relative; overflow: hidden; background: #fff; }
.sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.sheet img, .sheet svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.sheet path { fill: none; stroke: #1a1a1a; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.win { background: #f8f5ef; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 60px rgb(0 0 0 / .22), 0 0 0 1px rgb(0 0 0 / .1); }
.win .tb { height: 34px; background: #ebe7df; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 600 14px -apple-system, sans-serif; color: #6b6a65; }
.win .tb i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.ring { position: absolute; border: 5px solid var(--accent); border-radius: 14px; opacity: 0; pointer-events: none; }
.ring.ok { border-color: var(--ok); }
.flow { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.doc { background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14), 0 0 0 1px #e1ded5; padding: 14px 18px; display: flex; gap: 14px; align-items: center; font-size: var(--fs-chip); font-weight: 650; }
.doc img { width: 70px; border: 1px solid #ddd; }
.doc small { display: block; font: 500 calc(var(--fs-chip) * .7) "SF Mono", Menlo, monospace; color: var(--muted); margin-top: 4px; }
.pill { background: var(--accent); color: #fff; font-weight: 750; font-size: var(--fs-chip); padding: .55em 1.3em; border-radius: 14px; position: relative; }
.arrow { font-size: 44px; color: var(--accent); line-height: 1; }
.steps { display: grid; gap: 10px; }
.step { font-size: calc(var(--fs-chip) * .85); font-weight: 650; display: flex; gap: .6em; align-items: center; opacity: .25; }
.step .dot { width: 1.2em; height: 1.2em; border-radius: 50%; border: 3px solid #c9c5b9; display: grid; place-items: center; font-size: .8em; color: #fff; }
.step.on { opacity: 1; }
.step.done .dot { background: var(--ok); border-color: var(--ok); }
.step.done .dot::after { content: "✓"; font-weight: 900; }
.end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: var(--gap-m); }
.end .big { font-size: calc(var(--fs-title) * 1.25); font-weight: 820; letter-spacing: -0.035em; line-height: 1.02; }
.end .url { font: 650 var(--fs-body) "SF Mono", Menlo, monospace; color: var(--accent); }
.end .small { font-size: var(--fs-chip); color: var(--muted); }
#rail { position: absolute; display: flex; gap: 10px; justify-content: center; }
#rail div { font: 600 var(--fs-rail) "SF Mono", Menlo, monospace; color: #a3a097; padding: .35em .75em; border-radius: 999px; border: 2px solid transparent; white-space: nowrap; }
#rail div.on { color: var(--accent); border-color: var(--accent); background: #fff; }
#rail div.done { color: var(--ink); }
#bg { position: absolute; inset: 0; }
</style>
</head>
<body>
<svg id="bg"></svg>
<div id="rail"></div>
<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080), LAND = W > H;
Object.assign(document.body.style, { width: W + "px", height: H + "px" });
const L = LAND ? {
  cap: [110, 200, 600, 700], stage: [740, 30, 1120, 960], rail: [0, 1004, 1920, 50],
  fs: { chapter: 26, title: 72, body: 34, chip: 26, rail: 20 }, gap: { s: 16, m: 30 },
} : {
  cap: [70, 56, 940, 360], stage: [40, 400, 1000, 870], rail: [0, 1282, 1080, 50],
  fs: { chapter: 24, title: 58, body: 29, chip: 24, rail: 18 }, gap: { s: 12, m: 22 },
};
const rs = document.documentElement.style;
for (const [k, v] of Object.entries(L.fs)) rs.setProperty(`--fs-${k}`, v + "px");
for (const [k, v] of Object.entries(L.gap)) rs.setProperty(`--gap-${k}`, v + "px");
const place = (el, [x, y, w, h]) => Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });

const T = {
  ch: ["Mappen", "Provet", "Svara", "Skicka in", "Rättat", "Facit", "Resultat"],
  intro_t: "rmink skola\npå riktigt", intro_b: "Riktiga sidor från en arbetsbok i matte på en reMarkable: Plus och minus, rättad av rmink.",
  real: "Riktiga sidor · inget mockup",
  app_t: "Allt i sin mapp", app_b: "rmink / Skola / Matematik / Plus och minus. Senaste revisionen syns med poängen i namnet, äldre ligger i Tidigare.",
  cover_t: "Försättsblad\nmed innehåll", cover_b: "Claude har skrivit en blandad arbetsbok. Varje avsnitt i innehållet är en länk, och resultatet ligger sist.",
  write_t: "Eleven svarar\nmed pennan", write_b: "Tiokamrater skrivs i rutan och hundrakamrater kryssas i. Precis som på papper.",
  send_t: "Skicka in", send_b: "Plattan synkar. Be Claude köra nästa varv, så kommer nästa revision tillbaka.",
  s1: "Hämtar r01 från reMarkable", s2: "Läser handstil och kryss", s3: "Rättar mot facit", s4: "Skickar r02",
  run: "Kör nästa varv",
  marked_t: "Rättat", marked_b: "Handstilen har blivit text i rutan, kryssen är lästa, och varje fråga har fått Rätt 3/3 p.",
  facit_t: "Tänd facit", facit_b: "Facit ligger i ett dolt lager under varje ruta: rätt svar och hur man tänker.",
  res_t: "Resultatet", res_b: "Sist i provet: 6 av 41 poäng. Varje fråga med svar och poäng, och det som inte är besvarat syns direkt.",
  end_t: "Skriv för hand.\nrmink rättar.", end_s: "Gratis och öppen källkod",
};

const NS = "http://www.w3.org/2000/svg";
function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
const out3 = x => 1 - (1 - x) ** 3;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ramp = (t, a, b) => ease(prog(t, a, b));
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = 0.4) => Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b));
function path(t, keys) {  // smooth through [time, value...] keys
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const p = ease(prog(t, keys[i - 1][0], keys[i][0]));
    return keys[i].slice(1).map((v, j) => lerp(keys[i - 1][j + 1], v, p));
  }
  return keys[keys.length - 1].slice(1);
}

const bg = document.getElementById("bg");
bg.setAttribute("viewBox", `0 0 ${W} ${H}`);
for (let i = 0; i < 5; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 240 + i * 60); c.setAttribute("fill", ["#2b5fd9", "#d9622b", "#1f9d55"][i % 3]); c.setAttribute("opacity", ".045"); c._i = i; bg.appendChild(c); }
const bgAt = t => [...bg.children].forEach(c => { const i = c._i; c.setAttribute("cx", W * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.08 + i * 2.1)))); c.setAttribute("cy", H * (0.2 + 0.6 * (0.5 + 0.5 * Math.cos(t * 0.1 + i * 1.3)))); });

/* A tablet showing real page images (1243 x 1657 px renders), with a camera. */
const PW = 1243, PH = 1657;
function tablet(parent, screenW, bar, pages) {
  const s = screenW / PW, vh = PH * s;
  const d = h(`<div class="dev"><div class="tablet"><div class="screen"><div class="bar"><span class="name"></span><span></span></div><div class="vp"><div class="sheet"></div></div></div></div></div>`);
  d.querySelector(".screen").style.width = screenW + "px";
  const vp = d.querySelector(".vp"); vp.style.height = vh + "px";
  const sheet = d.querySelector(".sheet"); Object.assign(sheet.style, { width: PW + "px", height: PH + "px" });
  d.querySelector(".name").textContent = bar;
  const imgs = pages.map(src => { const im = h(`<img src="../out/real/${src}">`); sheet.appendChild(im); return im; });
  parent.appendChild(d);
  return { d, vp, sheet, imgs, s, name: d.querySelector(".name"), w: screenW + 30, h: vh + 32 + 38 };
}
// Zoom z on page point (fx, fy) in page px, kept inside the page. ZOOM off keeps
// every page whole; the rings still point things out.
const ZOOM = Q.get("zoom") === "1";
function cam(tb, z, fx, fy) {
  if (!ZOOM) z = 1;
  const k = tb.s * z, vw = PW * tb.s, vh = PH * tb.s;
  const tx = clamp(vw / 2 - fx * k, vw - PW * k, 0), ty = clamp(vh / 2 - fy * k, vh - PH * k, 0);
  tb.sheet.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
}
const at = (dev, x, y) => Object.assign(dev.d.style, { left: x + "px", top: y + "px" });
const [SX, SY, SW, SH] = L.stage;
const fitW = () => Math.min((SH - 70) * PW / PH, SW - 30);

/* scenes */
const scenes = [];
function scene(start, len, chapter, build) {
  const root = h(`<div class="scene"><div class="cap"></div><div class="stage"></div></div>`);
  document.body.appendChild(root);
  const cap = root.querySelector(".cap"), stage = root.querySelector(".stage");
  place(cap, L.cap); place(stage, L.stage);
  const s = { start, end: start + len, chapter, root, cap, stage, beats: [] };
  s.update = build(s) || (() => {});
  scenes.push(s);
  return s.end;
}
function beat(s, at, html) { const b = h(`<div class="beat">${html}</div>`); s.cap.appendChild(b); s.beats.push({ at, el: b }); }
function beats(s, lt) {
  s.beats.forEach((b, i) => {
    const next = s.beats[i + 1] ? s.beats[i + 1].at : 1e9;
    const inP = i === 0 ? out3(prog(lt, 0.05, 0.75)) : 1;
    b.el.style.opacity = (i === 0 ? 1 - ramp(lt, next - 0.4, next) : win(lt, b.at, next)) * inP;
    b.el.style.transform = `translateY(${(1 - inP) * 28}px)`;
  });
}
const cap = (chapter, title, body, extra = "") =>
  `${chapter ? `<div class="chapter">${chapter}</div>` : ""}<div class="title">${title.replace(/\n/g, "<br>")}</div>${body ? `<div class="body">${body}</div>` : ""}${extra}`;
const chap = i => `${i + 1} · ${T.ch[i]}`;
function ring(tb, cls) { const r = h(`<div class="ring ${cls || ""}"></div>`); tb.sheet.appendChild(r); return r; }
function ringAt(r, x, y, w, hh, o) { Object.assign(r.style, { left: x + "px", top: y + "px", width: w + "px", height: hh + "px", opacity: o, borderWidth: 6 + "px" }); }

let INK = [];
function build() {
  let t = 0;
  // Intro: the real cover comes in.
  t = scene(t, 4.5, -1, s => {
    beat(s, 0, cap("", T.intro_t, T.intro_b, `<div class="real">${T.real}</div>`));
    const tb = tablet(s.stage, fitW() * 0.92, "Plus och minus r01", ["r01-p01.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    s.stage.style.perspective = "1800px";
    cam(tb, 1, PW / 2, PH / 2);
    return lt => {
      beats(s, lt);
      const p = out3(prog(lt, 0.1, 1.6));
      tb.d.style.transform = `translateY(${(1 - p) * 120}px) rotateX(${(1 - p) * 18}deg) rotateZ(${(1 - p) * -4}deg) scale(${lerp(0.9, 1, p)})`;
      tb.d.style.opacity = p;
    };
  });

  // The app's folder view (a real screenshot).
  t = scene(t, 6.5, 0, s => {
    beat(s, 0, cap(chap(0), T.app_t, T.app_b));
    const iw = 1782, ih = 1104;
    const ww = Math.min(SW - 20, (SH - 80) * iw / ih), wh = ww * ih / iw;
    const w = h(`<div class="dev win"><div class="tb"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span style="margin-left:10px">reMarkable</span></div>
      <div class="vp" style="width:${ww}px;height:${wh}px"><div class="sheet" style="width:${iw}px;height:${ih}px"><img src="../out/real/app-folder.png"></div></div></div>`);
    s.stage.appendChild(w);
    Object.assign(w.style, { left: (SW - ww) / 2 + "px", top: (SH - wh - 34) / 2 + "px" });
    const sheet = w.querySelector(".sheet"), k0 = ww / iw;
    const r = h(`<div class="ring"></div>`); sheet.appendChild(r);
    return lt => {
      beats(s, lt);
      const p = out3(prog(lt, 0, 0.8));
      w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 40}px)`;
      // breadcrumb, then the workbook with its score
      const [z, fx, fy] = path(lt, [[0.6, 1, iw / 2, ih / 2], [1.5, 1.08, 870, 300], [2.9, 1.08, 870, 300], [3.5, 1, iw / 2, ih / 2], [4.3, 1.6, 557, 640], [5.4, 1.6, 557, 640], [6.2, 1, iw / 2, ih / 2]]);
      const k = k0 * (ZOOM ? z : 1), tx = clamp(ww / 2 - fx * k, ww - iw * k, 0), ty = clamp(wh / 2 - fy * k, wh - ih * k, 0);
      sheet.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
      const a = win(lt, 1.6, 2.9, 0.3), b = win(lt, 4.4, 5.5, 0.3);
      if (a > 0) ringAt(r, 36, 42, 1666, 96, a); else ringAt(r, 42, 848, 400, 98, b);
    };
  });

  // The cover with its table of contents.
  t = scene(t, 5.5, 1, s => {
    beat(s, 0, cap(chap(1), T.cover_t, T.cover_b));
    const tb = tablet(s.stage, fitW(), "Plus och minus r01", ["r01-p01.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    const r = ring(tb);
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.6));
      const [z, fx, fy] = path(lt, [[0.6, 1, PW / 2, PH / 2], [1.5, 1.5, 414, 560], [2.6, 1.5, 414, 560], [3.4, 1, PW / 2, PH / 2]]);
      cam(tb, z, fx, fy);
      ringAt(r, 44, 750, 1160, 570, win(lt, 3.5, 5.3, 0.3));
    };
  });

  // The pupil's real handwriting, written again stroke by stroke.
  t = scene(t, 7.5, 2, s => {
    beat(s, 0, cap(chap(2), T.write_t, T.write_b));
    const tb = tablet(s.stage, fitW(), "Plus och minus r01 · sida 2", ["r01-p02-blank.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${PW} ${PH}`); tb.sheet.appendChild(svg);
    const paths = INK.map(p => { const e = document.createElementNS(NS, "path"); e.setAttribute("d", p.d); e.setAttribute("stroke-width", p.w); e.setAttribute("pathLength", 1); svg.appendChild(e); return e; });
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.6));
      const [z, fx, fy] = path(lt, [[0.4, 1, PW / 2, PH / 2], [1.1, 1.35, 470, 690], [3.4, 1.35, 470, 690], [4.0, 1, PW / 2, PH / 2], [4.6, 1.6, 388, 1170], [6.3, 1.6, 388, 1170], [7.0, 1, PW / 2, PH / 2]]);
      cam(tb, z, fx, fy);
      // strokes in the order they were written: the boxed answer first, then the crosses
      const n = paths.length;
      paths.forEach((e, i) => {
        const a = i < 14 ? 1.3 + i * 0.13 : 4.8 + (i - 14) * 0.25;
        e.style.strokeDashoffset = 1 - ramp(lt, a, a + (i < 14 ? 0.2 : 0.25));
      });
    };
  });

  // Hand in: r01 goes in, r02 comes back.
  t = scene(t, 6, 3, s => {
    const steps = [T.s1, T.s2, T.s3, T.s4];
    beat(s, 0, cap(chap(3), T.send_t, T.send_b));
    const f = h(`<div class="flow">
      <div class="doc"><img src="../out/real/r01-p02.png"><div>Plus och minus r01<small>rmink / Skola / Matematik / Plus och minus</small></div></div>
      <div class="pill">${T.run}</div>
      <div class="steps">${steps.map(x => `<div class="step"><span class="dot"></span>${x}</div>`).join("")}</div>
      <div class="arrow">↓</div>
      <div class="doc r2"><img src="../out/real/r02-p02.png"><div>Plus och minus r02 · 6 av 41 p<small>Tidigare / Plus och minus r01</small></div></div></div>`);
    s.stage.appendChild(f);
    Object.assign(f.style, { left: 0, width: SW + "px", top: SH * 0.08 + "px" });
    const kids = [...f.children], stepEls = [...f.querySelectorAll(".step")], pill = f.querySelector(".pill");
    const ST = [1.4, 2.2, 3.0, 3.8];
    return lt => {
      beats(s, lt);
      kids.forEach((k, i) => { const at = [0.2, 0.7, 1.2, 4.4, 4.6][i]; const p = out3(prog(lt, at, at + 0.5)); k.style.opacity = p; k.style.transform = `translateY(${(1 - p) * 24}px)`; });
      pill.style.transform = lt > 1.0 && lt < 1.25 ? "scale(.95)" : "";
      stepEls.forEach((e, i) => { e.classList.toggle("on", lt >= ST[i]); e.classList.toggle("done", lt >= (ST[i + 1] || 4.5)); });
    };
  });

  // Marked: the same page, now r02.
  t = scene(t, 6.5, 4, s => {
    beat(s, 0, cap(chap(4), T.marked_t, T.marked_b));
    const tb = tablet(s.stage, fitW(), "Plus och minus r01 · sida 2", ["r01-p02.png", "r02-p02.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    const r1 = ring(tb, "ok"), r2 = ring(tb, "ok");
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.5));
      const [z, fx, fy] = path(lt, [[0.3, 1, PW / 2, PH / 2], [1.9, 1, PW / 2, PH / 2], [2.6, 1.8, 345, 650], [3.3, 1.8, 345, 650], [4.0, 1.8, 898, 650], [4.8, 1.8, 898, 650], [5.6, 1, PW / 2, PH / 2]]);
      cam(tb, z, fx, fy);
      const x = ramp(lt, 0.8, 1.6);
      tb.imgs[1].style.opacity = x;
      tb.name.textContent = x > 0.5 ? "Plus och minus r02 · 6 av 41 p" : "Plus och minus r01 · sida 2";
      ringAt(r1, 984, 604, 128, 58, win(lt, 4.0, 5.0, 0.3));
      ringAt(r2, 984, 983, 128, 58, win(lt, 5.6, 6.4, 0.3));
    };
  });

  // Facit: the hidden layer switched on.
  t = scene(t, 5.5, 5, s => {
    beat(s, 0, cap(chap(5), T.facit_t, T.facit_b));
    const tb = tablet(s.stage, fitW(), "Plus och minus r02 · 6 av 41 p", ["r02-p02.png", "r02-p02-facit.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.5));
      const [z, fx, fy] = path(lt, [[0.3, 1, PW / 2, PH / 2], [1.8, 1, PW / 2, PH / 2], [2.5, 1.6, 388, 880], [3.6, 1.6, 388, 880], [4.4, 1, PW / 2, PH / 2]]);
      cam(tb, z, fx, fy);
      tb.imgs[1].style.opacity = ramp(lt, 0.9, 1.6);
    };
  });

  // Results page.
  t = scene(t, 6, 6, s => {
    beat(s, 0, cap(chap(6), T.res_t, T.res_b));
    const tb = tablet(s.stage, fitW(), "Plus och minus r02 · sida 22", ["r02-p22.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    const r = ring(tb, "ok");
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.5));
      const [z, fx, fy] = path(lt, [[0.4, 1, PW / 2, PH / 2], [1.2, 1.9, 327, 330], [2.9, 1.9, 327, 330], [3.7, 1, PW / 2, PH / 2]]);
      cam(tb, z, fx, fy);
      ringAt(r, 44, 250, 420, 80, win(lt, 1.4, 3.0, 0.3));
    };
  });

  // End card.
  t = scene(t, 4, -2, s => {
    s.cap.remove(); s.stage.remove();
    const e = h(`<div class="end"><div class="big">${T.end_t.replace(/\n/g, "<br>")}</div><div class="url">rmink.vercel.app/skola</div><div class="small">${T.end_s}</div></div>`);
    s.root.appendChild(e);
    const parts = [...e.children];
    return lt => parts.forEach((p, i) => { const q = out3(prog(lt, 0.15 + i * 0.25, 0.9 + i * 0.25)); p.style.opacity = q; p.style.transform = `translateY(${(1 - q) * 30}px)`; });
  });
  return t;
}

const rail = document.getElementById("rail");
place(rail, L.rail);
T.ch.forEach(c => rail.appendChild(h(`<div>${c}</div>`)));
const FADE = 0.5;
function seek(t) {
  bgAt(t);
  let chapter = -1, railOp = 0;
  for (const s of scenes) {
    const a = ramp(t, s.start - FADE / 2, s.start + FADE / 2), b = 1 - ramp(t, s.end - FADE / 2, s.end + FADE / 2);
    const o = s.start === 0 ? (t < s.end ? 1 : b) : Math.min(a, b);
    s.root.style.opacity = o; s.root.style.display = o > 0 ? "" : "none";
    if (o > 0) s.update(t - s.start);
    if (s.chapter >= 0) railOp = Math.max(railOp, o);
    if (t >= s.start && t < s.end) chapter = s.chapter;
  }
  rail.style.opacity = railOp;
  [...rail.children].forEach((d, i) => { d.classList.toggle("on", i === chapter); d.classList.toggle("done", chapter >= 0 && i < chapter); });
}

fetch("../out/real/r01-p02-ink.json").then(r => r.json()).then(async ink => {
  INK = ink;
  window.DURATION = build();
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  window.seek = seek;
  seek(+(Q.get("t") || 0));
  window.ready = true;
});
</script>
