<style>
@font-face { font-family: "Caveat"; src: url("../out/assets/Caveat.ttf"); font-weight: 400 700; }
:root {
  --paper: #f4f2ec; --ink: #1d1d1b; --muted: #6b6a65; --accent: #2b5fd9;

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }
body {
  position: relative; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.scene { position: absolute; inset: 0; opacity: 0; }
.hand { font-family: "Caveat", cursive; font-weight: 650; color: #1d1d1b; }

/* Captions */
.cap { position: absolute; }
.beat { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
.chapter { font: 600 var(--fs-chapter)/1 "SF Mono", Menlo, monospace; color: var(--accent); letter-spacing: .04em; margin-bottom: var(--gap-s); }
.title { font-size: var(--fs-title); font-weight: 780; letter-spacing: -0.025em; line-height: 1.04; }
.body { font-size: var(--fs-body); line-height: 1.32; color: #3e3d39; margin-top: var(--gap-s); }
.steps { margin-top: var(--gap-m); display: grid; gap: calc(var(--gap-s) * .8); }
.step { font-size: var(--fs-chip); font-weight: 650; display: flex; gap: .6em; align-items: center; opacity: .25; }
.step .dot { width: 1.25em; height: 1.25em; border-radius: 50%; border: 3px solid #c9c5b9; flex: none; display: grid; place-items: center;

.step.on { opacity: 1; }
.step.done .dot { background: var(--ok); border-color: var(--ok); }

/* Stage, devices */
.stage { position: absolute; }
.dev { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.dev .lbl { font: 600 var(--fs-label) "SF Mono", Menlo, monospace; color: var(--muted); white-space: nowrap; }

.page { position: absolute; left: 0; top: 0; width: 600px; height: 800px; transform-origin: 0 0; background: #fbfaf6; padding: 34px 36px; }
.phone { background: #1b1b1a; border-radius: 44px; padding: 13px 11px 16px; box-shadow: 0 30px 60px rgb(0 0 0 / .25); }
.pscreen { border-radius: 32px; overflow: hidden; background: #f6f5f1; position: relative; }
.app { position: absolute; left: 0; top: 0; width: 360px; height: 740px; transform-origin: 0 0; padding: 18px 16px; }

.art .d { fill: #8d8a80; stroke: none; }

.facit .lab { font-size: 10px; color: #b4b1a8; }

.cv-strip { height: 10px; border-radius: 3px; }
.cv-title { font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin-top: 70px; line-height: 1.02; }
.cv-sub { font-size: 16px; color: #5b5a54; margin-top: 10px; }
.cv-mode { display: inline-block; margin-top: 18px; font: 700 13px -apple-system, sans-serif; color: var(--bad); border: 2px solid var(--bad); border-radius: 6px; padding: .2em .6em; }
.toc { margin-top: 50px; border-top: 1.4px solid #b9b6ad; }
.toc div { display: flex; justify-content: space-between; font-size: 17px; padding: 12px 0; border-bottom: 1px solid #dedbd2; color: var(--accent); }

#rail div.done { color: var(--ink); }
#bg { position: absolute; inset: 0; pointer-events: none; }

// Fill the boxes of a question page; returns handles per question.

/* ---------- scenes ---------- */
const scenes = [];
function scene(start, len, chapter, build) {
  const root = h(`<div class="scene"><div class="cap"></div><div class="stage"></div></div>`);
  document.body.appendChild(root);
  const cap = root.querySelector(".cap"), stage = root.querySelector(".stage");
  place(cap, L.cap); place(stage, L.stage);
  const s = { start, end: start + len, chapter, root, cap, stage, beats: [] };
  s.update = build(s) || (() => {});
  scenes.push(s);
  return s.end;
}
function beat(s, at, html) { const b = h(`<div class="beat">${html}</div>`); s.cap.appendChild(b); s.beats.push({ at, el: b }); return b; }
function beats(s, lt) {
  s.beats.forEach((b, i) => {
    const next = s.beats[i + 1] ? s.beats[i + 1].at : 1e9;
    const p = i === 0 ? 1 - ramp(lt, next - 0.4, next) : win(lt, b.at, next, 0.4);
    const inP = i === 0 ? out3(prog(lt, 0.05, 0.75)) : 1;
    b.el.style.opacity = p * inP;
    b.el.style.transform = `translateY(${(1 - inP) * 28}px)`;
  });
}
const cap = (chapter, title, body, extra = "") =>
  `${chapter ? `<div class="chapter">${chapter}</div>` : ""}<div class="title">${title.replace(/\n/g, "<br>")}</div>${body ? `<div class="body">${body}</div>` : ""}${extra}`;
const chap = i => `${i + 1} · ${T.ch[i]}`;
const [SX, SY, SW, SH] = L.stage;
// Largest tablet screen width that fits a stage height.
const tabW = (hAvail) => (hAvail - 30 - 38 - 38) * TAB_AR;

function build() {
  let t = 0;

  // Intro: the cover slides in with a tilt.
  t = scene(t, 4.5, -1, s => {
    beat(s, 0, cap("", T.intro_t, T.intro_b));
    const sw = Math.min(tabW(SH), SW * 0.62);
    const tb = tablet(s.stage, sw, `${T.wb} r01`);
    tb.add(coverHTML());
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    s.stage.style.perspective = "1800px";
    return lt => {
      beats(s, lt);
      const p = out3(prog(lt, 0.1, 1.6));
      tb.d.style.transform = `translateY(${(1 - p) * 120}px) rotateX(${(1 - p) * 18}deg) rotateZ(${(1 - p) * -4}deg) scale(${lerp(0.9, 1, p)})`;
      tb.d.style.opacity = p;
    };
  });

  // Subjects: three mini tablets fan in, then the groups and grades.
  t = scene(t, 8.5, 0, s => {
    beat(s, 0, cap(chap(0), T.subj_t, T.subj_b));
    const minis = [["math", T.mini1], ["sv", T.mini2], [T.mini3k, T.mini3]];
    const mw = Math.min((SW - 80) / 3 - 30, tabW(SH * 0.56));
    const figs = ["brak", "spring", T.mini3k === "math" ? "kvadrat" : "glass"];
    const devs = minis.map(([k, [title, q, a]], i) => {
      const fig = figs[i];
      const tb = tablet(s.stage, mw, title);
      tb.d.classList.add("mini");
      tb.add(`<div class="cv-strip" style="background:${subjColor[k]}"></div><div class="cv-title" style="font-size:40px;margin-top:40px">${title}</div>
        <div class="cv-sub" style="font-size:20px;color:${subjColor[k]};font-weight:700">${T[k]}</div>
        <div class="q" style="margin-top:60px"><div class="pr" style="font-size:22px;padding-right:0"><b>1.</b> ${q}</div>
        <div class="lines" style="height:110px;background:repeating-linear-gradient(to bottom,transparent 0 53px,#cfccc3 53px 54px)"><span class="hand" style="font-size:60px">${a}</span></div></div>
        ${art(fig, i === 0 ? "0 0 120 120" : "0 0 120 112").replace('class="art"', 'class="art" style="position:static;display:block;margin:40px auto 0;width:260px;height:240px"')}`);
      return tb;
    });
    const gap = (SW - devs.length * devs[0].w) / (devs.length + 1);
    devs.forEach((d, i) => at(d, gap + i * (d.w + gap), 0));
    const chips = h(`<div class="chips"></div>`);
    const rows = [["math", T.g_math], ["sv", T.g_sv], ["en", T.g_en]];
    rows.forEach(([k, gs]) => {
      const r = h(`<div class="chiprow"><span class="subj" style="color:${subjColor[k]}">${T[k]}</span></div>`);
      gs.forEach(g => r.appendChild(h(`<span class="chip" style="border-color:${subjColor[k]}">${g}</span>`)));
      chips.appendChild(r);
    });
    const gr = h(`<div class="chiprow"><span class="subj">${T.grade}</span><div class="grades">${[1,2,3,4,5,6,7,8,9].map(n => `<span>${n}</span>`).join("")}</div></div>`);
    chips.appendChild(gr);

        const p = pop(lt, 0.2 + i * 0.3, 0.8);
        const rot = (i - 1) * 6 * (1 - p);
        d.d.style.transform = `translateY(${(1 - p) * 200}px) rotate(${rot}deg) scale(${lerp(0.7, 1, p)})`;
        d.d.style.opacity = clamp(p * 1.5);

        if (p >= 1) d.d.style.transform = `translateY(${Math.sin(lt * 1.3 + i) * 5}px)`;
        reveal(hands[i], ramp(lt, 1.6 + i * 0.5, 2.6 + i * 0.5));

        g.style.borderColor = lt > 5.4 + i * 0.09 ? "var(--accent)" : ""; });

    tallStage(s);
    const tw = Math.min(tabW(SH), SW * 0.72);
    const tb = tablet(s.stage, tw, `${T.wp_wb} r01 · ${T.page} 3`);
    const pg = tb.add(`<div class="cv-strip" style="background:var(--math)"></div>
      <div class="pg-head" style="margin-top:12px"><span>${T.wp_wb}</span><span>3</span></div>
      <div class="pg-sec">${T.wp_sec}</div><div class="pg-text">${T.wp_how}</div>
      <div class="q wp"><div class="pr" style="font-size:18.5px;line-height:1.38;padding-right:140px"><b>5.</b> ${T.wp_q}</div>
        <div class="lines" style="height:176px;background:repeating-linear-gradient(to bottom,transparent 0 43px,#cfccc3 43px 44px)">
          ${T.wp_a.map((a, i) => `<span class="hand" style="top:${i * 44 - 2}px;font-size:40px">${a}</span>`).join("")}</div>
        <div class="verdict ok">${T.ok}</div>${art("bullar", "0 0 132 140").replace('class="art"', 'class="art" style="width:124px;height:132px;top:40px;right:14px"')}</div>
      <div class="q" style="opacity:.55"><div class="pr" style="font-size:16.5px"><b>6.</b> ${T.wp_next}</div><div class="lines" style="height:96px"></div></div>
      <div class="pg-foot"><span>${T.back}</span><span>${T.next}</span></div>`);
    at(tb, (SW - tb.w) / 2, (s.stage.offsetHeight - tb.h) / 2);
    const ZMAX = Math.min(1.6, (SW - 40) / tb.w);
    const q = pg.querySelector(".q.wp"), hands = [...q.querySelectorAll(".hand")], verdict = q.querySelector(".verdict");
    const pen = h(`<svg class="pen" viewBox="0 0 60 60"><path d="M8 52 L14 36 L44 6 L54 16 L24 46 Z" fill="#2a2a28"/><path d="M8 52 L14 36 L24 46 Z" fill="#c9c5b9"/></svg>`);
    tb.vp.appendChild(pen);
    const A = [1.0, 1.9, 2.8, 3.8];
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.6));
      const fy = q.offsetTop + 60 + 120 * ramp(lt, 1.0, 3.8);
      devCam(tb, 1 + (ZMAX - 1) * ramp(lt, 0.2, 0.9), fy);
      hands.forEach((e, i) => reveal(e, ramp(lt, A[i], A[i] + 0.8)));
      const i = A.findIndex(a => lt >= a && lt <= a + 0.85);
      if (i >= 0) {
        const r = hands[i].getBoundingClientRect(), v = tb.vp.getBoundingClientRect(), k = tb.z || 1, p = prog(lt, A[i], A[i] + 0.8);
        pen.style.left = (r.left - v.left + r.width * Math.min(p, 0.95)) / k - 6 + "px"; pen.style.top = (r.top - v.top + r.height * 0.6) / k - 52 + "px";
        pen.style.opacity = 1;
      } else pen.style.opacity = 0;
      const vp = pop(lt, 4.9);
      verdict.style.opacity = clamp(vp * 2); verdict.style.transform = `scale(${lerp(0.4, 1, vp)})`;
    };
  });

  // Create: the form on the phone, then the test flies to the tablet.
  t = scene(t, 7.5, 1, s => {
    beat(s, 0, cap(chap(1), T.create_t, T.create_b));
    const tw = Math.min(tabW(SH), SW * 0.5);
    const tb = tablet(s.stage, tw, "Skola / Svenska / Stavning");
    const folder = tb.add(`<div class="pg-head"><span>reMarkable</span><span></span></div><div class="pg-sec" style="font-size:30px">Stavning</div>
      <div class="pg-text">rmink / Skola / Svenska / Stavning</div>
      <div class="fl" style="margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:26px">
        <div class="item" style="opacity:0"><div style="aspect-ratio:3/4;background:#fff;border:1.5px solid #c9c5b9;border-radius:4px;border-top:8px solid var(--sv);padding:14px;font-weight:800;font-size:20px">${T.wb}</div>
        <div style="font-size:15px;margin-top:8px">${T.wb} r01</div></div></div>`);
    tb.add(coverHTML());
    const ph = phone(s.stage, Math.min(tw * 0.66, (SH - 30) * 360 / 740 - 10));
    ph.app.innerHTML = `<div class="a-top"><b>rmink</b><span>/rounds</span></div>
      <div class="card"><h4>${T.new_wb}</h4>
        <div class="field"><label>${T.f_skola}</label><div class="sel" data-v="${T.v_skola}">–</div></div>
        <div class="field"><label>${T.f_mom}</label><div class="sel" data-v="${T.v_mom}">–</div></div>
        <div class="field"><label>${T.f_grade}</label><div class="sel" data-v="${T.v_grade}">–</div></div>
        <div class="field"><label>${T.f_facit}</label><div class="sel" data-v="${T.v_facit}">–</div></div>
        <div class="btn">${T.b_create}</div><div class="status"></div></div>`;
    const totalW = ph.w + 50 + tb.w;
    const x0 = (SW - totalW) / 2;
    at(ph, x0, (SH - ph.h) / 2); at(tb, x0 + ph.w + 50, (SH - tb.h) / 2);
    const sels = [...ph.app.querySelectorAll(".sel")], btn = ph.app.querySelector(".btn"), status = ph.app.querySelector(".status");
    const tap = tapAt(ph.app, 0, 0); tap.style.width = tap.style.height = "40px";
    const fly = h(`<div style="position:absolute;width:70px;height:90px;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgb(0 0 0 / .25);border-top:8px solid var(--sv);opacity:0"></div>`);
    s.stage.appendChild(fly);
    const T0 = [0.9, 1.6, 2.3, 3.0], TB = 3.8, TS = 5.4;
    return lt => {
      beats(s, lt);
      const pin = out3(prog(lt, 0, 0.8));
      ph.d.style.transform = `translateX(${(1 - pin) * -80}px)`; ph.d.style.opacity = pin;
      tb.d.style.opacity = out3(prog(lt, 0.3, 1.1));
      const it = folder.querySelector(".item"), ip = pop(tb ? lt : 0, TS + 0.8, 0.5);
      it.style.opacity = clamp(ip * 2); it.style.transform = `scale(${lerp(0.6, 1, ip)})`;
      tb.pages[1].style.opacity = ramp(tb ? lt : 0, TS + 1.6, TS + 2.0);
      tb.doc.textContent = lt > TS + 1.6 ? `${T.wb} r01` : "Skola / Svenska / Stavning";
      sels.forEach((e, i) => {
        const on = lt >= T0[i] + 0.15;
        e.classList.toggle("set", on); e.firstChild.textContent = on ? e.dataset.v : "–";
      });
      // the tap moves to the current target
      let target = null, ta = 0;
      T0.forEach((a, i) => { if (lt >= a - 0.1) { target = sels[i]; ta = a; } });
      if (lt >= TB - 0.1) { target = btn; ta = TB; }
      if (target) {
        const r = target.offsetTop + target.offsetHeight / 2 + target.offsetParent.offsetTop, c = target.offsetLeft + target.offsetWidth / 2 + target.offsetParent.offsetLeft;
        tap.style.left = (target === btn ? c : c + 60) - 20 + "px"; tap.style.top = r - 20 + "px"; tapAnim(tap, lt, ta);
      }
      btn.style.transform = `scale(${lt > TB && lt < TB + 0.25 ? 0.96 : 1})`;
      status.innerHTML = lt < TB + 0.1 ? "" : lt < TS ? `<span class="spin" style="transform:rotate(${lt * 400}deg)"></span>${T.writing}`
        : `<b>✓</b> ${T.sent}<br><span style="font-family:SF Mono,Menlo,monospace;font-size:11.5px">rmink/Skola/${LANG === "sv" ? "Svenska/Stavning" : "Svenska/Stavning"}/</span>`;
      // the document flies from phone to tablet
      const fp = ramp(lt, TS, TS + 0.9);
      const ax = x0 + ph.w / 2 - 35, ay = (SH - ph.h) / 2 + ph.h * 0.55, bx = x0 + ph.w + 50 + tb.w / 2 - 35, by = (SH - 90) / 2;
      fly.style.opacity = fp > 0 && fp < 1 ? 1 : 0;
      fly.style.left = lerp(ax, bx, fp) + "px"; fly.style.top = lerp(ay, by, fp) - Math.sin(fp * Math.PI) * 140 + "px";
      fly.style.transform = `rotate(${fp * 14 - 7}deg) scale(${1 - fp * 0.2})`;
    };
  });

  // Write: zoomed on the question page, handwriting appears.
  t = scene(t, 7.5, 2, s => {
    beat(s, 0, cap(chap(2), T.write_t, T.write_b));
    const tw = Math.min(tabW(SH), SW * 0.72);
    tallStage(s);
    const tb = tablet(s.stage, tw, `${T.wb} r01 · ${T.page} 2`);
    const pg = tb.add(questionsHTML());
    const w = wire(pg);
    at(tb, (SW - tb.w) / 2, (s.stage.offsetHeight - tb.h) / 2);
    const ZMAX = Math.min(1.6, (SW - 40) / tb.w);
    const pen = h(`<svg class="pen" viewBox="0 0 60 60"><path d="M8 52 L14 36 L44 6 L54 16 L24 46 Z" fill="#2a2a28"/><path d="M8 52 L14 36 L24 46 Z" fill="#c9c5b9"/></svg>`);
    tb.vp.appendChild(pen);
    const A = 1.0;
    return lt => {
      beats(s, lt);
      const pin = out3(prog(lt, 0, 0.8));
      tb.d.style.opacity = pin;
      const z = lerp(0.94, 1, pin) + (ZMAX - 1) * (ramp(lt, 0.5, 1.3) - ramp(lt, 6.5, 7.3));
      devCam(tb, z, path(lt, [[A - 0.3, qy(w, 0)], [A + 0.6, qy(w, 0)], [A + 1.0, qy(w, 1)], [A + 2.2, qy(w, 2)], [A + 3.5, qy(w, 3)]]));
      writeAt(w, lt, A);
      // the pen follows the stroke being written
      const spans = [[A, A + 0.7, w.qs[0].cross[1]], ...[1, 2, 3].map(i => [A + 0.8 + (i - 1) * 1.25, A + 1.8 + (i - 1) * 1.25, w.qs[i].hand])];
      const cur = spans.find(([a, b]) => lt >= a && lt <= b + 0.25);
      if (cur && lt < A + 5.2) {
        const [a, b, e] = cur, p = prog(lt, a, b);
        const r = e.getBoundingClientRect(), v = tb.vp.getBoundingClientRect();
        const k = tb.z || 1;
        pen.style.left = (r.left - v.left + r.width * Math.min(p, 0.95)) / k - 6 + "px"; pen.style.top = (r.top - v.top + r.height * 0.6) / k - 52 + "px";
        pen.style.opacity = 1;
      } else pen.style.opacity = 0;
    };
  });

  // Hand in: tap Run next round, the steps tick through.
  t = scene(t, 6.5, 3, s => {
    const steps = [T.s1, T.s2, T.s3, T.s4];
    beat(s, 0, cap(chap(3), T.send_t, T.send_b, `<div class="steps">${steps.map(x => `<div class="step"><span class="dot"></span>${x}</div>`).join("")}</div>`));
    const tw = Math.min(tabW(SH), SW * 0.5);
    const tb = tablet(s.stage, tw, `${T.wb} r01 · ${T.page} 2`);
    const w = wire(tb.add(questionsHTML())); written(w);
    const ph = phone(s.stage, Math.min(tw * 0.62, (SH - 30) * 360 / 740 - 10));
    ph.app.innerHTML = `<div class="a-top"><b>rmink</b><span>/rounds</span></div>
      <div class="group-head">${T.head}</div>
      <div class="card"><div style="display:flex;justify-content:space-between"><b style="font-size:16px">${T.wb}<span class="kind">${LANG === "sv" ? "arbetsbok" : "workbook"}</span></b><span class="muted" style="margin:0">r01</span></div>
        <p class="muted meta">${T.card_meta}</p><div class="btn">${T.run}</div><div class="status"></div></div>
      <div class="card" style="opacity:.55"><b style="font-size:15px">${LANG === "sv" ? "Grammatik åk 4" : "Grammar, year 4"}</b><p class="muted">${LANG === "sv" ? "Övning · r03 · 6 av 7 p" : "Practice · r03 · 6 of 7 p"}</p></div>`;
    const totalW = tb.w + 50 + ph.w, x0 = (SW - totalW) / 2;
    at(tb, x0, (SH - tb.h) / 2); at(ph, x0 + tb.w + 50, (SH - ph.h) / 2);
    const btn = ph.app.querySelector(".btn"), status = ph.app.querySelector(".status"), meta = ph.app.querySelector(".meta");
    const tap = tapAt(ph.app, 0, 0);
    const stepEls = [...s.cap.querySelectorAll(".step")];
    const TT = 1.6, ST = [2.0, 2.9, 3.9, 5.0], DONE = 6.0;
    return lt => {
      beats(s, lt);
      const pin = out3(prog(lt, 0, 0.8));
      ph.d.style.opacity = pin; ph.d.style.transform = `translateX(${(1 - pin) * 80}px)`;
      tb.sync.textContent = lt > 0.6 ? `☁ ${T.synced}` : "";
      tb.sync.style.color = lt > 0.6 ? "var(--ok)" : "";
      const c = btn.offsetParent;
      tap.style.left = c.offsetLeft + btn.offsetLeft + btn.offsetWidth / 2 + "px"; tap.style.top = c.offsetTop + btn.offsetTop + btn.offsetHeight / 2 + "px";
      tapAnim(tap, lt, TT);
      btn.style.transform = `scale(${lt > TT && lt < TT + 0.25 ? 0.95 : 1})`;
      stepEls.forEach((e, i) => { e.classList.toggle("on", lt >= ST[i]); e.classList.toggle("done", lt >= (ST[i + 1] || DONE)); });
      const cur = ST.filter(a => lt >= a).length;
      status.innerHTML = lt < TT + 0.2 ? "" : lt < DONE ? `<span class="spin" style="transform:rotate(${lt * 400}deg)"></span>${steps[Math.max(cur - 1, 0)]}…`
        : `<b>✓</b> <span class="score">${T.card_done}</span>`;
      // the tablet page pulses as it is read
      const scan = prog(lt, ST[1], ST[2]);
      tb.vp.style.boxShadow = scan > 0 && scan < 1 ? `inset 0 ${lerp(-10, 800 * tb.s, scan)}px 0 -${800 * tb.s - 40}px rgb(43 95 217 / .18)` : "";
    };
  });

  // Marked: handwriting becomes text, verdicts pop.
  t = scene(t, 6, 4, s => {
    beat(s, 0, cap(chap(4), T.graded_t, T.graded_b));
    const tw = Math.min(tabW(SH), SW * 0.72);
    tallStage(s);
    const tb = tablet(s.stage, tw, `${T.wb} r02 · 4 ${LANG === "sv" ? "av" : "of"} 4 p`);
    const w = wire(tb.add(questionsHTML())); written(w);
    at(tb, (SW - tb.w) / 2, (s.stage.offsetHeight - tb.h) / 2);
    const ZMAX = Math.min(1.6, (SW - 40) / tb.w);
    return lt => {
      beats(s, lt);
      const pin = out3(prog(lt, 0, 0.7));
      tb.d.style.opacity = pin;
      gradeAt(w, lt, 0, [1.2, 2.0, 2.8, 3.6]);
      const z = 1 + (ZMAX - 1) * (ramp(lt, 0.3, 1.0) - ramp(lt, 4.7, 5.6));
      devCam(tb, z, path(lt, [[0.6, qy(w, 0)], [1.4, qy(w, 0)], [1.8, qy(w, 1)], [2.6, qy(w, 2)], [3.4, qy(w, 3)]]));
    };
  });

  // Results page with the ring filling.
  t = scene(t, 5, 5, s => {
    beat(s, 0, cap(chap(5), T.res_t, T.res_b));
    const tw = Math.min(tabW(SH), SW * 0.72);
    const tb = tablet(s.stage, tw, `${T.wb} r02 · ${T.page} 5`);
    const pg = tb.add(resultsHTML());
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    const arc = pg.querySelector(".arc"), pct = pg.querySelector(".pct"), rows = [...pg.querySelectorAll(".rs-row")];
    return lt => {
      beats(s, lt);
      const pin = out3(prog(lt, 0, 0.7));
      tb.d.style.opacity = pin; tb.d.style.transform = `translateX(${(1 - pin) * 60}px)`;
      const p = out3(prog(lt, 0.8, 2.4));
      arc.setAttribute("stroke-dashoffset", 100 - 100 * p);
      pct.textContent = Math.round(100 * p) + " %";
      rows.forEach((r, i) => { const q = out3(prog(lt, 1.5 + i * 0.35, 2.1 + i * 0.35)); r.style.opacity = q; r.style.transform = `translateY(${(1 - q) * 18}px)`; });
    };
  });

  // A wrong answer, later: Fel, a comment and the key.
  t = scene(t, 6, 6, s => {
    beat(s, 0, cap(chap(6), T.wrong_t, T.wrong_b));
    tallStage(s);
    const tw = Math.min(tabW(SH), SW * 0.72);
    const tb = tablet(s.stage, tw, `${T.wb} r02 · ${T.page} 2`);
    const w = wire(tb.add(questionsHTML()), true); written(w); gradeAt(w, 1e3, 0);
    at(tb, (SW - tb.w) / 2, (s.stage.offsetHeight - tb.h) / 2);
    const ZMAX = Math.min(1.6, (SW - 40) / tb.w);
    const x = w.qs[2], f = w.fac[2];
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.6));
      devCam(tb, 1 + (ZMAX - 1) * (ramp(lt, 0.2, 1.0) - ramp(lt, 5.0, 5.8)), qy(w, 2) + 20);
      // only the wrong box changes here; the rest is marked already
      const p = ramp(lt, 1.1, 1.6);
      x.hand.style.opacity = 1 - p; x.typed.style.opacity = p;
      const v = pop(lt, 1.9);
      x.verdict.style.opacity = clamp(v * 2); x.verdict.style.transform = `scale(${lerp(0.4, 1, v)})`;
      const c = ramp(lt, 2.6, 3.1);
      x.comment.style.opacity = c; x.comment.style.height = 18 * c + "px";
      f.style.clipPath = `inset(-20% ${100 - ramp(lt, 3.4, 4.4) * 100}% -20% 0)`;
      x.q.style.boxShadow = lt > 1.9 ? `0 0 0 ${3 * ramp(lt, 1.9, 2.2)}px rgb(211 53 44 / .35)` : "";
    };
  });

  // Facit: open the layers panel, switch on the answers.
  t = scene(t, 5.5, 7, s => {
    beat(s, 0, cap(chap(7), T.facit_t, T.facit_b));
    const tw = Math.min(tabW(SH), SW * 0.72);
    const tb = tablet(s.stage, tw, `${T.wb} r02 · ${T.page} 2`);
    const pg = tb.add(questionsHTML());
    const w = wire(pg); written(w); gradeAt(w, 1e3, 0);
    tallStage(s);
    at(tb, (SW - tb.w) / 2, (s.stage.offsetHeight - tb.h) / 2);
    const ZMAX = Math.min(1.6, (SW - 40) / tb.w);
    const panel = h(`<div class="layers"><h5>${T.layers}</h5><div class="row"><span>${T.layer1}</span><span class="tog on"><i style="left:19px"></i></span></div>
      <div class="row"><span>Facit</span><span class="tog f"><i></i></span></div></div>`);
    pg.appendChild(panel);
    const tog = panel.querySelector(".tog.f"), knob = tog.querySelector("i");
    const tap = tapAt(pg, 0, 0);
    const TT = 1.2;
    return lt => {
      beats(s, lt);
      tb.d.style.opacity = out3(prog(lt, 0, 0.6));
      const pp = out3(prog(lt, 0.5, 1.0)) * (1 - ramp(lt, TT + 0.3, TT + 0.6));
      panel.style.opacity = pp; panel.style.transform = `translateY(${(1 - pp) * -14}px)`;
      const on = ramp(lt, TT, TT + 0.25);
      knob.style.left = 3 + 16 * on + "px"; tog.classList.toggle("on", on > 0.5);
      tap.style.left = panel.offsetLeft + tog.offsetLeft + 19 + "px"; tap.style.top = panel.offsetTop + tog.offsetTop + 11 + "px";
      tapAnim(tap, lt, TT);
      w.fac.forEach((f, i) => { const p = ramp(lt, TT + 0.7 + i * 0.6, TT + 1.3 + i * 0.6); f.style.clipPath = `inset(-20% ${100 - p * 100}% -20% 0)`; });
      const z = 1 + (ZMAX - 1) * (ramp(lt, TT + 0.4, TT + 1.0) - ramp(lt, 4.6, 5.4));
      devCam(tb, z, path(lt, [[TT + 0.4, qy(w, 0) + 40], [TT + 1.1, qy(w, 0) + 40], [TT + 1.8, qy(w, 1) + 40], [TT + 2.4, qy(w, 2) + 40], [TT + 3.0, qy(w, 3) + 40]]));
    };
  });

  // End card.
  t = scene(t, 4, -2, s => {
    s.cap.remove(); s.stage.remove();
    const e = h(`<div class="end"><div class="subjects"><span style="background:var(--math)">${T.math}</span><span style="background:var(--sv)">${T.sv}</span><span style="background:var(--en)">${T.en}</span></div>
      <div class="big">${T.end_t.replace(/\n/g, "<br>")}</div><div class="url">rmink.vercel.app/rounds</div><div class="small">${T.end_s}</div></div>`);
    s.root.appendChild(e);
    const parts = [...e.children];
    return lt => parts.forEach((p, i) => { const q = out3(prog(lt, 0.15 + i * 0.25, 0.9 + i * 0.25)); p.style.opacity = q; p.style.transform = `translateY(${(1 - q) * 30}px)`; });
  });
  return t;
}

/* Chapter rail */
const rail = document.getElementById("rail");
place(rail, L.rail);
T.ch.forEach(c => rail.appendChild(h(`<div>${c}</div>`)));

const FADE = 0.5;
function seek(t) {
  bgAt(t);
  let chapter = -1, railOp = 0;
  for (const s of scenes) {
    const a = ramp(t, s.start - FADE / 2, s.start + FADE / 2), b = 1 - ramp(t, s.end - FADE / 2, s.end + FADE / 2);
    const o = s.start === 0 ? (t < s.end ? 1 : b) : Math.min(a, b);
    s.root.style.opacity = o;
    s.root.style.display = o > 0 ? "" : "none";
    if (o > 0) s.update(t - s.start);
    if (s.chapter >= 0) railOp = Math.max(railOp, o);
    if (t >= s.start && t < s.end) chapter = s.chapter;
  }
  rail.style.opacity = railOp;
  [...rail.children].forEach((d, i) => { d.classList.toggle("on", i === chapter); d.classList.toggle("done", chapter >= 0 && i < chapter); });
}

document.fonts.load('650 40px "Caveat"').then(() => {
  window.DURATION = build();
  window.seek = seek;
  seek(+(Q.get("t") || 0));
  window.ready = true;
});
</script>
</body>
</html>
