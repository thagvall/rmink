    if (t >= a) { const x = eIO(P(t, a, b)); p = { x: mix(A.x, Bb.x, x), y: mix(A.y, Bb.y, x), s: mix(A.s, Bb.s, x) }; }
  }
  return p;
};

  set(snickHand, { transform: `translate(${sp.x + (1 - eOut(sIn)) * 360} ${sp.y + (1 - eOut(sIn)) * 320 + (mTip ? 0 : -6)}) scale(.58)`, display: sIn > 0 ? "inline" : "none" });
  set(say, { transform: `translate(440 92) scale(${.66 * eBack(P(t, T.mark + .9, T.mark + 1.25))})`, opacity: fade(t, T.mark + .9, T.mark + 4, .2) });

  // Name beside the device
  tagName.textContent = page <= 0 ? "Bastu r01" : page === 1 ? "Bastu r02" : "Bastu r03";
  tagScore.textContent = page === 0 ? "2 frågor" : "";
  tagScore.style.transform = `scale(${eBack(P(t, T.r01, T.r01 + .4))})`;
  tag.style.opacity = Math.max(fade(t, T.r01, T.meet - .1), fade(t, T.mark, T.ext));

  // Folding rule on the table once the carpenter has come
  tableProps.setAttribute("opacity", t > T.meet ? 1 : 0);

  // The AI scene
  const nA = P(t, T.ai - .9, T.ai - .1), nB = 1 - P(t, T.r01 - .7, T.r01);
  const nightOn = Math.min(nA, nB);
  set(night, { opacity: nightOn, display: nightOn > 0 ? "inline" : "none" });
  rings.forEach((r, i) => r.setAttribute("transform", `rotate(${(i % 2 ? -1 : 1) * t * (28 + i * 12)})`));
  halo.setAttribute("r", 200 + Math.sin(t * 3) * 14);
  const [ox, oy] = L.orb, [sx, sy] = L.small;
  MOTES.forEach((m, i) => {
    const onn = ((t - T.ai) * .55 + m.o) % 1;
    const x = mix(sx + m.a * 120, ox + m.b * 30, onn) + Math.sin(onn * 6 + i) * 34 * (1 - onn);
    const y = mix(sy - 120, oy, eIO(onn));
    set(moteEls[i], { cx: x, cy: y, opacity: fade(t, T.ai, T.ai + 3.2, .5) * Math.sin(onn * Math.PI) });
  });
  flyDigits.forEach((d, i) => {
    const a = T.ai + .2 + i * .45, f = eIO(P(t, a, a + 1.5));
    const c = mix(sx + (i - 1.5) * 90, ox, f), y = mix(sy - 140, oy, f);
    set(d, { x: c + Math.sin(f * 5) * 28 * (1 - f), y, opacity: t >= a ? 1 - P(f, .78, 1) : 0, "font-size": 62 * (1 - f * .6) });
  });
  const back = eIO(P(t, T.r01 - 1.8, T.r01 - .6));
  set(docFly, { transform: `translate(${mix(ox, sx, back)} ${mix(oy, sy, back)}) scale(${mix(.4, 1, Math.min(back * 3, 1))}) rotate(${(1 - back) * -8})`, opacity: t >= T.r01 - 1.9 ? 1 - P(back, .86, 1) : 0 });
  const CK = [T.ai + .4, T.ai + 1.7, T.ai + 2.8, T.ai + 3.8];
  checks.forEach((c, i) => { c.classList.toggle("on", t >= CK[i] - .1); c.classList.toggle("done", t >= CK[i] + .9); });
  aiBeat.style.opacity = fade(t, T.ai + .1, T.r01 - .3, .35);
  aiBeat.style.transform = `translateY(${(1 - eOut(P(t, T.ai + .1, T.ai + .6))) * 26}px)`;

  // The finished sauna
  const eo = P(t, T.ext - .5, T.ext + .2);
  set(ext, { opacity: eo, display: eo > 0 ? "inline" : "none" });
  smoke.forEach((c, i) => {
    const u = ((t * .22 + i / 9) % 1);
    set(c, { cx: 173 + Math.sin(u * 7 + i) * 26 * u + u * 90, cy: -262 - u * 420, r: 14 + u * 46, opacity: .4 * Math.sin(u * Math.PI) });
  });

  scrim.style.opacity = Math.max(on, eo);
  document.getElementById("capBack").style.opacity = LAND ? 0 : Math.min(P(t, T.ans, T.ans + .6), 1 - P(t, T.r02 + .1, T.r02 + .6));

  // Captions and rail
  BEATS.forEach(([a, b], i) => {
    beatEls[i].style.opacity = fade(t, a, b, .35);
    beatEls[i].style.transform = `translateY(${(1 - eOut(P(t, a, a + .5))) * 26}px)`;
  });
  STEPS.forEach(([, a], i) => {
    const next = i < STEPS.length - 1 ? STEPS[i + 1][1] : T.end;
    railEls[i].className = t >= a && t < next ? "on" : t >= next ? "done" : "";
  });
  rail.style.opacity = P(t, T.sketch, T.sketch + .5) * (1 - P(t, T.end - .1, T.end + .3));

  // End
  const end = P(t, T.end, T.end + .55);
  const e = document.getElementById("end");
  e.style.opacity = end;
  e.style.transform = `scale(${mix(1.04, 1, eOut(end))})`;
}
window.seek = seek;
// Draw order: table, night sky, laptop, tablet, then the two full-frame scenes.
s.appendChild(table); s.appendChild(night); s.appendChild(lap); s.appendChild(tab); s.appendChild(k); s.appendChild(ext);
Promise.all([document.fonts.load('700 40px "Caveat"'), ...PAGES.map((p) => new Promise((ok) => { const i = new Image(); i.onload = ok; i.onerror = ok; i.src = p.getAttribute("href"); }))]).then(() => document.fonts.ready).then(() => { seek(0); window.ready = true; });
</script>
</body>
</html>
