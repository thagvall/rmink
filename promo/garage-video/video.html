<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>rmink: garaget</title>
<style>
@font-face { font-family: "Caveat"; src: url("../out/assets/Caveat.ttf"); font-weight: 400 700; }
:root { --warm: #ffd089; --ok: #2fbf71; --bad: #ff6b5e; --facit: #3f6fd8; --ai: #8fb0ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #17140f; }
body { position: relative; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
svg { position: absolute; inset: 0; }
svg text { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
.mono { font-family: "SF Mono", Menlo, monospace !important; }
.script { font-family: "Caveat", cursive !important; font-weight: 700; }
#cap { position: absolute; color: #fff; }
.beat { position: absolute; left: 0; width: 100%; opacity: 0; will-change: transform; }
.chapter { font: 600 var(--fs-chapter)/1 "SF Mono", Menlo, monospace; color: var(--warm); letter-spacing: .04em; margin-bottom: .55em; }
.title { font-size: var(--fs-title); font-weight: 800; letter-spacing: -.028em; line-height: 1.02; white-space: pre-line; }
.body { font-size: var(--fs-body); line-height: 1.3; color: #d9d4c9; margin-top: .6em; white-space: pre-line; }
#checks { margin-top: 1em; display: grid; gap: .45em; font-size: var(--fs-body); font-weight: 650; }
#checks div { display: flex; gap: .55em; align-items: center; opacity: .22; }
#checks i { width: 1.05em; height: 1.05em; border-radius: 50%; border: 3px solid #7f8bb0; flex: none; display: grid; place-items: center; font-size: .8em; font-style: normal; color: #0f1630; }
#checks .on { opacity: 1; }
#checks .done i { background: var(--ai); border-color: var(--ai); }
#checks .done i::after { content: "✓"; font-weight: 900; }
#capBack { position: absolute; left: 0; right: 0; top: 0; height: 330px; opacity: 0; background: linear-gradient(#2b1e15 88%, rgb(43 30 21 / 0)); }
#rail { position: absolute; display: flex; gap: 6px; justify-content: center; left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 999px; background: rgb(12 10 8 / .72); }
#rail div { font: 600 var(--fs-rail) "SF Mono", Menlo, monospace; color: rgb(255 255 255 / .42); padding: .32em .7em; border-radius: 999px; border: 2px solid transparent; white-space: nowrap; }
#rail .done { color: rgb(255 255 255 / .82); }
#rail .on { color: #17140f; background: var(--warm); }
#tag { position: absolute; display: flex; gap: .7em; align-items: baseline; padding: .5em .8em; border-radius: 14px; background: rgb(12 10 8 / .78); color: #fff; opacity: 0; white-space: nowrap; }
#tag .name { font: 600 var(--fs-tag) "SF Mono", Menlo, monospace; color: #d9d4c9; }
#tag .score { font-size: calc(var(--fs-tag) * 1.7); font-weight: 800; letter-spacing: -.02em; color: var(--warm); transform-origin: left center; display: inline-block; }
#end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 26px; background: #f4f2ec; color: #1d1d1b; opacity: 0; }
#end .big { font-size: calc(var(--fs-title) * 1.35); font-weight: 830; letter-spacing: -.035em; line-height: 1.02; }
#end .big span { color: #2b5fd9; display: block; }
#end .url { font: 650 var(--fs-body) "SF Mono", Menlo, monospace; color: #2b5fd9; }
#end .small { font-size: calc(var(--fs-body) * .82); color: #6b6a65; }
#scrim { position: absolute; inset: 0; opacity: 0; }
#cards { position: absolute; }
.card { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; color: #fff; }
.card .head { display: flex; align-items: center; gap: .4em; font-size: var(--fs-title); font-weight: 800; letter-spacing: -.02em; }
.card .head b { display: grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--warm); color: #17140f; }
.card .row { display: flex; gap: 30px; margin-top: 22px; align-items: flex-start; }
.stack { width: var(--stack); flex: none; border: 3px solid #17140f; background: #17140f; display: flex; flex-direction: column; gap: 2px; }
.lay { display: grid; place-items: center; font: 650 var(--fs-lay) "SF Mono", Menlo, monospace; overflow: hidden; white-space: nowrap; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { font: 650 var(--fs-fact) "SF Mono", Menlo, monospace; padding: .3em .55em; border-radius: 8px; background: rgb(255 255 255 / .12); }
.card ul { list-style: none; margin-top: 16px; display: grid; gap: 8px; font-size: var(--fs-li); line-height: 1.22; color: #e9e4d8; }
.card li { padding-left: 1.2em; position: relative; }
.card li::before { position: absolute; left: 0; font-weight: 900; }
.card li.p::before { content: "+"; color: #7fe0a8; }
.card li.m::before { content: "−"; color: #ff9d8f; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="scrim"></div>
<div id="capBack"></div>
<div id="cap"></div>
<div id="cards"></div>
<div id="tag"><span class="name"></span><span class="score"></span></div>
<div id="rail"></div>
<div id="end"><div class="big">Skissa du.<span>rmink ritar rent.</span></div><div class="url">rmink.vercel.app/bygg</div><div class="small">Gratis och öppen källkod. Med din egen Claude.</div></div>
<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080), LAND = W > H;
Object.assign(document.body.style, { width: W + "px", height: H + "px" });
const SVGNS = "http://www.w3.org/2000/svg";
const s = document.getElementById("s");
s.setAttribute("viewBox", `0 0 ${W} ${H}`); s.setAttribute("width", W); s.setAttribute("height", H);

const L = LAND
  ? { cap: [90, 0, 570], capY: 300, stage: [1330, 520], ts: 1.13, ls: 1.0, small: [1330, 780, .5], orb: [1330, 250],
      fs: { chapter: 25, title: 76, body: 34, rail: 19, tag: 22 }, tag: [90, 690], railY: 1012, zoom: 1.5, zoomY: 500 }
  : { cap: [70, 0, 940], capY: 66, stage: [540, 850], ts: .96, ls: .98, small: [540, 1050, .46], orb: [540, 620],
      fs: { chapter: 23, title: 60, body: 30, rail: 15, tag: 19 }, tag: [70, 278], railY: 1290, zoom: 1.55, zoomY: 860 };
const rs = document.documentElement.style;
for (const [k, v] of Object.entries(L.fs)) rs.setProperty(`--fs-${k}`, v + "px");
const cap = document.getElementById("cap");
Object.assign(cap.style, { left: L.cap[0] + "px", top: L.capY + "px", width: L.cap[2] + "px" });
document.getElementById("rail").style.top = L.railY + "px";
Object.assign(document.getElementById("cards").style, LAND ? { left: "90px", top: "130px", width: "600px" } : { left: "70px", top: "56px", width: "940px" });
for (const [k, v] of Object.entries(LAND ? { stack: 210, lay: 18, fact: 21, li: 29 } : { stack: 200, lay: 16, fact: 19, li: 25 })) rs.setProperty("--" + k.replace("stack", "stack").replace("lay", "fs-lay").replace("fact", "fs-fact").replace("li", "fs-li"), v + "px");
const tag = document.getElementById("tag"), tagName = tag.children[0], tagScore = tag.children[1];
Object.assign(tag.style, { left: L.tag[0] + "px", top: L.tag[1] + "px" });

// Helpers. Everything is a pure function of t, so any frame can be rendered.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, x) => a + (b - a) * x;
const fade = (t, a, b, f = .4) => Math.min(P(t, a, a + f), 1 - P(t, b - f, b));
const el = (tag, attrs = {}, parent = s) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  parent.appendChild(e);
  return e;
};
const group = (parent = s, attrs = {}) => el("g", attrs, parent);
const set = (e, attrs) => { for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const wrap = (parent, text, x, y, width, size, attrs = {}) => {
  const lines = []; let line = "";
  for (const word of text.split(" ")) {
    const next = line ? line + " " + word : word;
    if (next.length * size * .5 > width && line) { lines.push(line); line = word; } else line = next;
  }
  lines.push(line);
  return lines.map((l, i) => el("text", { x, y: y + i * size * 1.28, "font-size": size, text: l, ...attrs }, parent));
};

// ------------------------------------------------------------- timeline
const T = { sketch: 4, ask: 13, ai: 16.5, r01: 21.5, alt: 25, pick: 40.2, r02: 47, ext: 54, end: 57.4 };
const OPT = 3.8; // seconds per alternative
window.DURATION = 60;
const STEPS = [["Skiss", T.sketch], ["Rita rent", T.ask], ["AI ritar", T.ai], ["Frågor", T.r01], ["A", T.alt], ["B", T.alt + OPT], ["C", T.alt + 2 * OPT], ["D", T.alt + 3 * OPT], ["Välj", T.pick], ["r02", T.r02], ["Bygget", T.ext]];
const rail = document.getElementById("rail");
const railEls = STEPS.map(([n]) => { const d = document.createElement("div"); d.textContent = n; rail.appendChild(d); return d; });

const BEATS = [
  [.5, 3.7, "En tomt, en bil", "Garaget ska stå\nhär.", "Men hur tjock ska bottenplattan vara?"],
  [T.sketch + .2, T.ask, "1 · Skiss", "Rita för hand.\nFråga på sidan.", "6 × 4,5 meter och en fråga: hur tjock, och vilka alternativ finns?"],
  [T.ask + .2, T.ai, "2 · Rita rent", "En mening\ntill Claude.", "Skissen och frågan synkar från plattan."],
  [T.r01 + .2, T.alt, "3 · Frågor", "Ren ritning,\nnya frågor.", "Bottenplattan har fått en egen sida."],
  [T.pick + .2, T.r02, "4 · Välj", "Svara med pennan.", "Isolerat, uppvärmt till 5 grader, alternativ B. Och tio meter till tomtgränsen."],
  [T.r02 + 2.6, T.ext, "5 · r02", "B står på\nritningen.", "Lagren är inritade, och två nya frågor väntar."],
  [T.ext + .3, T.end, "6 · Bygget", "Från fråga\ntill underlag.", "Konstruktören bestämmer tjocklek och armering."],
];
const scrim = document.getElementById("scrim");
scrim.style.background = LAND ? "linear-gradient(90deg, rgb(12 14 24 / .66) 30%, rgb(12 14 24 / 0) 46%)" : "linear-gradient(rgb(12 14 24 / .8) 24%, rgb(12 14 24 / 0) 34%)";
const beatEls = BEATS.map(([, , c, t, b]) => {
  const d = document.createElement("div"); d.className = "beat";
  d.innerHTML = `<div class="chapter"></div><div class="title"></div><div class="body"></div>`;
  d.children[0].textContent = c; d.children[1].textContent = t; d.children[2].textContent = b;
  cap.appendChild(d); return d;
});
const aiBeat = document.createElement("div"); aiBeat.className = "beat";
aiBeat.innerHTML = `<div class="chapter">2 · Rita rent</div><div class="title">Claude tar fram\nalternativen.</div>`
  + `<div id="checks"><div><i></i>Läser skissen och frågan</div><div><i></i>Slår upp bottenplattor</div><div><i></i>Räknar U-värde och vikt</div><div><i></i>Ritar A, B, C och D</div></div>`;
cap.appendChild(aiBeat);
const checks = [...aiBeat.querySelectorAll("#checks div")];

// The four alternatives, as printed on page 2 of Garage r01
const MAT = {
  betong: ["Betong", "#a3a8ad"], eps: ["EPS", "#f1eee4"], eps2: ["EPS 200", "#e4dfcf"], xps: ["XPS", "#8fc4e8"],
  makadam: ["Makadam", "#8a8275"], skum: ["Skumglas", "#5d6a62"],
};
const OPTIONS = [
  { k: "A", name: "Standard", layers: [["betong", 100], ["eps", 300], ["makadam", 150]], facts: ["550 mm", "U ≈ 0,12", "515 kg/m²", "Kostnad: låg"], pro: ["Beprövad och billig", "Lätt att få tag på material och hantverkare"], con: ["Klarar inte alltid energikraven ensam"] },
  { k: "B", name: "Förstärkt", layers: [["betong", 150], ["eps2", 300], ["makadam", 150]], facts: ["600 mm", "U ≈ 0,11", "635 kg/m²", "Kostnad: medel"], pro: ["Bär mer och sprider lasten", "Stabilare mot sprickor"], con: ["Mer betong och armering"] },
  { k: "C", name: "XPS", layers: [["betong", 100], ["xps", 300], ["makadam", 150]], facts: ["550 mm", "U ≈ 0,11", "520 kg/m²", "Kostnad: hög"], pro: ["Tar upp mycket lite vatten", "Tål högt tryck"], con: ["Dyrare per m² än EPS"] },
  { k: "D", name: "Skumglas", layers: [["betong", 100], ["skum", 400]], facts: ["500 mm", "U ≈ 0,21", "340 kg/m²", "Kostnad: medel"], pro: ["Ett lager i stället för två", "Dränerar och bryter kapillärt"], con: ["Tjockare för samma U-värde"] },
];
const cardsEl = document.getElementById("cards");
const MMPX = LAND ? .52 : .42;
OPTIONS.forEach((o) => {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<div class="chapter">3 · Alternativ</div><div class="head"><b>${o.k}</b><span>${o.name}</span></div><div class="row"><div class="stack"></div><div class="info"><div class="facts"></div><ul></ul></div></div>`;
  const st = c.querySelector(".stack");
  o.els = o.layers.map(([m, mm]) => {
    const l = document.createElement("div"); l.className = "lay"; l.style.background = MAT[m][1];
    l.style.color = ["betong", "eps", "eps2", "xps"].includes(m) ? "#1d1d1b" : "#fff"; l.dataset.h = mm * MMPX;
    l.textContent = `${MAT[m][0]} ${mm}`; st.appendChild(l); return l;
  });
  c.querySelector(".facts").innerHTML = o.facts.map((f) => `<span>${f}</span>`).join("");
  c.querySelector("ul").innerHTML = o.pro.map((p) => `<li class="p">${p}</li>`).join("") + o.con.map((p) => `<li class="m">${p}</li>`).join("");
  cardsEl.appendChild(c); o.el = c;
});

// ------------------------------------------------------------- backgrounds

const defs = el("defs");
const grad = (id, stops, attrs = {}, tag = "radialGradient") => {
  const g = el(tag, { id, ...attrs }, defs);
  stops.forEach(([o, c, a = 1]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g));
};
grad("pool", [[0, "#ffcf8a", .55], [.5, "#e0914a", .16], [1, "#000", 0]]);
grad("wood", [[0, "#3b2a1e"], [.5, "#2f2118"], [1, "#3a281c"]], { x1: 0, y1: 0, x2: 1, y2: 0 }, "linearGradient");
grad("night", [[0, "#1b2c5e"], [1, "#090d1f"]]);
grad("orb", [[0, "#ffffff"], [.3, "#c6d6ff"], [.62, "#6d8fff", .75], [1, "#6d8fff", 0]]);
grad("cone", [[0, "#ffd089", .5], [1, "#ffd089", 0]], { x1: 0, y1: 0, x2: 0, y2: 1 }, "linearGradient");
grad("dusk", [[0, "#1d2a55"], [.65, "#6a4a7a"], [1, "#e78f63"]], { x1: 0, y1: 0, x2: 0, y2: 1 }, "linearGradient");
const blur = el("filter", { id: "soft", x: "-30%", y: "-30%", width: "160%", height: "160%" }, defs);
el("feGaussianBlur", { stdDeviation: 22 }, blur);
const shadow = el("filter", { id: "drop", x: "-20%", y: "-20%", width: "140%", height: "150%" }, defs);
el("feDropShadow", { dx: 0, dy: 24, stdDeviation: 26, "flood-color": "#000", "flood-opacity": .55 }, shadow);

const table = group();
el("rect", { width: W, height: H, fill: "url(#wood)" }, table);
for (let i = 0; i < 26; i++) {
  const y = i * H / 26 + rnd() * 18;
  el("path", { d: `M0 ${y} C${W * .3} ${y + rnd() * 26 - 13} ${W * .6} ${y + rnd() * 26 - 13} ${W} ${y + rnd() * 16 - 8}`, fill: "none", stroke: "#1f150e", "stroke-width": 1 + rnd() * 2, opacity: .32 }, table);
}
el("ellipse", { cx: L.stage[0], cy: L.stage[1], rx: W * .62, ry: H * .68, fill: "url(#pool)" }, table);

// ------------------------------------------------------------- hands
// Each hand's origin is the point that touches: the pen tip or the fingertip.
function penHand(parent, sleeve, sleeve2, skin) {
  const g = group(parent);
  el("path", { d: "M92 74 C170 150 260 240 420 400", fill: "none", stroke: sleeve, "stroke-width": 92, "stroke-linecap": "round" }, g);
  for (const d of [165, 235, 305]) {
    el("path", { d: `M${60 + d} ${50 + d} l40 -42 M${60 + d} ${50 + d} l-40 42`, stroke: sleeve2, "stroke-width": 20, "stroke-linecap": "round" }, g);
  }
  el("path", { d: "M46 22 C74 -8 124 6 138 42 C150 74 124 112 90 112 C54 110 26 60 46 22Z", fill: skin }, g);
  el("line", { x1: 3, y1: -4, x2: 148, y2: -128, stroke: "#3b3c3f", "stroke-width": 12, "stroke-linecap": "round" }, g);
  el("line", { x1: 138, y1: -119, x2: 150, y2: -130, stroke: "#5a5c60", "stroke-width": 12, "stroke-linecap": "round" }, g);
  el("path", { d: "M0 0 L9 -15 L20 -2 Z", fill: "#1d1d1b" }, g);
  el("path", { d: "M34 12 C46 -6 66 -22 82 -14", fill: "none", stroke: skin, "stroke-width": 25, "stroke-linecap": "round" }, g);
  el("path", { d: "M44 30 C56 14 78 -2 100 2", fill: "none", stroke: skin, "stroke-width": 25, "stroke-linecap": "round" }, g);
  el("path", { d: "M58 46 C78 44 100 30 118 30", fill: "none", stroke: skin, "stroke-width": 23, "stroke-linecap": "round" }, g);
  el("path", { d: "M66 -26 C80 -8 62 22 40 26", fill: "none", stroke: "#000", "stroke-opacity": .1, "stroke-width": 3 }, g);
  return g;
}
function fingerHand(parent, sleeve, skin) {
  const g = group(parent);
  el("path", { d: "M104 130 C170 200 240 280 380 430", fill: "none", stroke: sleeve, "stroke-width": 104, "stroke-linecap": "round" }, g);
  el("path", { d: "M58 72 C100 44 160 74 158 124 C154 166 108 186 76 158 C48 132 38 92 58 72Z", fill: skin }, g);
  el("path", { d: "M2 2 L66 86", stroke: skin, "stroke-width": 27, "stroke-linecap": "round" }, g);
  for (const [x, y, x2, y2] of [[96, 66, 66, 92], [126, 76, 88, 110], [146, 100, 104, 132]]) {
    el("path", { d: `M${x} ${y} L${x2} ${y2}`, stroke: skin, "stroke-width": 27, "stroke-linecap": "round" }, g);
    el("path", { d: `M${x + 8} ${y - 8} L${x2 + 2} ${y2 - 6}`, stroke: "#000", "stroke-opacity": .08, "stroke-width": 2 }, g);
  }
  return g;
}

// ------------------------------------------------------------- laptop
const lap = group();
el("rect", { x: -30, y: -30, width: 960, height: 620, rx: 26, fill: "#25262a", filter: "url(#drop)" }, lap);
el("rect", { width: 900, height: 560, fill: "#f7f5f0", rx: 6 }, lap);
el("rect", { width: 900, height: 58, fill: "#fff" }, lap);
el("line", { x1: 0, y1: 58, x2: 900, y2: 58, stroke: "#e4e0d6", "stroke-width": 2 }, lap);
el("text", { x: 30, y: 38, "font-size": 24, "font-weight": 720, fill: "#1d1d1b", text: "Claude" }, lap);
el("text", { x: 870, y: 37, "font-size": 18, fill: "#8a887f", "text-anchor": "end", class: "mono", text: "rmink ansluten" }, lap);
el("rect", { x: -70, y: 590, width: 1040, height: 150, rx: 22, fill: "#35363b" }, lap);
for (let r = 0; r < 3; r++) for (let c = 0; c < 15; c++) {
  el("rect", { x: -42 + c * 66, y: 606 + r * 38, width: 60, height: 32, rx: 6, fill: "#1f2024" }, lap);
}
const bubbles = group(lap);
const chat = [
  { from: "me", text: "Rita rent skissen Garage." },
  { from: "ai", text: "Klar! Garage r01 ligger på plattan, med fyra alternativ för plattan." },
  { from: "me", text: "Jag har svarat. Kör nästa varv." },
  { from: "ai", text: "Klar! Alternativ B är inritat i r02." },
];
const bub = chat.map(({ from, text }, i) => {
  const g = group(bubbles);
  const y = 96 + i * 0;
  const me = from === "me";
  const lines = [], width = 34;
  let line = ""; for (const w of text.split(" ")) { if ((line + " " + w).length > width && line) { lines.push(line); line = w; } else line = line ? line + " " + w : w; } lines.push(line);
  const h = lines.length * 40 + 30, bw = 640;
  const x = me ? 900 - bw - 30 : 30;
  el("rect", { x, y: 0, width: bw, height: h, rx: 20, fill: me ? "#2b5fd9" : "#ece8de" }, g);
  const ts = lines.map((l, j) => el("text", { x: x + 26, y: 42 + j * 40, "font-size": 30, fill: me ? "#fff" : "#1d1d1b", text: l }, g));
  return { g, h, text, lines, ts };
});
const lapFinger = fingerHand(lap, "#3f5f7a", "#e7b48f");

const tab = group();
// reMarkable 2: light grey frame, thin bezels, a darker metal spine down the left.
// The screen is e-paper, so everything on it is shades of grey.
const PAPER = "#ecebe6", INK = "#1d1d1b";
grad("spine", [[0, "#3e4044"], [.45, "#6a6c70"], [1, "#4a4c50"]], { x1: 0, y1: 0, x2: 1, y2: 0 }, "linearGradient");
el("rect", { x: -70, y: -24, width: 694, height: 848, rx: 16, fill: "#d6d4ce", filter: "url(#drop)" }, tab);
el("path", { d: "M-40 -24 H-54 a16 16 0 0 0 -16 16 V808 a16 16 0 0 0 16 16 H-40 Z", fill: "url(#spine)" }, tab);
el("rect", { x: -2, y: -2, width: 604, height: 804, fill: "#bdbbb5" }, tab);
el("rect", { width: 600, height: 800, fill: PAPER }, tab);
const pageG = group(tab);

  for (const st of strokes) realInk.push(Object.assign(stroke(ink, st.d, st.w), { len: 0 }));
  realInk.forEach((o) => { o.len = o.path.getTotalLength(); });
  seek(0); window.ready = true;
});
</script>
