<script>
const LANG = new URLSearchParams(location.search).get("lang") || "en";
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";

// ---------- timing helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
// opacity: fades in over [a,a+d], out over [b-d,b]
const win = (t, a, b, d = 0.4) => Math.min(prog(t, a, a + d), 1 - prog(t, b - d, b));
function place(el, { x = 0, y = 0, s = 1, r = 0, o = 1, cx = true }) {
  const w = el.offsetWidth, h = el.offsetHeight;
  const tx = cx ? x - w / 2 : x, ty = cx ? y - h / 2 : y;
  el.style.transform = `translate(${tx}px, ${ty}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
// Shrink a text element until it fits on `lines` lines.
function fit(el, max, min, lines = 1) {
  let size = max;
  el.style.fontSize = size + "px";
  while (size > min && el.scrollHeight > size * 1.25 * lines + 4) {
    size -= 2;
    el.style.fontSize = size + "px";
  }
}
function textAt(el, y, o, dy = 0) {
  el.style.transform = `translate(0px, ${y + dy}px)`;
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
}

let T, DATA, DESK, PAGE;
const strokes = [];      // {el, len, start, tag, bbox, color}
let totalLen = 0, sunEls = [], sunBox, titleEls = [], erasePaths = [], eraseBox;
let wmPaths = [], wmTotal = 0;

async function load() {
  const [i18n, data] = await Promise.all([
    fetch("i18n.json").then((r) => r.json()),
    fetch("out/strokes.json").then((r) => r.json()),
  ]);
  T = i18n[LANG];
  DATA = data;
  DESK = await fetch(`out/desk-${LANG}/meta.json`).then((r) => r.json());
  PAGE = data[LANG];

  $("#photo-img").src = `out/note-${LANG}.jpg`;
  $("#drag-img").src = `out/note-${LANG}.jpg`;
  $("#h1").textContent = T.hook1;
  $("#h2").textContent = T.hook2;
  document.documentElement.lang = LANG;

  buildInk();
  buildFace();
  buildShade();
  buildDesk();
  buildClaude();
  buildMontage();
  buildEnd();

  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  window.ready = true;
}

function buildInk() {
  const svg = $("#ink");
  svg.setAttribute("viewBox", `0 0 ${PAGE.width} ${PAGE.height}`);
  const tablet = $("#tablet");
  tablet.dataset.ratio = PAGE.height / PAGE.width;
  // Group for strokes that the eraser removes, masked progressively.
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<mask id="erase-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="${PAGE.width}" height="${PAGE.height}">
      <rect x="0" y="0" width="${PAGE.width}" height="${PAGE.height}" fill="#fff"/>
      <rect id="erase-rect" x="0" y="0" width="0" height="0" fill="#000"/></mask>`;
  svg.appendChild(defs);
  const gMain = document.createElementNS(NS, "g");
  const gErase = document.createElementNS(NS, "g");
  gErase.setAttribute("mask", "url(#erase-mask)");
  const gSun = document.createElementNS(NS, "g");
  gSun.id = "sun";
  svg.append(gMain, gErase, gSun);

  const sketch = PAGE.strokes.filter((s) => s.tag === "sketch");
  const sx0 = Math.min(...sketch.map((s) => s.bbox[0])), sx1 = Math.max(...sketch.map((s) => s.bbox[2]));
  // The sun: the circle is the largest stroke in the left part of the sketch;
  // its rays are everything that lies within ~2.4 radii of the circle centre.
  const left = sketch.filter((s) => (s.bbox[0] + s.bbox[2]) / 2 < sx0 + 0.24 * (sx1 - sx0));
  const circle = left.reduce((a, s) => ((s.bbox[2] - s.bbox[0]) * (s.bbox[3] - s.bbox[1]) >
    (a.bbox[2] - a.bbox[0]) * (a.bbox[3] - a.bbox[1]) ? s : a), left[0]);
  const scx = (circle.bbox[0] + circle.bbox[2]) / 2, scy = (circle.bbox[1] + circle.bbox[3]) / 2;
  const sr = (circle.bbox[2] - circle.bbox[0]) / 2;
  const isSun = (s) => s.tag === "sketch" && [[s.bbox[0], s.bbox[1]], [s.bbox[2], s.bbox[3]]]
    .every(([x, y]) => Math.hypot(x - scx, y - scy) < 2.4 * sr);

  for (const s of PAGE.strokes) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", s.d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.c);
    p.setAttribute("stroke-width", Math.max(2.2, s.w));
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    const group = s.tag === "item2" ? gErase : isSun(s) ? gSun : gMain;
    group.appendChild(p);
    const len = Math.max(p.getTotalLength(), 1);
    p.style.strokeDasharray = `${len} ${len}`;
    strokes.push({ el: p, len, start: totalLen, tag: s.tag, color: s.c });
    totalLen += len;
    if (isSun(s)) sunEls.push(s);
    if (s.tag === "title") titleEls.push(p);
    if (s.tag === "item2") erasePaths.push(s);
  }
  const bb = (list) => list.reduce((b, s) => [Math.min(b[0], s.bbox[0]), Math.min(b[1], s.bbox[1]),
    Math.max(b[2], s.bbox[2]), Math.max(b[3], s.bbox[3])], [1e9, 1e9, -1e9, -1e9]);
  sunBox = bb(sunEls);
  eraseBox = bb(erasePaths);

  // Lasso loop around the sun.
  const [x0, y0, x1, y1] = sunBox, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const rx = (x1 - x0) / 2 + 70, ry = (y1 - y0) / 2 + 70;
  let d = "";
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2.08, wob = 1 + 0.04 * Math.sin(a * 3);
    d += (i ? " L" : "M") + (cx + rx * wob * Math.cos(a)).toFixed(1) + "," + (cy + ry * wob * Math.sin(a)).toFixed(1);
  }
  const lasso = document.createElementNS(NS, "path");
  lasso.id = "lasso";
  lasso.setAttribute("d", d);
  lasso.setAttribute("fill", "none");
  lasso.setAttribute("stroke", "#555");
  lasso.setAttribute("stroke-width", 6);
  lasso.setAttribute("stroke-dasharray", "18 14");
  gSun.appendChild(lasso);
}

// ---------- face scene ----------
const FACE = { strokes: [], total: 0, drawn: [], drawTotal: 0 };

function buildFace() {
  const F = DATA.face, W = F.width, H = F.height, svg = $("#fink");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("#ftablet").dataset.ratio = H / W;
  const all = F.strokes;
  const bb = all.reduce((b, s) => [Math.min(b[0], s.bbox[0]), Math.min(b[1], s.bbox[1]),
    Math.max(b[2], s.bbox[2]), Math.max(b[3], s.bbox[3])], [1e9, 1e9, -1e9, -1e9]);
  const shirt = all.filter((s) => s.tag === "shirt");
  const sb = shirt.reduce((b, s) => [Math.min(b[0], s.bbox[0]), Math.min(b[1], s.bbox[1]),
    Math.max(b[2], s.bbox[2]), Math.max(b[3], s.bbox[3])], [1e9, 1e9, -1e9, -1e9]);
  // Resize: shrink towards the top-left corner of the portrait.
  Object.assign(FACE, { bbox: bb, shirtBox: sb, anchor: [bb[0], bb[1]], scale: 0.6 });

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<mask id="face-erase" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>
      <rect id="face-erase-rect" x="0" y="0" width="0" height="0" fill="#000"/></mask>`;
  const gScaled = document.createElementNS(NS, "g"), gShirt = document.createElementNS(NS, "g");
  gScaled.id = "face-scaled";
  gShirt.setAttribute("mask", "url(#face-erase)");
  const gDraw = document.createElementNS(NS, "g");
  svg.append(defs, gScaled, gDraw);

  const path = (d, color, w, parent) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", color);
    p.setAttribute("stroke-width", w);
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    parent.appendChild(p);
    const len = Math.max(p.getTotalLength(), 1);
    p.style.strokeDasharray = `${len} ${len}`;
    return { el: p, len };
  };
  for (const s of all) {
    const st = path(s.d, s.c, Math.max(2.2, s.w), gShirt);
    FACE.strokes.push({ ...st, start: FACE.total });
    FACE.total += st.len;
  }
  gScaled.appendChild(gShirt);

  // Lasso frame around the whole portrait (scaled together with it).
  const pad = 30;
  const frame = document.createElementNS(NS, "rect");
  frame.id = "face-frame";
  frame.setAttribute("x", bb[0] - pad);
  frame.setAttribute("y", bb[1] - pad);
  frame.setAttribute("width", bb[2] - bb[0] + 2 * pad);
  frame.setAttribute("height", bb[3] - bb[1] + 2 * pad);
  frame.setAttribute("fill", "none");
  frame.setAttribute("stroke", "#555");
  frame.setAttribute("stroke-width", 6);
  gScaled.appendChild(frame);
  FACE.frameLen = 2 * (bb[2] - bb[0] + bb[3] - bb[1] + 4 * pad);

  // New ink drawn after the resize: glasses, then a speech bubble saying hello.
  const k = FACE.scale, [ax, ay] = FACE.anchor, at = ([x, y]) => [ax + (x - ax) * k, ay + (y - ay) * k];
  const [e1, e2, mouth] = F.marks.map(at), r = 0.36 * Math.hypot(e2[0] - e1[0], e2[1] - e1[1]);
  const circle = ([x, y]) => `M${x - r},${y} A${r},${r} 0 1 1 ${x + r},${y} A${r},${r} 0 1 1 ${x - r},${y}`;
  const blue = "#2850c8", draw = (d, c, w) => {
    const st = path(d, c, w, gDraw);
    FACE.drawn.push({ ...st, start: FACE.drawTotal });
    FACE.drawTotal += st.len;
  };
  const dx = (e2[0] - e1[0]) / Math.hypot(e2[0] - e1[0], e2[1] - e1[1]);
  const dy = (e2[1] - e1[1]) / Math.hypot(e2[0] - e1[0], e2[1] - e1[1]);
  draw(circle(e1), blue, 9);
  draw(`M${e1[0] + r * dx},${e1[1] + r * dy} Q${(e1[0] + e2[0]) / 2},${(e1[1] + e2[1]) / 2 - r * 0.5} ${e2[0] - r * dx},${e2[1] - r * dy}`, blue, 9);
  draw(circle(e2), blue, 9);
  // Bubble to the right of the head, its tail pointing at the mouth.
  const right = ax + (bb[2] - ax) * k;
  const bx0 = right + 30, bx1 = W - 90, by1 = mouth[1] + 40, by0 = by1 - (bx1 - bx0) * 0.6;
  const tip = [mouth[0] + 150, mouth[1] + 10], R = 60;
  draw(`M${bx0 + R},${by0} L${bx1 - R},${by0} Q${bx1},${by0} ${bx1},${by0 + R} L${bx1},${by1 - R} Q${bx1},${by1} ${bx1 - R},${by1}
        L${bx0 + R},${by1} Q${bx0},${by1} ${bx0},${by1 - R} L${bx0},${by1 - 80} L${tip[0]},${tip[1]} L${bx0},${by1 - 170}
        L${bx0},${by0 + R} Q${bx0},${by0} ${bx0 + R},${by0} Z`, "#1d1d1b", 7);
  FACE.drawSplit = FACE.drawTotal;
  const hello = DATA["hello-" + LANG].strokes;
  const hb = hello.reduce((b, s) => [Math.min(b[0], s.bbox[0]), Math.min(b[1], s.bbox[1]),
    Math.max(b[2], s.bbox[2]), Math.max(b[3], s.bbox[3])], [1e9, 1e9, -1e9, -1e9]);
  const hs = Math.min((bx1 - bx0 - 140) / (hb[2] - hb[0]), (by1 - by0 - 120) / (hb[3] - hb[1]));
  const gHello = document.createElementNS(NS, "g");
  gHello.setAttribute("transform", `translate(${(bx0 + bx1) / 2 - hs * (hb[0] + hb[2]) / 2}, ${(by0 + by1) / 2 - hs * (hb[1] + hb[3]) / 2}) scale(${hs})`);
  gDraw.appendChild(gHello);
  for (const s of hello) {
    const st = path(s.d, "#1d1d1b", Math.max(4, s.w * 1.1), gHello);
    FACE.drawn.push({ ...st, start: FACE.drawTotal, g: gHello });
    FACE.drawTotal += st.len;
  }
}

// Point on the tablet screen (body px) for an SVG page coordinate.
function inkToScreen(x, y) {
  const r = $("#fink").getBoundingClientRect(), k = r.width / DATA.face.width;

}

function faceScene(u) {
  const F = DATA.face;
  // Title, photo, arrow and the small tablet (like scene 2).
  $("#h1").style.fontSize = "64px";
  $("#h1").textContent = T.face;
  textAt($("#h1"), 120, win(u, 0.1, 5.0, 0.5), (1 - easeOut(prog(u, 0.1, 0.7))) * 30);
  const fp = $("#fphoto");
  fp.style.width = "430px";
  fp.style.height = "538px";
  place(fp, { x: 290 - (1 - easeOut(prog(u, 0.2, 0.9))) * 200, y: 690, r: -5, o: win(u, 0.2, 5.2, 0.4) });
  const ap = $("#arrow-path"), aLen = 330;
  ap.style.strokeDasharray = aLen;
  ap.style.strokeDashoffset = aLen * (1 - prog(u, 0.9, 1.4));
  place($("#arrow"), { x: 540 - 80, y: 690 - 40, o: win(u, 0.8, 5.2, 0.3), cx: false });

  const tab = $("#ftablet"), mv = ease(prog(u, 4.9, 5.8));
  const width = lerp(450, 780, mv), inner = width - 60;
  tab.style.width = width + "px";
  tab.querySelector(".screen").style.height = inner * Number(tab.dataset.ratio) + "px";
  const tabO = Math.min(prog(u, 0.5, 1.1), 1 - prog(u, 13.5, 14));
  place(tab, { x: lerp(800 + (1 - easeOut(prog(u, 0.5, 1.3))) * 200, 540, mv), y: lerp(690, 770, mv), r: lerp(2, 0, mv), o: tabO });

  // Ink appears stroke by stroke.
  const drawn = ease(prog(u, 1.3, 4.6)) * FACE.total;
  for (const s of FACE.strokes) s.el.style.strokeDashoffset = s.len * (1 - clamp((drawn - s.start) / s.len));

  // Resize: lasso frame, then drag the corner inwards.
  const frame = $("#face-frame");
  frame.setAttribute("stroke-dasharray", `${FACE.frameLen * prog(u, 5.9, 6.5)} ${FACE.frameLen}`);
  frame.style.opacity = u >= 5.9 && u < 8.4 ? 1 - prog(u, 8.0, 8.4) : 0;
  const k = lerp(1, FACE.scale, ease(prog(u, 6.7, 7.9)));
  const [ax, ay] = FACE.anchor, [, , bx1, by1] = FACE.bbox;
  $("#face-scaled").setAttribute("transform", `translate(${ax * (1 - k)}, ${ay * (1 - k)}) scale(${k})`);

  // Erase the shirt with a sweeping eraser.
  const [sx0, sy0] = FACE.shirtBox, [, , sx1, sy1] = FACE.bbox, eraseP = ease(prog(u, 8.8, 10.3));
  const er = $("#face-erase-rect");
  er.setAttribute("x", sx0 - 40);
  er.setAttribute("y", sy0 - 40);
  er.setAttribute("height", sy1 - sy0 + 80);
  er.setAttribute("width", (sx1 - sx0 + 80) * eraseP);
  const S = FACE.scale, toPage = (x, y) => [ax + (x - ax) * S, ay + (y - ay) * S];
  if (u >= 8.6 && u < 10.5) {
    const [ex, ey] = inkToScreen(...toPage(sx0 - 40 + (sx1 - sx0 + 80) * eraseP,
      (sy0 + sy1) / 2 + (sy1 - sy0) * 0.3 * Math.sin(eraseP * 16)));
    place($("#eraser"), { x: ex, y: ey, o: win(u, 8.6, 10.5, 0.25), cx: false });
  } else place($("#eraser"), { o: 0 });

  // Draw again: glasses, the bubble, then the greeting.
  const gl = u < 12.1 ? lerp(0, FACE.drawSplit, ease(prog(u, 10.8, 12.1)))
    : lerp(FACE.drawSplit, FACE.drawTotal, prog(u, 12.2, 13.3));
  let tip = null;
  for (const s of FACE.drawn) {
    const f = clamp((gl - s.start) / s.len);
    s.el.style.strokeDashoffset = s.len * (1 - f);
    if (f > 0 && f < 1) {
      const pt = s.el.getPointAtLength(s.len * f);
      tip = [pt.x, pt.y, s.g];
    }
  }
  // Stylus: holds the resize corner, then follows the pen tip.
  const stylus = $("#stylus");
  if (u >= 6.2 && u < 8.2) {
    const c = inkToScreen(ax + (bx1 + 30 - ax) * k, ay + (by1 + 30 - ay) * k);
    place(stylus, { x: c[0], y: c[1], o: win(u, 6.2, 8.2, 0.3), cx: false });
  } else if (u >= 10.6 && u < 13.6) {
    if (tip) {
      let [x, y] = tip;
      if (tip[2]) {
        // Greeting strokes live in a scaled group.
        const m = tip[2].transform.baseVal.consolidate().matrix;
        [x, y] = [m.a * x + m.e, m.d * y + m.f];
      }
      FACE.lastTip = inkToScreen(x, y);
    }
    const p = FACE.lastTip || inkToScreen(...toPage(...F.marks[0]));
    place(stylus, { x: p[0], y: p[1], o: win(u, 10.6, 13.6, 0.3), cx: false });
  } else place(stylus, { o: 0 });

  // Captions.
  const caps = [[5.8, 8.4, T.resize], [8.4, 10.6, T.erase], [10.6, 13.6, T.draw]];
  const c = caps.find(([a, b]) => u >= a && u < b);
  if (c) caption("", c[2], Math.min(prog(u, c[0], c[0] + 0.3), 1 - prog(u, 13.3, 13.6)), c[0], u);
  else caption("", "", 0, 0, 0);
}

// Content coordinates (the 960 × 800 screenshot) → canvas.
function deskPt(x, y) {
  const r = $("#desk-content").getBoundingClientRect(), k = r.width / 960;
  return [r.left + x * k, r.top + y * k];
}
const boxC = (state, b) => {
  const x = DESK.states[state].boxes[b];
  return [x.x + x.width / 2, x.y + x.height / 2];
};
const mixCam = (a, b, p) => Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], p)]));
// Put content point (fx, fy) at canvas point (cx, cy) with zoom z.
function deskCamera({ z, fx, fy, cx, cy }, o) {
  const s = 1000 / 960, el = $("#desk");
  el.style.transform = `translate(${cx - fx * s * z}px, ${cy - (BAR + fy * s) * z}px) scale(${z})`;
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
// Keyframed path: keys are [time, () => [x, y]]; eased between keys.
function along(keys, u) {
  if (u <= keys[0][0]) return keys[0][1]();
  for (let i = 1; i < keys.length; i++) {
    if (u <= keys[i][0]) {
      const [a, pa] = keys[i - 1], [b, pb] = keys[i], f = ease(prog(u, a, b)), A = pa(), B = pb();
      return [lerp(A[0], B[0], f), lerp(A[1], B[1], f)];
    }
  }
  return keys[keys.length - 1][1]();
}
const pop = (u, a) => (u < a ? 0 : easeOut(prog(u, a, a + 0.35)));

function deskScene(u) {
  const g = DESK.states.preview.boxes.gallery;
  const BASE = { z: 1, fx: 480, fy: 400, cx: 540, cy: 720 };
  const GAL = { z: 1.6, fx: g.x + g.width / 2, fy: g.y + g.height / 2, cx: 540, cy: 730 };
  const SMALL = { z: 0.72, fx: 480, fy: 400, cx: 540, cy: 590 };
  const DEV = { z: 1.35, fx: 420, fy: 330, cx: 540, cy: 720 };
  let cam = mixCam(BASE, GAL, ease(prog(u, 2.7, 3.5)) * (1 - ease(prog(u, 4.4, 5.1))));
  if (u >= 5.1) cam = mixCam(BASE, DEV, ease(prog(u, 5.1, 5.8)) * (1 - ease(prog(u, 7.3, 7.9))));
  if (u >= 10.8) cam = mixCam(BASE, SMALL, ease(prog(u, 10.8, 11.6)));
  cam = { ...cam, cy: cam.cy + (1 - easeOut(prog(u, 0, 0.7))) * 70 };
  deskCamera(cam, Math.min(prog(u, 0, 0.5), 1 - prog(u, 19.5, 20)));

  // Which page the window shows.
  const show = { empty: 1, preview: prog(u, 2.0, 2.3), pro: prog(u, 6.2, 6.6), downloaded: prog(u, 8.6, 8.9) };
  for (const img of document.querySelectorAll(".dstate")) img.style.opacity = show[img.dataset.state];
  $("#usb").style.opacity = prog(u, 10.9, 11.4);
  $("#rmapp").style.opacity = prog(u, 15.9, 16.4);
  $("#desk-url span").textContent = u < 11.1 ? "rmink.vercel.app" : u < 16.1 ? "10.11.99.1" : "reMarkable";
  $("#desk-url svg").style.display = u < 11.1 ? "block" : "none";

  // The download shows up as saved; the bubble stays until the file is dragged out.
  $("#dlb").style.opacity = Math.min(pop(u, 8.9), 1 - prog(u, 12.0, 12.4));
  $("#dlb").style.transform = `translateY(${(1 - pop(u, 8.9)) * -16}px)`;

  // USB upload: drop target, progress, the new file in the list and on the tablet.
  $("#usb-drop").style.opacity = win(u, 12.5, 13.4, 0.2);
  const up = prog(u, 13.3, 14.6);
  $("#usb-toast").style.opacity = win(u, 13.2, 16.0, 0.25);
  $("#usb-toast .fill").style.width = up * 100 + "%";
  const st = $("#usb-toast .st");
  st.textContent = up < 1 ? Math.round(up * 100) + " %" : T.uploaded + " ✓";
  st.className = up < 1 ? "st" : "st ok";
  for (const [el, a] of [[DESK.newUsb, 14.7], [DESK.newTab, 15.1], [DESK.newApp, 18.0]]) {
    el.style.opacity = pop(u, a);
    el.style.transform = `scale(${lerp(0.6, 1, pop(u, a))})`;
  }
  const tabO = Math.min(prog(u, 11.2, 11.8), 1 - prog(u, 15.9, 16.3));
  place($("#utab"), { x: 860 + (1 - easeOut(prog(u, 11.2, 11.9))) * 120, y: 1120, r: -3, o: tabO });
  const tr = $("#utab").getBoundingClientRect(), dr = $("#desk").getBoundingClientRect();
  const c0 = [dr.left + dr.width * 0.3, dr.bottom - 2], c1 = [tr.left + 4, tr.top + tr.height * 0.55];
  const cp = $("#cable-path"), cd = `M${c0[0]},${c0[1]} C${c0[0]},${c0[1] + 230} ${c1[0] - 260},${c1[1]} ${c1[0]},${c1[1]}`;
  cp.setAttribute("d", cd);
  const cl = cp.getTotalLength();
  cp.style.strokeDasharray = `${cl} ${cl}`;
  cp.style.strokeDashoffset = cl * (1 - prog(u, 11.5, 12.2));
  place($("#cable"), { o: tabO, cx: false });

  // Captions.
  const steps = [[0.3, 2.6, 1, T.step1], [2.6, 5.0, 2, T.step2], [5.0, 7.6, 3, T.step3], [7.6, 10.8, 4, T.step4],
    [10.8, 15.9, 5, T.usb], [15.9, 19.6, 5, T.app]];
  const s = steps.find(([a, b]) => u >= a && u < b);
  if (s) caption(s[2], s[3], Math.min(prog(u, s[0], s[0] + 0.3), 1 - prog(u, 19.2, 19.6)), s[0], u);
  else caption("", "", 0, 0, 0);
  $("#cap .label").style.fontSize = s && s[3].length > 26 ? "48px" : "62px";

  // The photo is dragged in from the corner.
  const drop = () => deskPt(...boxC("empty", "drop"));
  const dp = ease(prog(u, 0.7, 1.9));
  const [dx, dy] = along([[0.7, () => [930, 1240]], [1.9, drop]], u);
  place($("#dragcard"), { x: dx, y: dy, r: lerp(12, 0, dp), s: lerp(1, 0.5, dp), o: win(u, 0.5, 2.2, 0.3) });

  // Cursor: carries the photo, clicks Pro and Download, then drags the file.
  const at = (x, y) => () => deskPt(x, y);
  const pro = () => deskPt(...boxC("preview", "pro")), dl = () => deskPt(...boxC("pro", "download"));
  const dlb = () => deskPt(760, 52), mid = at(480, 430);
  const keys = [[0.7, () => [930 + 20, 1240 + 30]], [1.9, () => { const p = drop(); return [p[0] + 20, p[1] + 30]; }],
    [5.2, at(330, 560)], [6.0, pro], [7.9, pro], [8.5, dl], [10.6, dl], [11.4, dlb], [11.9, dlb], [13.1, mid], [13.8, mid],
    [16.3, () => [160, 1230]], [16.6, () => [160, 1230]], [17.8, at(560, 440)], [19, at(560, 440)]];
  const [x, y] = along(keys, u);
  const cO = u < 2.3 ? win(u, 0.5, 2.3, 0.2) : u < 13.9 ? win(u, 5.0, 13.9, 0.3) : win(u, 16.2, 18.8, 0.3);
  place($("#cursor"), { x, y, o: cO, cx: false });
  const click = [6.0, 8.5].find((a) => u >= a && u < a + 0.5);
  if (click) {
    const [rx, ry] = click === 6.0 ? pro() : dl(), f = prog(u, click, click + 0.5);
    place($("#clickring"), { x: rx, y: ry, s: 0.5 + f, o: 1 - f, cx: false });
  }
  // The file being dragged: out of the download bubble into USB, then into the app.
  const dragging = (u >= 11.9 && u < 13.2) || (u >= 16.6 && u < 17.9);
  if (dragging || (u >= 16.3 && u < 16.6)) place($("#fchip"), { x: x + 18, y: y + 18, o: u < 16.6 ? prog(u, 16.3, 16.6) : 1, cx: false });
}

// ---------- Claude scene ----------
function buildClaude() {
  $("#term-label").textContent = T.setup;
  $("#c-photo").src = `out/note-${LANG}.jpg`;
  $("#c-user div").textContent = T.ask;
  $("#c-pv").src = `out/note-${LANG}-preview.png`;
  $("#c-file span").textContent = DESK.filename;
}
const CMD = "claude mcp add rmink -- uvx --from 'rmink[mcp]' rmink mcp";

function claudeScene(u) {
  caption("", T.claude, Math.min(prog(u, 0, 0.3), 1 - prog(u, 11.5, 12)), 0, u);
  // One-time setup in a terminal.
  const termO = Math.min(prog(u, 0.3, 0.7), 1 - prog(u, 3.5, 3.9));
  textAt($("#term-label"), 330, termO, -easeOut(prog(u, 3.5, 3.9)) * 40);
  place($("#term"), { x: 540, y: 520 - easeOut(prog(u, 3.5, 3.9)) * 40, o: termO });
  $("#term-cmd").textContent = CMD.slice(0, Math.round(CMD.length * prog(u, 0.7, 2.4)));
  $("#term-out").textContent = u >= 2.7 ? "✓ Added stdio MCP server rmink" : " ";

  // Then just ask.
  const chatO = Math.min(prog(u, 3.7, 4.2), 1 - prog(u, 11.5, 12));
  place($("#chat"), { x: 540, y: 740 + (1 - easeOut(prog(u, 3.7, 4.4))) * 60, o: chatO });
  const show = (sel, a) => {
    const el = $(sel), o = pop(u, a);
    el.style.opacity = o;
    el.style.transform = `translateY(${(1 - o) * 16}px)`;
  };
  show("#c-user", 4.2);
  show("#c-t1", 5.2);
  show("#c-pv", 6.2);
  show("#c-t2", 7.0);
  show("#c-reply", 7.9);
  show("#c-file", 9.9);
  const state = (sel, a, done) => {
    $(sel + " .st").innerHTML = u < done ? `<div class="spin" style="transform:rotate(${u * 720}deg)"></div>` : '<span class="ok">✓</span>';
  };
  state("#c-t1", 5.2, 6.1);
  state("#c-t2", 7.0, 7.8);
  $("#c-reply").textContent = T.claude_done.slice(0, Math.round(T.claude_done.length * prog(u, 8.0, 9.7)));
}


// ---------- the timeline ----------
// The original scenes (seekMain, in their own time) with new scenes spliced in.
const SEGMENTS = [
  { main: [0, 12] },                       // hook, photo → ink
  { scene: deskScene, len: 20 },           // web app, download, upload
  { main: [29.6, 42.2] },                  // edit on the tablet
  { scene: faceScene, len: 14 },           // faces
  { scene: shadeScene, len: 10 },          // shading styles
  { scene: claudeScene, len: 12 },         // Claude
  { main: [42.2, 60] },                    // montage, end card
];
const SCENE_ELS = ["#fphoto", "#ftablet", "#stylus", "#desk", "#utab", "#cable", "#dragcard", "#fchip",
  "#clickring", "#cursor", "#term", "#term-label", "#chat", ".scard"];
window.DURATION = SEGMENTS.reduce((d, s) => d + (s.len ?? s.main[1] - s.main[0]), 0);

window.seek = async function (t) {
  let at = 0;
  for (const seg of SEGMENTS) {
    const len = seg.len ?? seg.main[1] - seg.main[0];
    if (t < at + len || seg === SEGMENTS[SEGMENTS.length - 1]) {
      for (const sel of SCENE_ELS) for (const el of document.querySelectorAll(sel)) place(el, { o: 0 });
      if (seg.main) seekMain(seg.main[0] + t - at);
      else {
        seekMain(-1);
        seg.scene(t - at);
      }
      return;
    }
    at += len;
  }
};

function seekMain(t) {
  // Scene 1+2 text
  $("#h1").style.fontSize = t < 5.5 ? "76px" : "64px";
  $("#h1").textContent = t < 5.5 ? T.hook1 : T.what1;
  const h1o = t < 5.5 ? win(t, 0.15, 5.4, 0.5) : win(t, 5.7, 11.8, 0.5);
  textAt($("#h1"), t < 5.5 ? 110 : 120, h1o, (1 - easeOut(prog(t, t < 5.5 ? 0.15 : 5.7, (t < 5.5 ? 0.15 : 5.7) + 0.6))) * 30);
  fit($("#h2"), 104, 60, 1);
  $("#h2").style.color = "#2b5fd9";
  textAt($("#h2"), 110 + $("#h1").offsetHeight + 4, win(t, 1.5, 5.4, 0.5), (1 - easeOut(prog(t, 1.5, 2.2))) * 30);
  $("#h3").style.fontSize = "64px";
  $("#h3").textContent = T.what2;
  textAt($("#h3"), 1150, win(t, 9.0, 11.8, 0.5), (1 - easeOut(prog(t, 9.0, 9.6))) * 30);

  // Photo: big in scene 1, moves left in scene 2.
  const m = ease(prog(t, 4.9, 6.0));
  const photoO = Math.min(prog(t, 0, 0.4), 1 - prog(t, 11.5, 12));
  $("#photo").style.width = lerp(620, 430, m) + "px";
  $("#photo").style.height = lerp(775, 538, m) + "px";
  place($("#photo"), { x: lerp(540, 290, m), y: lerp(880, 690, m), r: lerp(-3, -5, m), s: lerp(1.05, 1, prog(t, 0, 5)), o: photoO });

  // Arrow between photo and tablet.
  const ap = $("#arrow-path"), aLen = 330;
  ap.style.strokeDasharray = aLen;
  ap.style.strokeDashoffset = aLen * (1 - prog(t, 6.0, 6.6));
  place($("#arrow"), { x: 540 - 80, y: 690 - 40, o: win(t, 5.9, 11.9, 0.3), cx: false });

  // Tablet: scene 2 (right), scene 4 (centre).
  const tab = $("#tablet");
  let tabO = 0;
  if (t < 12) {
    sizeTablet(450);
    tabO = Math.min(prog(t, 5.5, 6.1), 1 - prog(t, 11.5, 12));
    place(tab, { x: 800 + (1 - easeOut(prog(t, 5.5, 6.3))) * 200, y: 690, r: 2, o: tabO });
    setInk(t, ease(prog(t, 6.3, 10.6)));
  } else if (t >= 29.6 && t < 42.2) {
    sizeTablet(780);
    tabO = Math.min(prog(t, 29.6, 30.2), 1 - prog(t, 41.8, 42.2));
    place(tab, { x: 540, y: 770, s: lerp(0.94, 1, easeOut(prog(t, 29.6, 30.4))), o: tabO });
    setInk(t, 1);
  } else place(tab, { o: 0 });

  // Scene 4 effects (in SVG page coordinates).
  const er = $("#erase-rect"), [ex0, ey0, ex1, ey1] = eraseBox;
  const eraseP = ease(prog(t, 31.0, 32.8));
  er.setAttribute("x", ex0 - 40);
  er.setAttribute("y", ey0 - 40);
  er.setAttribute("height", ey1 - ey0 + 80);
  er.setAttribute("width", t >= 29 ? (ex1 - ex0 + 80) * eraseP : 0);
  const eraser = $("#eraser");
  if (t >= 30.8 && t < 33.2) {
    const svgRect = $("#ink").getBoundingClientRect(), k = svgRect.width / PAGE.width;
    const ex = svgRect.left + (ex0 - 40 + (ex1 - ex0 + 80) * eraseP) * k;
    const ey = svgRect.top + ((ey0 + ey1) / 2 + 30 * Math.sin(eraseP * 18)) * k;
    place(eraser, { x: ex, y: ey, o: win(t, 30.8, 33.2, 0.25), cx: false });
  } else place(eraser, { o: 0 });

  const lasso = $("#lasso");
  const lassoLen = lasso.getTotalLength();
  lasso.style.strokeDashoffset = 0;
  lasso.setAttribute("stroke-dasharray", `${lassoLen * prog(t, 33.9, 34.9)} ${lassoLen}`);
  lasso.style.opacity = t >= 33.8 && t < 37.0 ? 1 - prog(t, 36.6, 37.0) : 0;
  const mv = ease(prog(t, 35.1, 36.4));
  const sunCx = (sunBox[0] + sunBox[2]) / 2, sunCy = (sunBox[1] + sunBox[3]) / 2;
  const tgtX = PAGE.width * 0.82, tgtY = PAGE.height * 0.14;
  $("#sun").setAttribute("transform", `translate(${(tgtX - sunCx) * mv}, ${(tgtY - sunCy) * mv})`);

  const rc = prog(t, 37.4, 38.2);
  for (const p of titleEls) p.setAttribute("stroke", rc > 0 ? mixColor("#1d1d1b", "#2850c8", rc) : "#1d1d1b");
  if (t < 29) { for (const p of titleEls) p.setAttribute("stroke", strokes.find((s) => s.el === p).color); }

  // Captions (scene 4).
  if (t >= 30.2 && t < 42) {
    const caps = [[30.4, 33.6, T.erase], [33.6, 37.1, T.move], [37.1, 39.6, T.recolor + " · " + T.recolor_note], [39.6, 42, T.final]];
    const c = caps.find(([a, b]) => t >= a && t < b);
    const o = c ? Math.min(prog(t, c[0], c[0] + 0.3), 1 - prog(t, 41.6, 42)) : 0;
    if (c) caption("", c[2], o, c[0], t); else caption("", "", 0, 0, t);
    $("#cap .label").style.fontSize = c && c[2].length > 24 ? "50px" : "62px";
  } else caption("", "", 0, 0, t);
  if (!(t >= 30.2 && t < 42)) $("#cap .label").style.fontSize = "62px";

  // Scene 5: montage on dark.
  const dark = Math.min(prog(t, 42.2, 42.6), 1 - prog(t, 49.6, 50.1));
  $("#bg-dark").style.opacity = dark;
  ["m1", "m2", "m3", "m4"].forEach((k, i) => {
    const a = 42.2 + i * 1.95, b = a + 1.95, el = $("#mt-" + k);
    const o = win(t, a, b, 0.3);
    textAt(el, 470, o, (1 - easeOut(prog(t, a, a + 0.5))) * 50 - easeOut(prog(t, b - 0.3, b)) * 30);
  });

  // Scene 6: end card.
  const wmP = ease(prog(t, 50.3, 52.0)), wmDrawn = wmP * wmTotal;
  for (const p of wmPaths) p.el.style.strokeDashoffset = p.len * (1 - clamp((wmDrawn - p.start) / p.len));
  $("#wordmark").style.opacity = t >= 50 ? 1 : 0;
  const show = (sel, y, a) => textAt($(sel), y, t >= a ? easeOut(prog(t, a, a + 0.5)) : 0, (1 - easeOut(prog(t, a, a + 0.5))) * 30);
  show("#cta-try", 330, 51.6);
  const qo = (a) => (t >= a ? easeOut(prog(t, a, a + 0.5)) : 0);
  place($("#qr-a"), { x: 340, y: 680, s: lerp(0.9, 1, qo(52.2)), o: qo(52.2) });
  place($("#qr-b"), { x: 740, y: 680, s: lerp(0.9, 1, qo(52.6)), o: qo(52.6) });
  show("#cta-code", 925, 53.1);
  show("#cta-support", 1105, 53.6);
  $("#disclaimer").style.opacity = t >= 54 ? easeOut(prog(t, 54, 54.6)) : 0;
  $("#disclaimer").style.transform = "translate(0px, 1286px)";
  $("#disclaimer").style.top = "0px";
}

function mixColor(a, b, x) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [ca, cb] = [p(a), p(b)];
  return "rgb(" + ca.map((v, i) => Math.round(lerp(v, cb[i], x))).join(",") + ")";
}

load().then(() => seek(Number(new URLSearchParams(location.search).get("t") || 0)));
</script>
