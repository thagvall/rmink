<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>rmink bygg på riktigt</title>
<style>
:root { --paper: #f4f2ec; --ink: #1d1d1b; --muted: #6b6a65; --accent: #2b5fd9; --ok: #1f9d55; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }
body { position: relative; background: var(--paper); color: var(--ink);
  font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.scene { position: absolute; inset: 0; opacity: 0; }
.cap { position: absolute; }
.beat { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
.chapter { font: 600 var(--fs-chapter)/1 "SF Mono", Menlo, monospace; color: var(--accent); letter-spacing: .04em; margin-bottom: var(--gap-s); }
.title { font-size: var(--fs-title); font-weight: 780; letter-spacing: -0.025em; line-height: 1.04; }
.body { font-size: var(--fs-body); line-height: 1.32; color: #3e3d39; margin-top: var(--gap-s); }
.real { display: inline-block; margin-top: var(--gap-m); font: 650 var(--fs-chip) "SF Mono", Menlo, monospace; color: var(--muted);
  border: 2px solid #d6d3ca; border-radius: 999px; padding: .3em .9em; background: #fff; }
.stage { position: absolute; }
.dev { position: absolute; }
/* reMarkable 2, as in promo/laxa-video: light grey frame, thin bezels, a darker
   metal spine down the left. The screen is grey e-paper. --u is one unit of a
   600 unit wide screen. */
.tablet { position: relative; background: #d6d4ce; border-radius: calc(16 * var(--u)); padding: calc(24 * var(--u)) calc(24 * var(--u)) calc(24 * var(--u)) calc(70 * var(--u)); box-shadow: 0 30px 60px rgb(0 0 0 / .3), 0 6px 14px rgb(0 0 0 / .18); }
.tablet::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(30 * var(--u)); border-radius: calc(16 * var(--u)) 0 0 calc(16 * var(--u)); background: linear-gradient(90deg, #3e4044, #6a6c70 45%, #4a4c50); }
.screen { background: #ecebe6; overflow: hidden; position: relative; outline: calc(2 * var(--u)) solid #bdbbb5; }
.mini { position: absolute; left: calc(11 * var(--u)); top: calc(18 * var(--u)); width: calc(24 * var(--u)); height: calc(24 * var(--u)); z-index: 2; overflow: visible; }
.name { position: absolute; left: 0; right: 0; top: 100%; margin-top: 10px; text-align: center; font: 500 16px "SF Mono", Menlo, monospace; color: #55544f; white-space: nowrap; }
.vp { position: relative; overflow: hidden; background: #ecebe6; }
.sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; }
.sheet img, .sheet svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
/* Multiplied over everything on the page, so white paper turns e-paper grey and
   pages can still fade over each other. */
.sheet::after { content: ""; position: absolute; inset: 0; background: #ecebe6; mix-blend-mode: multiply; pointer-events: none; }
.sheet path { fill: none; stroke: #1a1a1a; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.win { background: #f8f5ef; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 60px rgb(0 0 0 / .22), 0 0 0 1px rgb(0 0 0 / .1); }
.win .tb { height: 34px; background: #ebe7df; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 600 14px -apple-system, sans-serif; color: #6b6a65; }
.win .tb i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.ring { position: absolute; border: 5px solid #1d1d1b; border-radius: 14px; opacity: 0; pointer-events: none; }
.flow { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.doc { background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14), 0 0 0 1px #e1ded5; padding: 14px 18px; display: flex; gap: 14px; align-items: center; font-size: var(--fs-chip); font-weight: 650; }
.doc img { width: 70px; border: 1px solid #ddd; }
.doc small { display: block; font: 500 calc(var(--fs-chip) * .7) "SF Mono", Menlo, monospace; color: var(--muted); margin-top: 4px; }
.pill { background: var(--accent); color: #fff; font-weight: 750; font-size: var(--fs-chip); padding: .55em 1.3em; border-radius: 14px; position: relative; }
.arrow { font-size: 44px; color: var(--accent); line-height: 1; }
.steps { display: grid; gap: 10px; }
.step { font-size: calc(var(--fs-chip) * .85); font-weight: 650; display: flex; gap: .6em; align-items: center; opacity: .25; }
.step .dot { width: 1.2em; height: 1.2em; border-radius: 50%; border: 3px solid #c9c5b9; display: grid; place-items: center; font-size: .8em; color: #fff; }
.step.on { opacity: 1; }
.step.done .dot { background: var(--ok); border-color: var(--ok); }
.step.done .dot::after { content: "✓"; font-weight: 900; }
.end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: var(--gap-m); }
.end .big { font-size: calc(var(--fs-title) * 1.25); font-weight: 820; letter-spacing: -0.035em; line-height: 1.02; }
.end .url { font: 650 var(--fs-body) "SF Mono", Menlo, monospace; color: var(--accent); }
.end .small { font-size: var(--fs-chip); color: var(--muted); }
#rail { position: absolute; display: flex; gap: 10px; justify-content: center; }
#rail div { font: 600 var(--fs-rail) "SF Mono", Menlo, monospace; color: #a3a097; padding: .35em .75em; border-radius: 999px; border: 2px solid transparent; white-space: nowrap; }
#rail div.on { color: var(--accent); border-color: var(--accent); background: #fff; }
#rail div.done { color: var(--ink); }
#bg { position: absolute; inset: 0; }
</style>
</head>
<body>
<svg id="bg"></svg>
<div id="rail"></div>
<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080), LAND = W > H;
Object.assign(document.body.style, { width: W + "px", height: H + "px" });
const L = LAND ? {
  cap: [110, 200, 600, 700], stage: [740, 30, 1120, 960], rail: [0, 1004, 1920, 50],
  fs: { chapter: 26, title: 72, body: 34, chip: 26, rail: 20 }, gap: { s: 16, m: 30 },
} : {
  cap: [70, 56, 940, 360], stage: [40, 400, 1000, 870], rail: [0, 1282, 1080, 50],
  fs: { chapter: 24, title: 58, body: 29, chip: 24, rail: 18 }, gap: { s: 12, m: 22 },
};
const rs = document.documentElement.style;
for (const [k, v] of Object.entries(L.fs)) rs.setProperty(`--fs-${k}`, v + "px");
for (const [k, v] of Object.entries(L.gap)) rs.setProperty(`--gap-${k}`, v + "px");
const place = (el, [x, y, w, h]) => Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });

const T = {
  ch: ["Skiss", "Ren ritning", "Alternativ", "Svara", "r02", "Varv", "Nya svar", "r08"],
  intro_t: "rmink bygg\npå riktigt", intro_b: "Ett garage från handskiss till revision 8. Riktiga sidor från en reMarkable, varv för varv.",
  real: "Riktiga sidor · inget mockup",
  sketch_t: "Skissa för hand", sketch_b: "6000 × 4500 och en fråga: hur tjock ska bottenplattan vara?",
  r01_t: "Ren ritning, r01", r01_b: "rmink ritar rent med mått och ställer frågor på SVAR-rader. Bottenplattan har egna alternativ på sida 2.",
  alt_t: "Alternativ\nA, B, C, D", alt_b: "Fyra uppbyggnader av bottenplattan: lager, tjocklek, U-värde, vikt, kostnad och för- och nackdelar.",
  alt_pick: "B: förstärkt, 150 betong på 300 EPS 200",
  ans_t: "Välj med pennan", ans_b: "På SVAR-raden: isolerat, uppvärmt till 5°, alternativ B. Och 10 meter till tomtgränsen.",
  r02_t: "r02: B är vald", r02_b: "Alternativ B står på ritningen med alla lager. Loggen säger vad som ändrats, och nya frågor kommer.",
  laps_t: "Varv för varv", laps_b: "Varje varv blir en ny revision. De äldre ligger kvar i Tidigare.",
  new_t: "Nya frågor,\nnya svar", new_b: "Nockhöjd, avstånd och exponeringsklass, besvarat för hand på sida 2 i r07.",
  r08_t: "r08", r08_b: "Svaren är inritade: nockhöjd 4,5 m och 5 m till tomtgränsen. Loggen visar varje steg.",
  end_t: "Skissa du.\nrmink ritar rent.", end_s: "Gratis och öppen källkod",
};
const NS = "http://www.w3.org/2000/svg";
function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
const out3 = x => 1 - (1 - x) ** 3;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ramp = (t, a, b) => ease(prog(t, a, b));
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = 0.4) => Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b));
function path(t, keys) {  // smooth through [time, value...] keys
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const p = ease(prog(t, keys[i - 1][0], keys[i][0]));
    return keys[i].slice(1).map((v, j) => lerp(keys[i - 1][j + 1], v, p));
  }
  return keys[keys.length - 1].slice(1);
}

const bg = document.getElementById("bg");
bg.setAttribute("viewBox", `0 0 ${W} ${H}`);
for (let i = 0; i < 5; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 240 + i * 60); c.setAttribute("fill", ["#2b5fd9", "#d9622b", "#1f9d55"][i % 3]); c.setAttribute("opacity", ".045"); c._i = i; bg.appendChild(c); }
const bgAt = t => [...bg.children].forEach(c => { const i = c._i; c.setAttribute("cx", W * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.08 + i * 2.1)))); c.setAttribute("cy", H * (0.2 + 0.6 * (0.5 + 0.5 * Math.cos(t * 0.1 + i * 1.3)))); });

/* A tablet showing real page images (1404 x 1872 px, the rm2 screen), with a camera. */
const PW = 1404, PH = 1872;
const FRAME_W = 694 / 600, FRAME_H = 848 / 600;  // the whole device per screen width
function tablet(parent, screenW, bar, pages) {
  const s = screenW / PW, vh = PH * s;
  const d = h(`<div class="dev"><div class="tablet"><div class="screen"><div class="vp"><div class="sheet"></div></div><svg class="mini" viewBox="-13 -13 26 26" fill="#ecebe6" stroke="#1d1d1b" stroke-width="2" stroke-linecap="round"><circle r="12"/><path d="M-5 -4 H5 M-5 0 H5 M-5 4 H5" fill="none"/></svg></div></div><div class="name"></div></div>`);
  d.style.setProperty("--u", screenW / 600 + "px");
  d.querySelector(".screen").style.width = screenW + "px";
  const vp = d.querySelector(".vp"); vp.style.height = vh + "px";
  const sheet = d.querySelector(".sheet"); Object.assign(sheet.style, { width: PW + "px", height: PH + "px" });
  d.querySelector(".name").textContent = bar;
  const imgs = pages.map(src => { const im = h(`<img src="../out/bygg/${src}">`); sheet.appendChild(im); return im; });
  parent.appendChild(d);
  return { d, vp, sheet, imgs, s, name: d.querySelector(".name"), w: screenW * FRAME_W, h: vh + screenW * 48 / 600 };
}
// Zoom z on page point (fx, fy) in page px, kept inside the page. ZOOM off keeps
// every page whole; the rings still point things out.
const ZOOM = Q.get("zoom") === "1";
function cam(tb, z, fx, fy) {
  if (!ZOOM) z = 1;
  const k = tb.s * z, vw = PW * tb.s, vh = PH * tb.s;
  const tx = clamp(vw / 2 - fx * k, vw - PW * k, 0), ty = clamp(vh / 2 - fy * k, vh - PH * k, 0);
  tb.sheet.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
}
const at = (dev, x, y) => Object.assign(dev.d.style, { left: x + "px", top: y + "px" });
const [SX, SY, SW, SH] = L.stage;
const fitW = () => Math.min((SH - 70) / FRAME_H, (SW - 30) / FRAME_W);

/* scenes */
const scenes = [];
function scene(start, len, chapter, build) {
  const root = h(`<div class="scene"><div class="cap"></div><div class="stage"></div></div>`);
  document.body.appendChild(root);
  const cap = root.querySelector(".cap"), stage = root.querySelector(".stage");
  place(cap, L.cap); place(stage, L.stage);
  const s = { start, end: start + len, chapter, root, cap, stage, beats: [] };
  s.update = build(s) || (() => {});
  scenes.push(s);
  return s.end;
}
function beat(s, at, html) { const b = h(`<div class="beat">${html}</div>`); s.cap.appendChild(b); s.beats.push({ at, el: b }); }
function beats(s, lt) {
  s.beats.forEach((b, i) => {
    const next = s.beats[i + 1] ? s.beats[i + 1].at : 1e9;
    const inP = i === 0 ? out3(prog(lt, 0.05, 0.75)) : 1;
    b.el.style.opacity = (i === 0 ? 1 - ramp(lt, next - 0.4, next) : win(lt, b.at, next)) * inP;
    b.el.style.transform = `translateY(${(1 - inP) * 28}px)`;
  });
}
const cap = (chapter, title, body, extra = "") =>
  `${chapter ? `<div class="chapter">${chapter}</div>` : ""}<div class="title">${title.replace(/\n/g, "<br>")}</div>${body ? `<div class="body">${body}</div>` : ""}${extra}`;
const chap = i => `${i + 1} · ${T.ch[i]}`;
function ring(tb, cls) { const r = h(`<div class="ring ${cls || ""}"></div>`); tb.sheet.appendChild(r); return r; }
function ringAt(r, x, y, w, hh, o) { Object.assign(r.style, { left: x + "px", top: y + "px", width: w + "px", height: hh + "px", opacity: o, borderWidth: 6 + "px" }); }

let INK = {};
// Write the user's strokes again over a page, in the order they were made.
function writer(tb, ink) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${PW} ${PH}`); tb.sheet.appendChild(svg);
  const ps = ink.map(p => { const e = document.createElementNS(NS, "path"); e.setAttribute("d", p.d); e.setAttribute("stroke-width", p.w); e.setAttribute("pathLength", 1); svg.appendChild(e); return e; });
  return (lt, a, b) => ps.forEach((e, i) => { const s0 = a + (b - a) * i / ps.length; e.style.strokeDashoffset = 1 - ramp(lt, s0, s0 + Math.max((b - a) / ps.length * 2.2, 0.12)); });
}
function pageScene(len, chapter, title, body, bar, pages, update, extra = "") {
  return st => scene(st, len, chapter, s => {
    beat(s, 0, cap(chapter >= 0 ? chap(chapter) : "", title, body, extra));
    const tb = tablet(s.stage, fitW(), bar, pages);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2);
    cam(tb, 1, PW / 2, PH / 2);
    const u = update(tb, s);
    return lt => { beats(s, lt); tb.d.style.opacity = out3(prog(lt, 0, 0.5)); u(lt); };
  });
}
function build() {
  let t = 0;
  // Intro: the sketch comes in.
  t = scene(t, 4.5, -1, s => {
    beat(s, 0, cap("", T.intro_t, T.intro_b, `<div class="real">${T.real}</div>`));
    const tb = tablet(s.stage, fitW() * 0.92, "Garage r00 skiss", ["r00-p01.png"]);
    at(tb, (SW - tb.w) / 2, (SH - tb.h) / 2); cam(tb, 1, 0, 0);
    s.stage.style.perspective = "1800px";
    return lt => {
      beats(s, lt);
      const p = out3(prog(lt, 0.1, 1.6));
      tb.d.style.transform = `translateY(${(1 - p) * 120}px) rotateX(${(1 - p) * 18}deg) rotateZ(${(1 - p) * -4}deg) scale(${lerp(0.9, 1, p)})`;
      tb.d.style.opacity = p;
    };
  });
  t = pageScene(5, 0, T.sketch_t, T.sketch_b, "Garage r00 skiss", ["r00-p01.png"], tb => {
    const r = ring(tb);
    return lt => ringAt(r, 215, 1085, 780, 150, win(lt, 1.6, 4.6, 0.3));
  })(t);
  t = pageScene(5.5, 1, T.r01_t, T.r01_b, "Garage r00 skiss", ["r00-p01.png", "r01-p01-blank.png"], tb => {
    const r = ring(tb);
    return lt => {
      const x = ramp(lt, 0.8, 1.8); tb.imgs[1].style.opacity = x;
      tb.name.textContent = x > 0.5 ? "Garage r01 · 2 frågor" : "Garage r00 skiss";
      ringAt(r, 540, 868, 520, 72, win(lt, 2.6, 5.2, 0.3));
    };
  })(t);
  // The alternatives page: A to D in turn, then B chosen.
  t = pageScene(8, 2, T.alt_t, T.alt_b, "Garage r01 · sida 2", ["r01-p02.png"], (tb, s) => {
    const rs = [[40, 175, 1300, 500], [40, 690, 1300, 520], [40, 1235, 1300, 525], [40, 1770, 1300, 100]].map(() => ring(tb));
    const box = [[40, 175, 1300, 500], [40, 690, 1300, 520], [40, 1235, 1300, 525], [40, 1770, 1300, 100]];
    const ok = ring(tb, "ok");
    const pick = h(`<div class="real" style="opacity:0;color:var(--ok);border-color:var(--ok)">✓ ${T.alt_pick}</div>`);
    s.cap.firstElementChild.appendChild(pick);
    return lt => {
      [0.9, 1.9, 2.9, 3.9].forEach((a, i) => ringAt(rs[i], ...box[i], win(lt, a, a + 1.0, 0.25)));
      ringAt(ok, ...box[1], ramp(lt, 5.0, 5.4));
      pick.style.opacity = ramp(lt, 5.2, 5.7);
    };
  })(t);
  // The user's own answer, written again.
  t = pageScene(7, 3, T.ans_t, T.ans_b, "Garage r01 · 2 frågor", ["r01-p01-blank.png"], tb => {
    const w = writer(tb, INK.r01), r = ring(tb, "ok");
    return lt => { w(lt, 0.8, 4.6); ringAt(r, 250, 1540, 880, 260, win(lt, 4.9, 7.0, 0.3)); };
  })(t);
  // r02: B on the drawing.
  t = pageScene(7, 4, T.r02_t, T.r02_b, "Garage r02 · 2 frågor", ["r02-p01.png"], tb => {
    const a = ring(tb, "ok"), b = ring(tb), c = ring(tb);
    return lt => {
      ringAt(a, 300, 745, 680, 210, win(lt, 0.9, 3.2, 0.3));
      ringAt(b, 515, 585, 440, 70, win(lt, 3.2, 4.8, 0.3));
      ringAt(c, 40, 1670, 1330, 150, win(lt, 4.8, 7.0, 0.3));
    };
  })(t);
  // Every revision in a row, r01 to r08.
  t = scene(t, 6, 5, s => {
    beat(s, 0, cap(chap(5), T.laps_t, T.laps_b));
    const revs = ["r01", "r02", "r03", "r04", "r05", "r06", "r07", "r08"];
    const cols = LAND ? 4 : 4, gap = 24, cw = (SW - gap * (cols + 1)) / cols, ch = cw * PH / PW;
    const grid = revs.map((r, i) => {
      const c = h(`<div class="dev" style="width:${cw}px"><div style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgb(0 0 0 / .16),0 0 0 1px #e1ded5">
        <img src="../out/bygg/${r}-p01.png" style="display:block;width:100%"></div><div style="font:650 ${L.fs.chip * 0.8}px SF Mono,Menlo,monospace;color:#6b6a65;text-align:center;margin-top:8px">Garage ${r}</div></div>`);
      s.stage.appendChild(c);
      const rows = Math.ceil(revs.length / cols), top = (SH - rows * (ch + 40) - (rows - 1) * gap) / 2;
      Object.assign(c.style, { left: gap + (i % cols) * (cw + gap) + "px", top: top + Math.floor(i / cols) * (ch + 40 + gap) + "px" });
      return c;
    });
    return lt => {
      beats(s, lt);
      grid.forEach((c, i) => { const p = out3(prog(lt, 0.3 + i * 0.35, 0.9 + i * 0.35)); c.style.opacity = p; c.style.transform = `translateY(${(1 - p) * 40}px) scale(${lerp(0.9, 1, p)})`; });
    };
  });
  // New answers on r07's second page.
  t = pageScene(6.5, 6, T.new_t, T.new_b, "Garage r07 · sida 2", ["r07-p02-blank.png"], tb => {
    const w = writer(tb, INK.r07), r = ring(tb, "ok");
    return lt => { w(lt, 0.8, 4.8); ringAt(r, 220, 230, 750, 350, win(lt, 5.0, 6.5, 0.3)); };
  })(t);
  // r08: the answers drawn in, and the log.
  t = pageScene(6.5, 7, T.r08_t, T.r08_b, "Garage r08 · 1 fråga", ["r08-p01.png"], tb => {
    const a = ring(tb, "ok"), b = ring(tb);
    return lt => {
      ringAt(a, 345, 555, 600, 72, win(lt, 0.9, 3.4, 0.3));
      ringAt(b, 20, 1515, 1370, 130, win(lt, 3.4, 6.5, 0.3));
    };
  })(t);
  t = scene(t, 4, -2, s => {
    s.cap.remove(); s.stage.remove();
    const e = h(`<div class="end"><div class="big">${T.end_t.replace(/\n/g, "<br>")}</div><div class="url">rmink.vercel.app/bygg</div><div class="small">${T.end_s}</div></div>`);
    s.root.appendChild(e);
    const parts = [...e.children];
    return lt => parts.forEach((p, i) => { const q = out3(prog(lt, 0.15 + i * 0.25, 0.9 + i * 0.25)); p.style.opacity = q; p.style.transform = `translateY(${(1 - q) * 30}px)`; });
  });
  return t;
}

const rail = document.getElementById("rail");
place(rail, L.rail);
T.ch.forEach(c => rail.appendChild(h(`<div>${c}</div>`)));
const FADE = 0.5;
function seek(t) {
  bgAt(t);
  let chapter = -1, railOp = 0;
  for (const s of scenes) {
    const a = ramp(t, s.start - FADE / 2, s.start + FADE / 2), b = 1 - ramp(t, s.end - FADE / 2, s.end + FADE / 2);
    const o = s.start === 0 ? (t < s.end ? 1 : b) : Math.min(a, b);
    s.root.style.opacity = o; s.root.style.display = o > 0 ? "" : "none";
    if (o > 0) s.update(t - s.start);
    if (s.chapter >= 0) railOp = Math.max(railOp, o);
    if (t >= s.start && t < s.end) chapter = s.chapter;
  }
  rail.style.opacity = railOp;
  [...rail.children].forEach((d, i) => { d.classList.toggle("on", i === chapter); d.classList.toggle("done", chapter >= 0 && i < chapter); });
}

Promise.all(["r01-p01", "r07-p02"].map(n => fetch(`../out/bygg/${n}-ink.json`).then(r => r.json()))).then(async ([a, b]) => {
  INK = { r01: a, r07: b };
  window.DURATION = build();
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  window.seek = seek;
  seek(+(Q.get("t") || 0));
  window.ready = true;
});
