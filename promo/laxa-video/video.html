<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080), LAND = W > H;
Object.assign(document.body.style, { width: W + "px", height: H + "px" });
const SVGNS = "http://www.w3.org/2000/svg";
const s = document.getElementById("s");
s.setAttribute("viewBox", `0 0 ${W} ${H}`); s.setAttribute("width", W); s.setAttribute("height", H);

const L = LAND

  fs: { chapter: 28, title: 76, body: 37, rail: 17, tag: 22 }, tag: [70, 480], railY: H - 150, zoom: 1.03, zoomY: 1010 + OY });
const rs = document.documentElement.style;
for (const [k, v] of Object.entries(L.fs)) rs.setProperty(`--fs-${k}`, v + "px");
const cap = document.getElementById("cap");
Object.assign(cap.style, { left: L.cap[0] + "px", top: L.capY + "px", width: L.cap[2] + "px" });
document.getElementById("rail").style.top = L.railY + "px";
const tag = document.getElementById("tag"), tagName = tag.children[0], tagScore = tag.children[1];

// Helpers. Everything is a pure function of t, so any frame can be rendered.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, x) => a + (b - a) * x;
const fade = (t, a, b, f = .4) => Math.min(P(t, a, a + f), 1 - P(t, b - f, b));
const el = (tag, attrs = {}, parent = s) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) {

};

for (let i = 0; i < 26; i++) {

}

// Things on the table, seen from above

}

  el("line", { x1: 138, y1: -119, x2: 150, y2: -130, stroke: "#5a5c60", "stroke-width": 12, "stroke-linecap": "round" }, g);
  el("path", { d: "M0 0 L9 -15 L20 -2 Z", fill: "#1d1d1b" }, g);

}

el("text", { x: 30, y: 38, "font-size": 24, "font-weight": 720, fill: "#1d1d1b", text: "Claude" }, lap);
el("text", { x: 870, y: 37, "font-size": 18, fill: "#8a887f", "text-anchor": "end", class: "mono", text: "rmink ansluten" }, lap);
el("rect", { x: -70, y: 590, width: 1040, height: 150, rx: 22, fill: "#35363b" }, lap);
for (let r = 0; r < 3; r++) for (let c = 0; c < 15; c++) {

  { from: "me", text: "Gör en läxa i multiplikation och division för åk 3. Prov, fyra frågor." },
  { from: "ai", text: "Klar! Läxa vecka 45 ligger på plattan, i Skola/Matematik." },

  const lines = [], width = 34;

  const h = lines.length * 40 + 30, bw = 640;

  el("rect", { x, y: 0, width: bw, height: h, rx: 20, fill: me ? "#2b5fd9" : "#ece8de" }, g);
  const ts = lines.map((l, j) => el("text", { x: x + 26, y: 42 + j * 40, "font-size": 30, fill: me ? "#fff" : "#1d1d1b", text: l }, g));
  return { g, h, text, lines, ts };
});
const lapFinger = fingerHand(lap, "#3f5f7a", "#e7b48f");

// ------------------------------------------------------------- tablet
const tab = group();
// reMarkable 2: light grey frame, thin bezels, a darker metal spine down the left.
// The screen is e-paper, so everything on it is shades of grey.
const PAPER = "#ecebe6", INK = "#1d1d1b";
grad("spine", [[0, "#3e4044"], [.45, "#6a6c70"], [1, "#4a4c50"]], { x1: 0, y1: 0, x2: 1, y2: 0 }, "linearGradient");

const BOX = [

];
const GLYPH = {
  0: ["M20 6 C6 8 4 50 20 54 C36 52 34 8 20 6"],

  k: ["M8 4 L8 56", "M32 24 L10 40 L34 56"],

};
function inkWord(parent, word, x, y, scale) {
  const g = group(parent, { transform: `translate(${x} ${y}) scale(${scale})` });
  const paths = []; let cx = 0;
  for (const ch of word) {
    for (const d of GLYPH[ch]) {
      const p = el("path", { d, transform: `translate(${cx} ${(cx * 37) % 5 - 2}) rotate(${(cx * 13) % 7 - 3})`, fill: "none", stroke: "#1d1d1b", "stroke-width": 3.4 / scale * .75, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      const len = p.getTotalLength();
      set(p, { "stroke-dasharray": len, "stroke-dashoffset": len });
      paths.push({ p, len, cx, ch });
    }
    cx += ch === "k" || ch === "r" ? 34 : 42;
  }
  const total = paths.reduce((a, b) => a + b.len, 0);
  // Reveal the word by fraction x; returns the pen tip in page coordinates.
  const draw = (f) => {
    let left = f * total, tip = null;
    for (const seg of paths) {
      const n = clamp(left, 0, seg.len);
      seg.p.setAttribute("stroke-dashoffset", seg.len - n);
      if (left > 0 && (tip === null || n > 0)) {
        const pt = seg.p.getPointAtLength(n);
        const m = seg.p.getCTM(), b = tab.getCTM().inverse();
        const q = new DOMPoint(pt.x, pt.y).matrixTransform(b.multiply(m));

  }
  if (t > 19 && t < 22) { hx += Math.sin(t * 5) * 8; hy += Math.sin(t * 7) * 5; thinking = 1; }
  set(think, { transform: `translate(330 700) scale(${eBack(P(t, 19.6, 20))})`, opacity: fade(t, 19.6, 22.1, .25) });
  // Second attempt
  const fixF = P(t, T.fix + .4, T.fix + 1.5);
  const fr = fix.draw(fixF);
  fix.g.setAttribute("opacity", 1 - P(t, T.fix + 1.9, T.fix + 2.2));
  if (t > T.fix - .2 && t < T.fix + 1.9) { if (fr && fixF > 0) tip = fr; else { hx = 210; hy = q4.y + 100; } }
  const writing = (t > T.write + .1 && t < 24.9) || (t > T.fix - .1 && t < T.fix + 2.2);
  const px = tip ? tip.x : hx, py = tip ? tip.y : hy;
  const arrive = Math.min(P(t, T.write - .1, T.write + .5), 1 - P(t, 24.4, 25));
  const again = Math.min(P(t, T.fix - .2, T.fix + .3), 1 - P(t, T.fix + 1.6, T.fix + 2.1));
  const enter = Math.max(arrive, again);
  const lift = tip ? 0 : -6;
  set(childHand, { transform: `translate(${px + (1 - eOut(enter)) * 420} ${py + (1 - eOut(enter)) * 340 + lift}) scale(.86)`, display: writing && enter > 0 ? "inline" : "none" });

  // Back with the marks
  facitLab.setAttribute("opacity", t >= T.back ? 1 : 0);

  // Facit: the layers button in the toolbar opens the panel, the eye shows the
  // layer. E-paper does not animate, so the facit is simply there.
  const fa = T.facit;
  const panelOn = t >= fa + .9 && t < fa + 2.6;
  panel.setAttribute("opacity", panelOn ? 1 : 0);
  layerHi.setAttribute("opacity", panelOn ? 1 : 0);
  layerIcon.setAttribute("stroke", panelOn ? PAPER : INK);
  const flipped = t >= fa + 2;
  eyeShut.setAttribute("opacity", flipped ? 0 : 1);
  eyeOpen.setAttribute("opacity", flipped ? 1 : 0);
  const facitOn = flipped && t < done;
  facitG.setAttribute("opacity", facitOn ? 1 : 0);
  facitLines.forEach((r) => r.setAttribute("width", facitOn ? 470 : 0));
  // Dad's finger: the layers button, the eye, then a rest beside the facit
  const F = [[fa + .1, 120, 760], [fa + .8, 23, 672], [fa + 1, 23, 672], [fa + 1.7, 318, 628], [fa + 2.5, 318, 628], [fa + 3.4, 345, 680], [fa + 5.8, 345, 680]];
  let fxp = F[0][1], fyp = F[0][2];
  for (let i = 0; i < F.length - 1; i++) {
    if (t >= F[i][0]) { const x = eIO(P(t, F[i][0], F[i + 1][0])); fxp = mix(F[i][1], F[i + 1][1], x); fyp = mix(F[i][2], F[i + 1][2], x); }
  }
  const fin = Math.min(P(t, fa, fa + .5), 1 - P(t, fa + 5.3, fa + 5.9));
  set(dadFinger, { transform: `translate(${fxp + (1 - eOut(fin)) * 420} ${fyp + (1 - eOut(fin)) * 320}) scale(.74)`, display: fin > 0 ? "inline" : "none" });
  // Aha
  set(aha, { transform: `translate(505 676) scale(${eBack(P(t, fa + 4.1, fa + 4.45))})`, opacity: fade(t, fa + 4.1, T.fix, .2) });

  // New round: the correction is read and the box turns green
  const fixed = t >= done;
  q4.typed.textContent = fixed ? "3 kr" : "17 kr";
  q4.vText.textContent = fixed ? "Rätt 1/1 p" : "Fel 0/1 p";
  if (fixed) {
    set(q4.verdict, { transform: `translate(570 ${q4.y + 24}) scale(${eBack(P(t, done, done + .35))})`, opacity: 1 });
  }

  // Name and score sit beside the device, as Claude reports them
  const first = T.back + 3.3, second = done + .3;
  tagName.textContent = `Läxa vecka 45 ${t < T.back ? "r01" : t < done ? "r02" : "r03"}`;
  tagScore.textContent = t >= second ? "4 av 4 p" : t >= first ? "3 av 4 p" : "";
  tagScore.style.transform = `scale(${eBack(P(t, t >= second ? second : first, (t >= second ? second : first) + .4))})`;
  tag.style.opacity = Math.max(fade(t, T.write, T.send), fade(t, T.back, T.end + .3));

  // The AI scene
  const nA = P(t, T.ai - .9, T.ai - .1), nB = 1 - P(t, T.back - .7, T.back);
  const nightOn = Math.min(nA, nB);
  set(night, { opacity: nightOn, display: nightOn > 0 ? "inline" : "none" });
  rings.forEach((r, i) => r.setAttribute("transform", `rotate(${(i % 2 ? -1 : 1) * t * (28 + i * 12)})`));
  halo.setAttribute("r", 200 + Math.sin(t * 3) * 14);
  const [ox, oy] = L.orb, [sx, sy] = L.small;
  MOTES.forEach((m, i) => {
    const on = ((t - T.ai) * .55 + m.o) % 1;
    const x = mix(sx + m.a * 120, ox + m.b * 30, on) + Math.sin(on * 6 + i) * 34 * (1 - on);
    const y = mix(sy - 120, oy, eIO(on));
    set(moteEls[i], { cx: x, cy: y, opacity: fade(t, T.ai, T.ai + 3.6, .5) * Math.sin(on * Math.PI) });
  });
  flyDigits.forEach((d, i) => {
    const a = T.ai + .2 + i * .45, f = eIO(P(t, a, a + 1.5));
    const c = mix(sx + (i - 1.5) * 90, ox, f), y = mix(sy - 140, oy, f);
    set(d, { x: c + Math.sin(f * 5) * 28 * (1 - f), y, opacity: t >= a ? 1 - P(f, .78, 1) : 0, "font-size": 62 * (1 - f * .6) });
  });
  const back = eIO(P(t, T.back - 1.8, T.back - .6));
  set(docFly, { transform: `translate(${mix(ox, sx, back)} ${mix(oy, sy, back)}) scale(${mix(.4, 1, Math.min(back * 3, 1))}) rotate(${(1 - back) * -8})`, opacity: t >= T.back - 1.9 ? 1 - P(back, .86, 1) : 0 });
  const CK = [T.ai + .5, T.ai + 2, T.ai + 3.2, T.ai + 4.3];
  checks.forEach((c, i) => {
    c.classList.toggle("on", t >= CK[i] - .1);
    c.classList.toggle("done", t >= CK[i] + 1);
  });
  aiBeat.style.opacity = fade(t, T.ai + .1, T.back - .3, .35);
  aiBeat.style.transform = `translateY(${(1 - eOut(P(t, T.ai + .1, T.ai + .6))) * 26}px)`;

  document.getElementById("capBack").style.opacity = LAND ? 0 : P(t, T.wrong, T.wrong + .6);

  // Captions and rail
  BEATS.forEach(([a, b], i) => {
    beatEls[i].style.opacity = fade(t, a, b, .35);
    beatEls[i].style.transform = `translateY(${(1 - eOut(P(t, a, a + .5))) * 26}px)`;
  });
  STEPS.forEach(([, a], i) => {
    const next = i < STEPS.length - 1 ? STEPS[i + 1][1] : T.end;
    railEls[i].className = t >= a && t < next ? "on" : t >= next ? "done" : "";
  });
  rail.style.opacity = P(t, T.ask, T.ask + .5) * (1 - P(t, T.end - .1, T.end + .3));

  // End
  const end = P(t, T.end, T.end + .55);
  const e = document.getElementById("end");
  e.style.opacity = end;
  e.style.transform = `scale(${mix(1.04, 1, eOut(end))})`;
}
window.seek = seek;
// Draw order: table, laptop, tablet, night sky behind the tablet, kitchen on top.
s.appendChild(table); s.appendChild(night); s.appendChild(lap); s.appendChild(tab); s.appendChild(k);
document.fonts.load('700 40px "Caveat"').then(() => document.fonts.ready).then(() => { seek(0); window.ready = true; });
</script>
</body>
</html>
