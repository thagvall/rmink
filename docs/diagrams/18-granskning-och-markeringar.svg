ord-wrap: normal; ">Granskningsmarkeringar i Bluebeam-stil, kopplade till rmink:s anmärkningar: ringar med nummer på ritningen och SVAR-rader i ritningshuvudet.</div></div></div></foreignObject></switch></g></g></g><g data-cell-id="Markeringstyper_3"><g transform="translate(0.5,0.5)"><rect x="24" y="114" width="736" height="120" rx="7.2" ry="7.2" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 726px; height: 1px; padding-top: 125px; margin-left: 30px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #000000; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: #000000; line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><b>Markeringstyper</b><table style="border-collapse:collapse;font-size:10px" cellpadding="1" cellspacing="0" border="0"><tbody><tr style="font-weight:bold"><td valign="top" align="left" width="80">typ</td><td valign="top" align="left" width="70">en</td><td valign="top" align="left" width="330">betyder</td><td valign="top" align="left" width="120">gråskala</td><td valign="top" align="left" width="60">färg</td><td valign="top" align="left" width="60">grad</td></tr><tr><td valign="top" align="left" width="80">Fråga</td><td valign="top" align="left" width="70">Question</td><td valign="top" align="left" width="330">Information saknas eller är otydlig. Svaret avgör ritningen.</td><td valign="top" align="left" width="120">solid / ring + ?</td><td valign="top" align="left" width="60">blue</td><td valign="top" align="left" width="60">fråga</td></tr><tr><td valign="top" align="left" width="80">Ändring</td><td valign="top" align="left" width="70">Change</td><td valign="top" align="left" width="330">Beställaren eller granskaren vill ha något annorlunda.</td><td valign="top" align="left" width="120">solid / moln</td><td valign="top" align="left" width="60">red</td><td valign="top" align="left" width="60">fråga</td></tr><tr><td valign="top" align="left" width="80">Fel</td><td valign="top" align="left" width="70">Error</td><td valign="top" align="left" width="330">Strider mot en regel, ett mått eller en annan handling.</td><td valign="top" align="left" width="120">solid / kryss + ring</td><td valign="top" align="left" width="60">red</td><td valign="top" align="left" width="60">fel</td></tr><tr><td valign="top" align="left" width="80">Info</td><td valign="top" align="left" width="70">Note</td><td valign="top" align="left" width="330">Upplysning, kräver inget svar.</td><td valign="top" align="left" width="120">dashed / i</td><td valign="top" align="left" width="60">gray</td><td valign="top" align="left" width="60">info</td></tr><tr><td valign="top" align="left" width="80">Godkänt</td><td valign="top" align="left" width="70">Approved</td><td valign="top" align="left" width="330">Granskat utan anmärkning.</td><td valign="top" align="left" width="120">solid / bock</td><td valign="top" align="left" width="60">green</td><td valign="top" align="left" width="60">info</td></tr></tbody></table></div></div></div></foreignObject></switch></g></g></g><g data-cell-id="Status___Annotation_status_4"><g transform="translate(0.5,0.5)"><rect x="824" y="114" width="526" height="120" rx="7.2" ry="7.2" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 516px; height: 1px; padding-top: 125px; margin-left: 830px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #000000; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: #000000; line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><b>Status → Annotation.status</b><table style="border-collapse:collapse;font-size:10px" cellpadding="1" cellspacing="0" border="0"><tbody><tr style="font-weight:bold"><td valign="top" align="left" width="100">status</td><td valign="top" align="left" width="80">rmink</td><td valign="top" align="left" width="330">betyder</td></tr><tr><td valign="top" align="left" width="100">Öppen</td><td valign="top" align="left" width="80">open</td><td valign="top" align="left" width="330">Väntar på svar eller åtgärd.</td></tr><tr><td valign="top" align="left" width="100">Besvarad</td><td valign="top" align="left" width="80">open</td><td valign="top" align="left" width="330">Svar finns på SVAR-raden men är inte infört på ritningen.</td></tr><tr><td valign="top" align="left" width="100">Accepterad</td><td valign="top" align="left" width="80">accepted</td><td valign="top" align="left" width="330">Ändringen är införd.</td></tr><tr><td valign="top" align="left" width="100">Avvisad</td><td valign="top" align="left" width="80">rejected</td><td valign="top" align="left" width="330">Ändringen görs inte, motivering i loggen.</td></tr><tr><td valign="top" align="left" width="100">Stängd</td><td valign="top" align="left" width="80">accepted</td><td valign="top" align="left" width="330">Klar och behöver inte visas längre.</td></tr></tbody></table></div></div></div></foreignObject></switch></g></g></g><g data-cell-id="Prioritet_5"><g transform="translate(0.5,0.5)"><rect x="824" y="250" width="526" height="91" rx="5.46" ry="5.46" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: rgb(255, 242,