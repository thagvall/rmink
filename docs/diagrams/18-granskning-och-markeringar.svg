gn="top" align="left" width="520">materials.toml id</td></tr><tr><td valign="top" align="left" width="100">Discipline</td><td valign="top" align="left" width="520">drawing_standard.toml discipline.letter</td></tr><tr><td valign="top" align="left" width="100">Priority</td><td valign="top" align="left" width="520">priority.name</td></tr></tbody></table></div></div></div></foreignObject></switch></g></g></g><g data-cell-id="I_rundorna_7"><g transform="translate(0.5,0.5)"><rect x="824" y="357" width="520" height="111" rx="6.66" ry="6.66" fill="#ffffff" stroke="#999999" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(153, 153, 153);"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 510px; height: 1px; padding-top: 368px; margin-left: 830px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #000000; "><div style="display: inline-block; font-size: 11px; font-family: Helvetica; color: #000000; line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><b>I rundorna</b><br />En öppen fråga blir en Annotation (ring, kryss eller hörnmarkeringar på stora mål) med nummer.<br />ANMÄRKNINGAR listar dem med en SVAR-rad var.<br />Svar på raden eller vid ringen besvarar frågan; nästa varv sätter accepted eller rejected.<br />Revisionen heter "&lt;namn&gt; rNN · N frågor" så länge frågor är öppna.</div></div></div></foreignObject></switch></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot 