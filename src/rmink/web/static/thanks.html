<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · rmink</title>
<style>
:root { --paper: #f4f2ec; --surface: #fbfaf7; --ink: #1d1d1b; --muted: #6b6a65; --line: #dcd8cd; --accent: #2b5fd9; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #171716; --surface: #212120; --ink: #ecebe6; --muted: #a3a29b; --line: #353532; --accent: #7ea2ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--paper); color: var(--ink);
  font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  max-width: 440px; text-align: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px;
}
svg { width: 96px; height: auto; color: var(--ink); }
h1 { font-size: 24px; margin: 12px 0 8px; }
p { color: var(--muted); margin: 0 0 20px; }
a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
    <path d="M10 40c10-26 22-26 26-6s14 18 22-4 18-22 26-2 14 18 26-8"/>
  </svg>
  <h1>Thank you!</h1>
  <p>Your support keeps rmink free for everyone and pays for the server. Happy writing.</p>
  <a href="/">Back to rmink</a>
</main>
</body>
</html>
