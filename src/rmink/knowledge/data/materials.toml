# Varuslag med kvaliteter och hur de redovisas på ritning – småhusfokus.
#
# Hierarki:  group (varugrupp) → material (varuslag) → product_types (produkttyp)
#            → classes (kvalitet/klass) → label_template + hatch (redovisning)
#
# required:       egenskaper som MÅSTE stå på ritningen för att varan ska vara
#                 entydig. Saknas någon → granskningsregeln rmink-material-klass.
# label_template: hur texten skrivs på ritningen. {dim} = tvärsnitt/tjocklek.
# fire_class:     typisk Euroklass för reaktion vid brand. Gäller den
#                 vanligaste produkten – kontrollera prestandadeklarationen (DoP).
# ama_ref:        lämnas tomt. AMA Hus-koder och rubriker är Svensk Byggtjänsts
#                 material; användare med licens fyller i via en lokal overlay.
# synonyms:       handskrivna varianter som ska tolkas som detta varuslag.
# density:        ungefärlig densitet i kg/m³ (medelvärde, praxis) för vikt-
#                 och lastuppskattning i rmink.calc. Inte ett dimensionerings-
#                 värde: trä varierar med fukt och klass (C14 ≈ 350, C30 ≈ 460),
#                 mineralull 15–150 och tegel 1300–1800 beroende på produkt.
# lambda:         typisk värmekonduktivitet λ i W/(m·K) för en uppskattning av
#                 U-värdet (rmink.calc.u_value). Produktens deklarerade λ gäller;
#                 isolering varierar med klass (EPS 100 ≈ 0,036, EPS 200 ≈ 0,034).

version = "2026-10-28"

