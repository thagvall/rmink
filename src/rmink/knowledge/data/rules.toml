# Granskningsregler: vad en ritning ska innehålla och vad den ska klara.
#
# VIKTIGT OM DE NYA BYGGREGLERNA
# BBR (BFS 2011:6) och EKS ersattes 1 juli 2025 av en serie nya föreskrifter
# (BFS 2024:4–13). Under övergångsåret fick man välja de gamla reglerna; den
# möjligheten upphörde 1 juli 2026. De nya föreskrifterna är i hög grad
# funktionsbaserade: många välkända BBR-siffror (räckeshöjd 1,1 m, trappans
# steghöjd, dörrbredder) står INTE längre i föreskriftstexten. Sådana värden är
# här märkta som praxis (source = "praxis", verified = false) och ska bara ge
# en fråga eller en påminnelse – aldrig ett "fel".
#
# Fält
#   id          unik nyckel, refereras från materials.toml och assemblies.toml
#   source      "BFS 2024:9" | "PBL" | "PBF" | "ElSL" | "rmink" | "praxis"
#   ref         kapitel och paragraf i källan
#   url         länk till källtexten
#   verified    true = värdet är kontrollerat mot källtexten (datum i `checked`)
#   applies_to  ritningsslag, varuslag, byggdel eller mål ur [vocabulary]
#   kind        geometric   – kan mätas på ritningen när skalan är känd
#               attribute   – kräver en egenskap i text (klass, typ)
#               completeness– något ska finnas på ritningen
#               manual      – kan bara bedömas av människa; blir en fråga
#   severity    fel | fråga | info
#   params      siffror som regeln använder (SI-enheter: m, mm, °C, %)
#   message_sv  texten som blir en anmärkning (ANMÄRKNINGAR + SVAR-rad)
#
# Källtexterna är grundförfattningarna, hämtade från rinfo.boverket.se
# 2026-10-28. Kontrollera alltid om ändringsförfattningar har tillkommit.

version = "2026-10-28"

[vocabulary]
# Mål som inte är ritningsslag, varuslag eller byggdelar.
targets = [
  "ritningshuvud", "skala", "norrpil", "mattkedja", "material", "sektion",
  "forklaring", "niva", "trappa", "racke", "ramp", "dorr", "fonster", "glasyta",
  "hygienrum", "kok", "sovrum", "kommunikationsutrymme", "entre", "tomt",
  "komplementbyggnad", "byggnad", "brandcellsgrans", "ventilation", "tappvatten",
  "tak", "grund", "tillbyggnad", "elinstallation",
]

