# ============================================== BFS 2024:9 – säkerhet vid användning

[[rule]]
id = "bfs9-fonster-barn"
title = "Fönster i utrymmen där yngre barn kan vistas"
source = "BFS 2024:9"
ref = "2 kap. 4 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["fonster"]
kind = "geometric"
severity = "fråga"
params = { fall_height_min_m = 2.0, sill_low_m = 0.60, sill_exempt_above_m = 1.8, opening_max_mm = 100 }
message_sv = "Fallhöjd ≥ 2,0 m och karm under 0,60 m över golv: fönstret behöver barnsäkring som fixerar stängt och med högst 100 mm öppning (BFS 2024:9 2 kap. 4 §)."

[[rule]]
id = "bfs9-trappa-oppning"
title = "Öppningar mellan plansteg i trappa"
source = "BFS 2024:9"
ref = "2 kap. 6 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["trappa"]
kind = "geometric"
severity = "fel"
params = { opening_max_mm = 100 }
message_sv = "Öppning mellan plansteg är {matt} mm – högst 100 mm (BFS 2024:9 2 kap. 6 §)."

[[rule]]
id = "bfs9-plan-dorr-trappa"
title = "Plan mellan dörr och nedåtgående trappa"
source = "BFS 2024:9"
ref = "2 kap. 7 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["trappa", "dorr", "altan_plint", "altan_mark"]
kind = "geometric"
severity = "fråga"
params = { escape_route_min_m = 0.8 }
message_sv = "Dörren öppnar direkt mot en nedåtgående trappa eller ett steg. Ska det finnas ett plan emellan? I utrymningsväg minst 0,8 m (BFS 2024:9 2 kap. 7 §)."

[[rule]]
id = "bfs9-skydd-mot-fall"
title = "Skydd mot fall där risk för personskada finns"
source = "BFS 2024:9"
ref = "2 kap. 10–11 §§"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["racke", "altan_plint", "trappa", "ramp"]
kind = "manual"
severity = "fråga"
params = {}
message_sv = "Altanen/trappan har en fallhöjd. Behövs räcke? Föreskriften anger ingen fast gräns – bedömningen görs efter användning och fallhöjd (BFS 2024:9 2 kap. 10–11 §§)."

[[rule]]
id = "bfs9-racke-barn"
title = "Räcke där yngre barn kan vistas"
source = "BFS 2024:9"
ref = "2 kap. 11 § andra stycket"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["racke", "racke_altan"]
kind = "geometric"
severity = "fel"
params = { anti_climb_height_m = 0.8, vertical_gap_max_mm = 100, gap_under_balcony_max_mm = 50, gap_under_stair_rail_to_landing_max_mm = 100, forbidden_horizontal_gap_mm = [110, 230] }
message_sv = "Räcke där barn kan vistas: klätterskydd de nedersta 0,8 m, spjälavstånd högst 100 mm, högst 50 mm under räcket mot golv/stegnos, inga horisontella öppningar 110–230 mm ovanför fronten (BFS 2024:9 2 kap. 11 §)."

[[rule]]
id = "bfs9-ledstang"
title = "Ledstänger i trappor och ramper"
source = "BFS 2024:9"
ref = "2 kap. 12–13 §§"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["trappa", "ramp", "trappa_ute"]
kind = "completeness"
severity = "fråga"
params = { sides = 2 }
message_sv = "Ledstång saknas. Krav på båda sidor, en sida räcker om det är obehövligt med två (BFS 2024:9 2 kap. 12 §)."

[[rule]]
id = "bfs9-fri-hojd"
title = "Fri höjd i trappor, dörrar och kommunikationsutrymmen"
source = "BFS 2024:9"
ref = "2 kap. 25 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["trappa", "dorr", "kommunikationsutrymme"]
kind = "geometric"
severity = "fel"
params = { min_m = 2.00 }
message_sv = "Fri höjd {matt} m – minst 2,00 m i trappor, dörrar och passager (BFS 2024:9 2 kap. 25 §)."

[[rule]]
id = "bfs9-utskjutande"
title = "Utskjutande delar under 2,20 m"
source = "BFS 2024:9"
ref = "2 kap. 26 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["kommunikationsutrymme", "entre"]
kind = "geometric"
severity = "fråga"
params = { height_m = 2.20 }
message_sv = "Del som sticker ut lägre än 2,20 m över gångyta – hur begränsas risken för sammanstötning (BFS 2024:9 2 kap. 26 §)?"

[[rule]]
id = "bfs9-glas-fall"
title = "Skydd mot fall genom glas"
source = "BFS 2024:9"
ref = "2 kap. 30 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["glasyta", "glas"]
kind = "geometric"
severity = "fel"
params = { below_floor_m = 0.6, fall_height_over_m = 2.0 }
message_sv = "Glas lägre än 0,6 m över golv med fallhöjd över 2,0 m: glaset ska klara dynamisk påverkan av en människa eller ha permanent skydd (BFS 2024:9 2 kap. 30 §)."

[[rule]]
id = "bfs9-glas-skar"
title = "Skydd mot skärskador vid glas"
source = "BFS 2024:9"
ref = "2 kap. 31 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["glasyta", "glas"]
kind = "attribute"
severity = "fråga"
params = { dwelling_below_m = 0.6, entrance_below_m = 1.5, child_spaces_below_m = 0.8 }
message_sv = "Glas under 0,6 m i bostad (1,5 m i entré) ska ha brottkaraktär som begränsar skärskador, till exempel härdat eller laminerat (BFS 2024:9 2 kap. 31 §)."

[[rule]]
id = "bfs9-tappvarmvatten"
title = "Temperatur på tappvarmvatten"
source = "BFS 2024:9"
ref = "2 kap. 33 §"
url = "https://rinfo.boverket.se/BFS2024-9/pdf/BFS2024-9.pdf"
verified = true
checked = "2026-10-28"
applies_to = ["tappvatten", "vvs"]
kind = "manual"
severity = "info"
params = { max_c = 60, max_scald_risk_c = 38 }
message_sv = "Tappvarmvatten högst 60 °C efter tappstället, 38 °C där skållningsrisk är särskild (BFS 2024:9 2 kap. 33 §)."

# ==================================== BFS 2024:12 / 2024:13 – tillgänglighet

