  { id = "ritningshuvud", term = "Ritningshuvud", abbr = "", en = "Title block", cat = "ritning", syn = ["namnruta", "titelfält", "stämpel"], ref = "ritningshuvud", def = "Rutan nere till höger med projekt, innehåll, nummer, skala, datum, skede och revision." },
  { id = "ritningsnummer", term = "Ritningsnummer", abbr = "RITN NR", en = "Drawing number", cat = "ritning", syn = ["ritn.nr", "nr"], ref = "ritningsnummer", def = "Unik beteckning för ritningen, ofta disciplin + typ + löpnummer." },
