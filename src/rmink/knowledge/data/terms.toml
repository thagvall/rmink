# Terminologi och förkortningar på svenska byggritningar – småhusfokus.
#
# En rad per term:
#   id    unik nyckel
#   term  det korrekta uttrycket (så skrivs det i FÖRKLARINGAR)
#   abbr  förkortning som skrivs på ritningen ("" om ingen)
#   en    engelsk motsvarighet
#   cat   ritning | matt | process | byggdel | grund | vagg | bjalklag | tak |
#         altan | oppning | installation | material | regel
#   syn   handskrivna varianter och synonymer (för tolkning av skisser)
#   ref   valfri koppling till materials.toml / assemblies.toml / rules.toml /
#         drawing_standard.toml
#   def   kort förklaring med egna ord

version = "2026-10-28"

term = [
  # ------------------------------------------------------------ ritning
  { id = "plan", term = "Planritning", abbr = "PLAN", en = "Floor plan", cat = "ritning", syn = ["plan", "planlösning"], ref = "planritning", def = "Våningsplan sett ovanifrån, snittat ca 1 m över golv." },
  { id = "sektion", term = "Sektion", abbr = "SEKT", en = "Section", cat = "ritning", syn = ["snitt", "genomskärning", "sektion A-A"], ref = "sektion", def = "Vertikalt snitt genom byggnaden längs en markerad snittlinje." },
  { id = "fasad", term = "Fasad", abbr = "FAS", en = "Elevation", cat = "ritning", syn = ["fasad mot söder", "vy"], ref = "fasad", def = "Byggnaden sedd utifrån, namnges efter väderstreck (Fasad mot söder)." },
  { id = "detalj", term = "Detalj", abbr = "DET", en = "Detail", cat = "ritning", syn = ["detaljritning", "nedslag", "anslutning"], ref = "detalj", def = "Förstorat utsnitt som visar skikt och infästning." },
