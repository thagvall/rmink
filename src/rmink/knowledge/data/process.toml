# Byggprocessen enligt PBL/PBF och behörighet för elarbete – småhusfokus.
#
# Här står inte vad byggnaden ska klara (det står i rules.toml och BFS),
# utan vilket tillstånd en åtgärd kräver, vem som ansvarar för vad, i vilken
# ordning saker sker och vilka handlingar som behövs.
#
# Källtexter: konsoliderade lydelser från data.riksdagen.se, hämtade
# 2026-10-28:
#   PBL  (2010:900)  ändrad t.o.m. SFS 2026:1583
#   PBF  (2011:338)  ändrad t.o.m. SFS 2026:1722
#   ElSL (2016:732)  ändrad t.o.m. SFS 2026:1294
#
# OBS – kommande ändringar: drygt 30 bestämmelser i PBL och PBF har
# lydelser som träder i kraft 2027-01-01 (bland annat kontrollplan och
# byggbedömare), och PBF 6 kap. 3 § upphör 2027-12-01. Kontrollera
# lydelsen igen efter de datumen.

