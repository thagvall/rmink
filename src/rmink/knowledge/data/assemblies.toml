  { material = "konstruktionsvirke", thickness_mm = 45, note = "Installationsregel 45×45 c600" },
  { material = "mineralull", thickness_mm = 45, note = "I installationsskiktet" },
  { material = "gips_a", thickness_mm = 12.5, note = "Invändig beklädnad" },
]

