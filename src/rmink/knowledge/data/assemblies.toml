# Typkonstruktioner (byggdelar) och lösningsmönster för småhus.
#
# En typkonstruktion är en beprövad lagerföljd som kan återanvändas mellan
# projekt: Claude föreslår en typ, användaren väljer, och ritningen hänvisar
# till typen med sin kod (YV1, IV1 …) i stället för att rita varje skikt i
# varje vy.
#
# layers: utifrån och in (vägg), uppifrån och ned (bjälklag, tak, platta).
#         material = id i materials.toml. thickness_mm = 0 för folier.
# variant: alternativ till en typkonstruktion, som rundan kan jämföra på en
#         alternativsida (A, B, C …). Samma lagerformat, och dessutom:
#         when/pros/cons med egna ord, cost = låg | medel | hög (relativt
#         varandra, inga priser), u_kind = wall | roof | floor | ground | ""
#         för ett ungefärligt U-värde ur materialens λ (rmink.calc.u_value).
#         Lager som delar zon (reglar och isolering) har fraction, andelen av
#         ytan; ventilated = true på luftspalten, så att den och allt utanför
#         inte räknas. lambda på ett lager ersätter materialets typvärde.
# Dimensioner och c-avstånd är TYPEXEMPEL. Bärande delar dimensioneras för
# aktuellt spann och last av konstruktör eller enligt tillverkarens tabeller.

version = "2026-10-28"

