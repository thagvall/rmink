# Symboler på ritningen – vad de betyder, var de hör hemma och hur de
# brukar se ut i en handskiss.
#
# Symbolerna följer vanlig svensk ritpraxis för småhus. Elsymbolerna
# liknar den internationella symbolserien IEC 60617, som är licensierad och
# inte ingår här. Geometrin är rmink:s egen (src/rmink/drawing/symbols.py),
# så varje använd symbol ska alltid förklaras i FÖRKLARINGAR.
#
# id:            symbolens kind i rmink (Symbol.kind), en per ritad symbol
# name:          texten i förklaringen (samma som i SYMBOLS)
# discipline:    disciplinbokstav i drawing_standard.toml, "" = allmän
# drawing_types: ritningsslag där den används
# meaning:       vad symbolen säger
# label:         texten som brukar stå vid symbolen (Symbol.label), "" = ingen
# required_when: när ritningen ska ha den, "" = när det finns något att visa
# sketch:        hur den brukar se ut handritad, för tolkningen av skissen
# syn:           ord och förkortningar man skriver i stället
# rules:         granskningsregler i rules.toml

version = "2026-10-28"

# ------------------------------------------------------------- orientering

[[symbol]]
id = "north"
name = "Norrpil"
discipline = ""
drawing_types = ["situationsplan", "planritning"]
meaning = "Visar norr, så att väderstreck, solinstrålning och fasadnamn kan läsas av."
label = "N"
required_when = "Alltid på situationsplan och planritning."
sketch = "Pil eller spets med ett N, ofta i en cirkel."
syn = ["N-pil", "nordpil", "N", "väderstreck"]
rules = ["rmink-norrpil"]

[[symbol]]
id = "section"
name = "Snitt"
discipline = ""
drawing_types = ["planritning", "sektion", "fasad"]
meaning = "Var en sektion är tagen och åt vilket håll den ses. Samma beteckning står på sektionsritningen."
label = "A"
required_when = "När projektet har en sektion: markeras i planen i båda ändar av snittlinjen."
sketch = "Streckprickad linje med pilar eller flaggor i ändarna och en bokstav, A-A."
syn = ["sektion", "sektionsmarkering", "snittmarkering", "A-A", "B-B"]
rules = ["rmink-sektionsmarkering"]

[[symbol]]
id = "level"
name = "Nivå"
discipline = ""
drawing_types = ["sektion", "fasad", "situationsplan"]
meaning = "En höjd: färdigt golv, överkant, underkant eller mark, räknad från nollpunkten ±0 eller i höjdsystemet."
label = "+0,00"
required_when = "På sektion och fasad: golv, bjälklag, takfot och nock. På situationsplan: mark och färdigt golv."
sketch = "Liten triangel med spetsen mot en linje och en siffra, ofta med ÖK, UK eller FG."
syn = ["nivå", "höjd", "nivåmärke", "±0", "+0", "FG", "ÖK", "UK", "▽"]
rules = ["rmink-niva-nollpunkt"]

[[symbol]]
id = "detail"
name = "Detaljhänvisning"
discipline = ""
drawing_types = ["planritning", "sektion", "fasad", "detalj"]
meaning = "Hänvisar till en detaljritning: detaljnumret överst, bladet eller ritningsnumret under strecket."
label = "1/A-03"
required_when = "När en del redovisas i större skala på en annan ritning."
sketch = "Cirkel delad av ett vågrätt streck, med siffror över och under, ofta med en ring runt delen."
syn = ["detalj", "detaljmarkering", "hänvisning", "se detalj"]
rules = []

[[symbol]]
id = "point"
name = "Punkt"
discipline = "M"
drawing_types = ["situationsplan", "konstruktion"]
meaning = "En utsatt punkt: hörn att sätta ut, mätpunkt, fixpunkt eller borrhål."
label = "P1"
required_when = ""
sketch = "Kryss eller plus med en ring."
syn = ["mätpunkt", "fixpunkt", "utsättning", "stomkryss"]
rules = []

[[symbol]]
id = "cross"
name = "Kryss"
discipline = ""
drawing_types = ["planritning", "sektion", "skiss"]
meaning = "Något som rivs eller utgår, eller en markerad punkt. Förklaras alltid i FÖRKLARINGAR, eftersom krysset kan betyda båda."
label = ""
required_when = ""
sketch = "Två korsade streck."
syn = ["X", "rivs", "utgår"]
rules = ["rmink-forklaring"]

