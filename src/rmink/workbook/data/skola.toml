# rmink skola: områden, grupper och moment för arbetsböcker.
#
# En grupp samlar arbetsböcker som hör ihop och blir en mapp på plattan:
# rmink/Skola/<grupp>/<arbetsbok>/, eller rmink/Skola/<folder>/<grupp>/<arbetsbok>/
# när gruppen har en "folder", ämnets mapp (Matematik, Svenska, Engelska). Ett
# moment är det en arbetsbok övar.
# "brief" går till Claude när arbetsboken skrivs: vad som ska övas, i vilken
# ordning, typiska fel att fånga och vilka bilder eller modeller som hjälper.
# "grades" är de årskurser momentet passar (1-9). Texterna är egna; de följer
# Lgr22:s centrala innehåll i matematik, svenska och engelska men citerar det
# inte. En arbetsbok har inga bilder: figurer beskrivs i ord med sina mått.

[[group]]
id = "plus-minus"
title = "Plus och minus"
area = "Matte"
folder = "Matematik"
description = "Addition och subtraktion, från talkamrater till negativa tal."

[[group.topic]]
id = "talkamrater"
title = "Tiokamrater och talkamrater"
grades = [1, 2]
brief = """Talkamrater till 5, 10 och 20: vilka par blir tillsammans 10? Börja med \
bilder av prickar och fingrar, sedan bara tal. Visa att 3 + 7 och 7 + 3 är samma. \
Koppla till subtraktion: 10 - 3 är den talkamrat som saknas. Typiskt fel: att \
räkna ett för mycket när man räknar uppåt."""

[[group.topic]]
id = "positionssystemet"
title = "Ental, tiotal och hundratal"
grades = [1, 2, 3]
brief = """Positionssystemet: vad siffrorna i 347 betyder, att dela upp tal i \
hundratal, tiotal och ental och att bygga tal av dem. Jämför tal (större än, \
mindre än) och placera dem på en tallinje. Typiskt fel: att läsa 304 som 34 \
eller 3004 (nollan som platshållare)."""

[[group.topic]]
id = "tiotalsovergang"
title = "Huvudräkning över tiotalet"
grades = [2, 3]
brief = """Addition och subtraktion med tiotalsövergång i huvudet: 8 + 5 via \
8 + 2 + 3, 13 - 5 via 13 - 3 - 2. Hoppa på tallinjen. Därefter tvåsiffriga tal \
(37 + 25 = 37 + 20 + 5). Be eleven skriva hur de tänkte i några uppgifter. \
Typiskt fel: att glömma tiotalet som bildas."""

[[group.topic]]
id = "uppstallning-addition"
title = "Uppställning med minnessiffra"
grades = [3, 4]
brief = """Skriftlig addition med uppställning: ental under ental, minnessiffra \
när summan blir tio eller mer. Börja med två tresiffriga tal, sedan tre termer. \
Låt eleven överslagsräkna först och jämföra. Typiskt fel: siffrorna hamnar i fel \
kolumn, eller minnessiffran glöms."""

[[group.topic]]
id = "uppstallning-subtraktion"
title = "Subtraktion med växling"
grades = [3, 4, 5]
brief = """Skriftlig subtraktion med växling (lån): 52 - 27, sedan över nollor \
som 403 - 168. Visa växlingen med tiotalsstavar i ord. Kontrollera med addition \
(differensen + det man tog bort = det man började med). Typiskt fel: att ta den \
mindre siffran från den större i varje kolumn (52 - 27 = 35)."""

[[group.topic]]
id = "provning"
title = "Pröva och uppskatta"
grades = [3, 4, 5, 6]
brief = """Att kontrollera sina svar: överslagsräkning (avrunda till hela tiotal \
eller hundratal), pröva subtraktion med addition och tvärtom, och avgöra om ett \
svar är rimligt. Blanda uppgifter där ett färdigt svar är fel och eleven ska \
hitta felet."""

[[group.topic]]
id = "textuppgifter"
title = "Textuppgifter med plus och minus"
grades = [2, 3, 4, 5]
brief = """Vardagsproblem som löses med addition eller subtraktion: köpa, få \
växel, jämföra (hur många fler), ändring (först, sedan). Eleven ska skriva \
uträkning och svar med enhet. Ta med uppgifter med onödig information och \
uppgifter som kräver två steg. Typiskt fel: att addera för att ordet "fler" står \
i texten."""

[[group.topic]]
id = "decimaltal"
title = "Plus och minus med decimaltal"
grades = [4, 5, 6]
brief = """Addition och subtraktion med decimaltal: kronor och ören, meter och \
centimeter. Ställ upp med decimaltecknet under decimaltecknet; fyll ut med nollor \
(4,5 - 1,25 = 4,50 - 1,25). Typiskt fel: att ställa upp siffrorna från höger som \
med heltal."""

[[group.topic]]
id = "negativa-tal"
title = "Negativa tal"
grades = [6, 7, 8]
brief = """Negativa tal på tallinjen och termometern: ordna, jämföra, räkna \
temperaturskillnader. Sedan addition och subtraktion: -3 + 5, 2 - 6, och att \
subtrahera ett negativt tal (4 - (-2)). Typiskt fel: att tro att -8 är större än \
-3."""

[[group]]
id = "brak-division"
title = "Bråk och division"
area = "Matte"
folder = "Matematik"
description = "Division, bråk och hur de hänger ihop med decimaltal och procent."

[[group.topic]]
id = "division-delning"
title = "Division som delning"
grades = [2, 3, 4]
brief = """Division som att dela lika (12 kakor på 3 barn) och som innehåll (hur \
många 3-grupper finns i 12). Koppla till multiplikationstabellen: 12 / 3 = 4 för \
att 3 * 4 = 12. Skriv divisionen med snedstreck. Typiskt fel: att blanda ihop \
täljare och nämnare, 3 / 12."""

[[group.topic]]
id = "division-rest"
title = "Division med rest"
grades = [3, 4, 5]
brief = """Division som inte går jämnt ut: 17 / 5 = 3 rest 2. Vad gör man med \
resten i vardagen (fler bilar behövs, bitar blir över, dela resten i bråkdelar)? \
Kontrollera med 5 * 3 + 2 = 17. Typiskt fel: en rest som är större än det man \
delar med."""

[[group.topic]]
id = "kort-division"
title = "Kort division"
grades = [4, 5, 6]
brief = """Skriftlig division med kort division: 672 / 4 siffra för siffra med \
minnessiffra (rest) till nästa position. Börja utan rest, sedan med rest och med \
nolla i kvoten (412 / 4). Överslag först. Typiskt fel: att glömma nollan i \
kvoten, 412 / 4 = 13."""

[[group.topic]]
id = "brak-del-av-helhet"
title = "Bråk som del av en helhet"
grades = [2, 3, 4]
brief = """Vad ett bråk är: en pizza i fyra lika delar, tre av dem är 3/4. \
Täljare och nämnare. Delarna måste vara lika stora. Beskriv bilderna i ord, till \
exempel en rektangel i sex rutor där två är skuggade. Typiskt fel: att tro att \
1/8 är mer än 1/4 för att 8 är större än 4."""

[[group.topic]]
id = "brak-av-antal"
title = "Bråk av ett antal"
grades = [3, 4, 5]
brief = """Att räkna ut en del av ett antal: 1/3 av 12 (dela med 3), sedan 2/3 \
av 12 (dela med 3, gånger 2). Vardagsexempel med pengar, elever och godis. \
Typiskt fel: att bara dela med täljaren."""

[[group.topic]]
id = "brak-som-division"
title = "Bråk som division"
grades = [4, 5, 6]
brief = """Att ett bråk är en division: 3/4 betyder 3 delat med 4, alltså tre \
pizzor på fyra personer. Skriv divisioner som bråk och bråk som division, och \
räkna ut värdet som decimaltal (3/4 = 0,75). Bråk större än 1: 7/4 = 1 3/4."""

[[group.topic]]
id = "forlanga-forkorta"
title = "Förlänga och förkorta"
grades = [4, 5, 6, 7]
brief = """Likvärdiga bråk: 1/2 = 2/4 = 4/8. Förlänga (gånger samma tal uppe och \
nere) och förkorta (dela med samma tal). Förkorta så långt det går. Typiskt fel: \
att lägga till samma tal uppe och nere (1/2 = 2/3)."""

[[group.topic]]
id = "jamfora-brak"
title = "Jämföra och storleksordna bråk"
grades = [4, 5, 6, 7]
brief = """Vilket bråk är störst? Samma nämnare, samma täljare, jämförelse med \
1/2 och med 1, och gemensam nämnare. Placera bråk på en tallinje mellan 0 och 2. \
Typiskt fel: att jämföra bara nämnarna eller bara täljarna."""

[[group.topic]]
id = "blandad-form"
title = "Blandad form"
grades = [5, 6, 7]
brief = """Bråk i blandad form: 2 1/3 är två hela och en tredjedel. Skriv om \
mellan blandad form och bråkform (2 1/3 = 7/3) i båda riktningarna. Vardagsexempel \
med tårtor och recept. Typiskt fel: 2 1/3 = 3/3."""

[[group.topic]]
id = "addera-brak"
title = "Addera och subtrahera bråk"
grades = [5, 6, 7, 8]
brief = """Addition och subtraktion av bråk: först samma nämnare (2/5 + 1/5), \
sedan med gemensam nämnare (1/2 + 1/3 = 3/6 + 2/6), och blandad form. Förkorta \
svaret. Typiskt fel: att addera nämnarna, 1/2 + 1/3 = 2/5."""

[[group.topic]]
id = "multiplicera-dividera-brak"
title = "Multiplicera och dividera bråk"
grades = [7, 8, 9]
brief = """Bråk gånger heltal (3 * 2/5), bråk gånger bråk (2/3 * 3/4) och \
division med bråk (hur många 1/4 ryms i 3, sedan att multiplicera med det \
inverterade talet). Förklara varför division med ett tal mindre än 1 ger ett \
större svar."""

[[group.topic]]
id = "brak-decimal-procent"
title = "Bråk, decimaltal och procent"
grades = [5, 6, 7, 8, 9]
brief = """Samma tal på tre sätt: 1/4 = 0,25 = 25 %. Kända par (1/2, 1/4, 3/4, \
1/5, 1/10), omvandling åt alla håll och procent av ett belopp (20 % av 350 kr). \
Rea och ränta som vardagsexempel. Typiskt fel: 0,5 % tolkas som 50 %."""

[[group]]
id = "procent"
title = "Procent"
area = "Matte"
folder = "Matematik"
description = "Procent, andelar och förändringar, från hundradelar till ränta."

[[group.topic]]
id = "procent-begrepp"
title = "Vad procent är"
grades = [5, 6, 7]
brief = """Procent betyder hundradelar: 25 % = 25/100 = 0,25. Färglägg rutor i \
ett hundrarutnät, skriv samma andel som bråk, decimaltal och procent, och lär \
in kända par (50 % är hälften, 25 % en fjärdedel, 10 % en tiondel). Typiskt \
fel: att tro att 5 % är 0,5."""

[[group.topic]]
id = "procent-av"
title = "Procent av ett tal"
grades = [6, 7, 8]
brief = """Räkna ut procent av ett tal: först 10 % och 1 % i huvudet, sedan \
till exempel 30 % av 450 kr via 10 %, och med decimalform (0,3 * 450). \
Vardagsexempel med priser och klassens elever. Typiskt fel: att dela med \
procenttalet, 450 / 30."""

[[group.topic]]
id = "andel"
title = "Hur många procent?"
grades = [6, 7, 8, 9]
brief = """Andelen i procent: delen delad med det hela, 12 av 40 är 12/40 = \
0,3 = 30 %. Börja med lätta tal, sedan avrundning. Låt eleven skriva vad som \
är delen och vad som är det hela. Typiskt fel: att dela det hela med delen, \
eller att ta fel helhet."""

[[group.topic]]
id = "rabatt-okning"
title = "Rabatt, ökning och minskning"
grades = [7, 8, 9]
brief = """Ett pris som sänks eller höjs med en procentsats: 20 % rabatt på \
350 kr, en lön som höjs med 3 %. Räkna både förändringen och det nya värdet, \
och hur många procent något har ökat (från 80 till 100 är 25 %). Typiskt fel: \
att räkna procenten på det nya värdet i stället för det gamla."""

[[group.topic]]
id = "forandringsfaktor"
title = "Förändringsfaktor"
grades = [8, 9]
brief = """Förändringsfaktor: en ökning med 15 % är gånger 1,15, en minskning \
med 15 % gånger 0,85. Upprepade förändringar (två höjningar med 10 % är \
1,1 * 1,1 = 1,21, alltså 21 %). Typiskt fel: att tro att +10 % och sedan \
-10 % tar ut varandra."""

[[group.topic]]
id = "procentenheter"
title = "Procent och procentenheter"
grades = [8, 9]
brief = """Skillnaden mellan procent och procentenheter: räntan går från 2 % \
till 3 %, en ökning med 1 procentenhet men med 50 %. Exempel med räntor, \
opinionsmätningar och rabatter. Typiskt fel: att säga att räntan ökade med \
1 %."""

[[group.topic]]
id = "ranta"
title = "Ränta och lån"
grades = [8, 9]
brief = """Ränta på sparande och lån: årsränta på ett belopp, ränta för en del \
av ett år, och ränta på ränta över några år med förändringsfaktor. Jämför två \
lån eller sparkonton. Typiskt fel: att lägga ihop räntan varje år utan att \
räkna med räntan på räntan."""

[[group]]
id = "multiplikation"
title = "Multiplikation"
area = "Matte"
folder = "Matematik"
description = "Multiplikation, från upprepad addition och tabellerna till decimaltal och räkneordning."

[[group.topic]]
id = "upprepad-addition"
title = "Multiplikation som upprepad addition"
grades = [2, 3]
brief = """Gånger är lika stora grupper: 3 påsar med 4 äpplen är 4 + 4 + 4 = \
3 · 4. Beskriv grupper och rader i ord (4 rader med 5 stolar), låt eleven \
skriva både additionen och multiplikationen, och visa att 3 · 4 och 4 · 3 \
blir lika mycket. Skriv gånger med punkt (·) som i skolan. Typiskt fel: att \
lägga ihop antalet grupper och antalet i varje grupp, 3 + 4."""

[[group.topic]]
id = "tabellerna"
title = "Multiplikationstabellerna"
grades = [2, 3, 4, 5]
brief = """Tabellerna 1 till 10, i en ordning som bygger på varandra: 2, 5 och \
10 först, sedan 4 (dubbla tvåan), 3 och 6, sist 7, 8 och 9. Strategier: \
dubbla, tänk tiotabellen minus en grupp för nian, byt plats på faktorerna. \
Blanda raka frågor med luckor (6 · _ = 42). Typiskt fel: att blanda ihop \
grannar i tabellen, 7 · 8 = 54 eller 6 · 7 = 48."""

[[group.topic]]
id = "tio-hundra-tusen"
title = "Gånger 10, 100 och 1000"
grades = [3, 4, 5, 6]
brief = """Gånger 10, 100 och 1000 flyttar siffrorna ett, två eller tre steg i \
positionssystemet: 34 · 10 = 340, 3,4 · 100 = 340. Sedan tiotal gånger ental i \
huvudet (30 · 6 = 180, 40 · 50 = 2000). Typiskt fel: att "lägga till en nolla" \
även på decimaltal, 3,4 · 10 = 3,40."""

[[group.topic]]
id = "uppstallning-multiplikation"
title = "Multiplikation med uppställning"
grades = [4, 5, 6]
brief = """Uppställning med en ensiffrig faktor först (346 · 7) med minnessiffror, \
sedan tvåsiffrig (346 · 27) med två delprodukter. Låt eleven göra ett överslag \
först och jämföra svaret med det. Typiskt fel: att glömma minnessiffran, eller \
att inte flytta den andra delprodukten ett steg till vänster."""

[[group.topic]]
id = "multiplikation-decimaltal"
title = "Multiplikation med decimaltal"
grades = [5, 6, 7]
brief = """Decimaltal gånger heltal (2,35 · 4) och decimaltal gånger decimaltal \
(1,5 · 0,4): räkna som med heltal, och sätt sedan kommat så att svaret har lika \
många decimaler som faktorerna tillsammans. Kontrollera med överslag. Vardag: \
priser per kilo och liter. Typiskt fel: att tro att gånger alltid gör talet \
större, 8 · 0,5 = 16."""

[[group.topic]]
id = "rakneordning"
title = "Räkneordning och parenteser"
grades = [5, 6, 7, 8]
brief = """Prioriteringsregler: parenteser först, sedan gånger och delat, sist \
plus och minus. 2 + 3 · 4 = 14, (2 + 3) · 4 = 20. Låt eleven räkna steg för \
steg och sätta ut parenteser så att ett givet svar blir rätt. För de äldre: \
potenser. Typiskt fel: att räkna från vänster till höger, 2 + 3 · 4 = 20."""

[[group.topic]]
id = "textuppgifter-multiplikation"
title = "Textuppgifter med gånger och delat"
grades = [3, 4, 5, 6]
brief = """Vardagsproblem där eleven själv väljer räknesätt: lika stora grupper, \
pris gånger antal, hur många gånger något ryms. Låt eleven skriva uträkningen \
och svaret med enhet, och blanda in en uppgift med plus eller minus. Typiskt \
fel: att välja räknesätt efter orden ("fler" betyder plus) i stället för \
efter vad som händer."""

[[group]]
id = "geometri"
title = "Geometri"
area = "Matte"
folder = "Matematik"
description = "Former, mätning, omkrets, area, vinklar, skala och volym."

[[group.topic]]
id = "former"
title = "Former och figurer"
grades = [1, 2, 3]
brief = """De vanliga formerna: kvadrat, rektangel, triangel och cirkel, sedan \
kub, rätblock, klot och cylinder. Arbetsboken har inga bilder, så beskriv \
formerna i ord och fråga efter namn, antal hörn och sidor, och var formen finns \
i vardagen. Typiskt fel: att inte räkna en kvadrat som en rektangel, eller att \
kalla ett klot för en cirkel."""

[[group.topic]]
id = "langd-matt"
title = "Längd och längdenheter"
grades = [2, 3, 4, 5]
brief = """Längd i mm, cm, dm, m och km: hur långa saker ungefär är (en tumme är \
2 cm), och byten mellan enheterna (1 m = 100 cm, 35 mm = 3,5 cm). Låt eleven \
uppskatta först och sedan räkna. Svaret skrivs alltid med enhet. Typiskt fel: \
att flytta kommat åt fel håll, 2,5 m = 25 cm."""

[[group.topic]]
id = "omkrets"
title = "Omkrets"
grades = [3, 4, 5, 6]
brief = """Omkrets är längden runt en figur: lägg ihop alla sidor. Beskriv \
figurerna med mått i ord (en rektangel som är 7 cm lång och 3 cm bred), och \
låt eleven räkna åt andra hållet, vilken sida som saknas när omkretsen är känd. \
Vardag: staket runt en trädgård. Typiskt fel: att bara lägga ihop två sidor av \
rektangeln, eller att blanda ihop omkrets och area."""

[[group.topic]]
id = "area"
title = "Area av rektangel och triangel"
grades = [4, 5, 6, 7]
brief = """Area är hur stor en yta är, i kvadratcentimeter och kvadratmeter. \
Rektangel: basen gånger höjden. Triangel: basen gånger höjden delat med två, \
och varför (en halv rektangel). Sedan sammansatta figurer, som ett L-format rum \
beskrivet med mått. Typiskt fel: cm i stället för cm², och att ta en sned sida \
som höjd i triangeln."""

[[group.topic]]
id = "vinklar"
title = "Vinklar"
grades = [4, 5, 6, 7]
brief = """Räta, spetsiga och trubbiga vinklar, och vinklar i grader. Klockans \
visare som exempel (klockan tre är 90°). Vinkelsumman i en triangel är 180° och \
i en fyrhörning 360°: räkna ut den vinkel som saknas. Typiskt fel: att tro att \
en vinkel blir större när vinkelbenen ritas längre, och att subtrahera från \
360° i en triangel."""

[[group.topic]]
id = "skala"
title = "Skala"
grades = [5, 6, 7, 8]
brief = """Förminskning och förstoring: skala 1:100 betyder att 1 cm på ritningen \
är 100 cm i verkligheten. Räkna från karta eller ritning till verklighet och \
tillbaka, och byt enhet i svaret (4 cm i 1:50 000 är 2 km). För de äldre: \
förstoring som 5:1. Typiskt fel: att multiplicera när man ska dividera, och att \
glömma att byta enhet."""

[[group.topic]]
id = "volym"
title = "Volym"
grades = [6, 7, 8, 9]
brief = """Volymen av ett rätblock: längd gånger bredd gånger höjd, i cm³ och m³. \
Liter och kubikdecimeter (1 dm³ = 1 liter, 1 cm³ = 1 ml). Vardag: ett akvarium \
eller ett mjölkpaket beskrivna med mått. För de äldre: cylinder (basytan gånger \
höjden). Typiskt fel: att tro att 1 m³ är 100 liter."""

[[group.topic]]
id = "cirkeln"
title = "Cirkelns omkrets och area"
grades = [7, 8, 9]
brief = """Radie och diameter, omkretsen pi gånger diametern och arean pi gånger \
radien i kvadrat, med pi ungefär 3,14. Börja med att skilja radie från \
diameter, sedan beräkningar med avrundning, och sist en halv eller en kvarts \
cirkel. Typiskt fel: diametern i areaformeln, och att kvadrera pi i stället \
för radien."""

[[group.topic]]
id = "pythagoras"
title = "Pythagoras sats"
grades = [8, 9]
brief = """I en rätvinklig triangel är kateternas kvadrater tillsammans lika med \
hypotenusans kvadrat: a² + b² = c². Börja med att peka ut hypotenusan, räkna \
sedan den långa sidan och därefter en katet. Vardag: en stege mot en vägg, \
diagonalen i en rektangel. Typiskt fel: a + b = c, och att glömma roten ur."""

[[group]]
id = "grammatik"
title = "Grammatik"
area = "Svenska"
folder = "Svenska"
description = "Svensk grammatik: ordklasser, böjningar, meningar och satsdelar."

[[group.topic]]
id = "meningar-skiljetecken"
title = "Meningar och skiljetecken"
grades = [1, 2, 3, 4]
brief = """Vad en mening är: stor bokstav i början, punkt, frågetecken eller \
utropstecken i slutet. Låt eleven sätta ut stor bokstav och skiljetecken i en \
kort text utan dem, och välja rätt tecken till påståenden, frågor och utrop. \
För de äldre: kommatecken i uppräkningar. Typiskt fel: en lång rad meningar \
hopkopplade med "och sen"."""

[[group.topic]]
id = "substantiv"
title = "Substantiv: en och ett, singular och plural"
grades = [2, 3, 4, 5]
brief = """Substantiv är namn på saker, djur, personer och känslor. Pröva med \
"en" eller "ett" framför. Böj i obestämd och bestämd form, singular och plural \
(en bil, bilen, bilar, bilarna). Typiskt fel: att räkna "springa" eller "glad" \
som substantiv, och oregelbundna plural som "mus - möss" och "fot - fötter"."""

[[group.topic]]
id = "verb-tempus"
title = "Verb och tempus"
grades = [3, 4, 5, 6, 7]
brief = """Verb är det man gör eller är. Pröva med "att" framför. Tempus: \
presens, preteritum, perfekt och futurum (springer, sprang, har sprungit, ska \
springa), först med regelbundna verb, sedan starka verb. Låt eleven skriva om \
en kort text från nutid till dåtid. Typiskt fel: "springde", "har sprang"."""

[[group.topic]]
id = "adjektiv"
title = "Adjektiv och komparation"
grades = [3, 4, 5, 6]
brief = """Adjektiv beskriver hur något är och böjs efter substantivet (en röd \
bil, ett rött hus, röda bilar). Komparation: positiv, komparativ och superlativ \
(stor, större, störst; vacker, vackrare, vackrast; bra, bättre, bäst). \
Typiskt fel: "mer stor", "bästaste" och att glömma -t efter ett-ord."""

[[group.topic]]
id = "ordklasser"
title = "Fler ordklasser"
grades = [5, 6, 7, 8, 9]
brief = """Ordklasserna utöver substantiv, verb och adjektiv: pronomen, adverb, \
prepositioner, konjunktioner, räkneord och interjektioner. Ge ett test för \
varje ordklass och låt eleven sortera orden i några meningar. Typiskt fel: att \
blanda ihop adverb och adjektiv ("hon sjunger fin"), och "de" och "dem"."""

[[group.topic]]
id = "satsdelar"
title = "Satsdelar"
grades = [6, 7, 8, 9]
brief = """Satsdelar: predikat, subjekt, objekt och adverbial. Börja med att \
hitta verbet (predikatet), fråga sedan "vem eller vad gör det?" för subjektet \
och "vad?" eller "vem?" för objektet. Adverbial svarar på när, var, hur. \
Typiskt fel: att ta ordet först i meningen som subjekt ("Igår åt Sara glass")."""

[[group.topic]]
id = "huvudsats-bisats"
title = "Huvudsats och bisats"
grades = [7, 8, 9]
brief = """En huvudsats kan stå ensam, en bisats kan det inte. Bisatsen börjar \
ofta med en subjunktion (att, eftersom, när, som, om). Ordföljd: "inte" står \
före verbet i bisatsen (Hon säger att hon inte kommer). Kommatecken mellan \
huvudsats och bisats. Typiskt fel: "eftersom han kom inte" och meningar som \
bara är en bisats."""

[[group]]
id = "stavning"
title = "Stavning"
area = "Svenska"
folder = "Svenska"
description = "Stavning och ljud: dubbelteckning, sj- och tj-ljud, j-ljud, ng och vanliga svåra ord."

[[group.topic]]
id = "ljud-bokstav"
title = "Ljud och bokstäver"
grades = [1, 2]
brief = """Ljuda ord och skriv dem: korta ord med en bokstav för varje ljud (sol, \
mus, katt). Vokaler och konsonanter, och att varje stavelse har en vokal. \
Arbetsboken har inget ljud, så ge ordet i en mening med en lucka eller en \
beskrivning (det lyser på dagen: s _ l). Typiskt fel: att hoppa över en vokal, \
"mrk" för mörk."""

[[group.topic]]
id = "dubbelteckning"
title = "Dubbelteckning"
grades = [2, 3, 4, 5]
brief = """Kort vokal följs ofta av två konsonanter, lång vokal av en: tak och \
tack, glas och glass, vila och villa. Låt eleven välja rätt ord till en mening \
och fylla i luckor. För de äldre: m dubbeltecknas inte i slutet (rum, hem) och \
böjningar som "glass - glasset". Typiskt fel: dubbel konsonant efter lång vokal, \
"maat"."""

[[group.topic]]
id = "sj-tj-ljud"
title = "Sj-ljud och tj-ljud"
grades = [3, 4, 5, 6]
brief = """De många stavningarna av sj-ljudet (sj, skj, stj, sk, sch, ch, -tion: \
sjö, skjorta, stjärna, sked, schampo, choklad, station) och tj-ljudet (tj, k, \
kj: tjock, kind, kjol). Låt eleven sortera ord efter stavning och fylla i luckor \
i meningar. Typiskt fel: "sjorta", "tjind", och att skriva sj framför e, i, y, \
ä, ö där det ska vara sk."""

[[group.topic]]
id = "j-ljud"
title = "J-ljudet"
grades = [3, 4, 5]
brief = """J-ljudet stavas j, g, gj, hj, dj och lj: jul, ge, gjorde, hjul, djur, \
ljus. Mönster att lära: g framför e, i, y, ä, ö (ge, gilla), hj och dj i några \
vanliga ord. Fyll i luckor och rätta en kort text med fel. Typiskt fel: "jöra", \
"jul" för hjul och "jur" för djur."""

[[group.topic]]
id = "ng-ljud"
title = "Ng-ljudet"
grades = [2, 3, 4]
brief = """Ng-ljudet skrivs ng (sång, ring), n framför k (bank, tänka) och gn i \
några ord (vagn, regn, lugn). Låt eleven fylla i ng eller nk i luckor och böja \
ord (sjunga, sjöng). Typiskt fel: "bangk", "rengn" och "lungn"."""

[[group.topic]]
id = "svara-ord"
title = "Vanliga svåra ord"
grades = [3, 4, 5, 6, 7]
brief = """Ord som ofta stavas fel: och, också, jag, det, de, dem, någon, några, \
något, sedan, ju, gjorde, varför, alltid, mycket. Ge orden i meningar med \
luckor, låt eleven rätta en kort text med fel och skriva egna meningar med \
orden. Typiskt fel: "å" för och, "nån" i skrift, "de" och "dem" om vartannat."""

[[group.topic]]
id = "sammansatta-ord"
title = "Sammansatta ord och särskrivning"
grades = [4, 5, 6, 7, 8, 9]
brief = """Sammansatta ord skrivs ihop: fotbollsmatch, glasskiosk. Visa hur \
särskrivning ändrar betydelsen (en brun hårig hund, en brunhårig hund) och \
fogeljudet -s- (fotbollsplan). Låt eleven sätta ihop ord, välja rätt variant \
och förklara skillnaden. Typiskt fel: "fotbolls match", "kyckling lever"."""

[[group]]
id = "engelska-glosor"
title = "Glosor"
area = "Engelska"
folder = "Engelska"
description = "Engelska ord och fraser efter tema, från färger och djur till resor och känslor."

[[group.topic]]
id = "farger-siffror"
title = "Colours and numbers"
grades = [1, 2, 3]
brief = """Färger och talen 1 till 20 på engelska, sedan tiotalen till 100. \
Instruktionerna skrivs på svenska för de yngre. Översätt åt båda hållen, skriv \
talet med bokstäver (14 = fourteen) och fyll i en mening (The sky is ...). \
Både "grey" och "gray" är rätt. Typiskt fel: "fourty", och "thirteen" och \
"thirty" om vartannat."""

[[group.topic]]
id = "djur-mat"
title = "Animals and food"
grades = [1, 2, 3, 4]
brief = """Vanliga djur och maträtter, med a och an (a dog, an apple) och plural \
med -s. Översätt ord, para ihop ord och svenska ord, och svara på enkla frågor \
(What do you like to eat?). Instruktionerna på svenska för de yngre. Typiskt \
fel: "a apple", och oregelbundna plural som "mouses" och "sheeps"."""

[[group.topic]]
id = "familj-kropp"
title = "Family and body"
grades = [2, 3, 4, 5]
brief = """Familjen (mother, brother, aunt, cousin) och kroppen (head, arm, knee). \
Låt eleven skriva om sin familj i korta meningar (I have one sister) och \
översätta. För de äldre: possessiv med 's (my sister's room). Typiskt fel: \
"my sister room", och stavningen av "daughter" och "knee"."""

[[group.topic]]
id = "skola-fritid"
title = "School and free time"
grades = [3, 4, 5, 6]
brief = """Skolämnen, saker i klassrummet, veckodagar och fritidsaktiviteter. \
Meningar med "I like / I don't like" och "On Mondays I ...". Veckodagar och \
månader skrivs med stor bokstav på engelska. Typiskt fel: "monday" med liten \
bokstav, och "I like play" i stället för "I like playing"."""

[[group.topic]]
id = "tid-vader"
title = "Time and weather"
grades = [4, 5, 6, 7]
brief = """Klockan (half past three, quarter to five), datum och årstider, och \
vädret (It is sunny, It is raining). Låt eleven skriva tider med ord och \
beskriva vädret i en mening. Typiskt fel: "half three" tolkat som halv tre, \
fast det är halv fyra på svenska, och "It is rain"."""

[[group.topic]]
id = "resor-stad"
title = "Travelling and the town"
grades = [5, 6, 7, 8]
brief = """Ord för resor och staden: transport, byggnader, vägbeskrivningar (turn \
left, go straight on, next to). Låt eleven fråga om och beskriva vägen i \
meningar och översätta fraser. Typiskt fel: falska vänner som "station" för \
busshållplats (bus stop), och "in the bus" i stället för "on the bus"."""

[[group.topic]]
id = "kanslor-adjektiv"
title = "Feelings and describing words"
grades = [6, 7, 8, 9]
brief = """Känslor och beskrivande adjektiv (excited, worried, embarrassed, \
reliable), med komparation (bigger, more interesting, the best). Låt eleven \
beskriva en person eller en händelse och välja rätt ord i en kort text. \
Typiskt fel: "more big", "gooder", och "bored" och "boring" om vartannat."""
